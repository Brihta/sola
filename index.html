<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brihta — Šola</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="icon" href="brihta.png" sizes="256x256">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Brihta Šola">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fff8ef">
  <link rel="preload" href="pisave/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="pisave/nunito.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #fff8ef;
      --surface: #ffffff;
      --ink: #1f2340;
      --muted: #6b6f8a;
      --line: #efe6d8;
      --line-2: #e4d9c7;
      --accent: #6c5ce7;
      --accent-2: #a855f7;
      --accent-ink: #4b3fd1;
      --good: #16a34a;
      --bad: #e11d48;
      --sun: #ffb020;
      --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
      --shadow: 0 1px 2px rgba(31,35,64,.05), 0 10px 30px -14px rgba(31,35,64,.28);
      --shadow-up: 0 2px 4px rgba(31,35,64,.06), 0 22px 40px -18px rgba(31,35,64,.38);
      --head: 'Brihta Emoji', 'Nunito', system-ui, sans-serif;
    }
    /* emoji-pisava:zacetek */
    /* Barvni emojiji (Noto Color Emoji COLRv1, podmnožica; scripts/emoji_pisava.py).
       tech() poskrbi, da jo naložijo samo brskalniki s COLRv1 (Chrome, Edge, Firefox);
       Safari na iPadih obdrži svoje emojije. */
    @font-face {
      font-family: 'Brihta Emoji';
      src: url('pisave/brihta-emoji.woff2?v=9631d930') format('woff2') tech(color-COLRv1);
      font-display: swap;
      unicode-range: U+200D, U+2195, U+23E9, U+23F0, U+26A0-26A1, U+26BD, U+26D4, U+2705, U+270A, U+270D, U+270F, U+2728, U+2B1C, U+2B50, U+1F1E7, U+1F1EC, U+1F308, U+1F30D, U+1F319, U+1F31F, U+1F331, U+1F355, U+1F389, U+1F3A8, U+1F3AE-1F3AF, U+1F3B5, U+1F3C1, U+1F3C6, U+1F3EB, U+1F409-1F40A, U+1F40C, U+1F418-1F419, U+1F41D, U+1F422, U+1F427, U+1F42C, U+1F431, U+1F436, U+1F438, U+1F441, U+1F449, U+1F44B, U+1F44D, U+1F464-1F465, U+1F468, U+1F47E, U+1F4A1, U+1F4AA, U+1F4BB, U+1F4BE, U+1F4C1, U+1F4C4, U+1F4CA, U+1F4CC, U+1F4D0, U+1F4D6, U+1F4DA, U+1F501, U+1F507, U+1F50A, U+1F50E, U+1F511-1F512, U+1F517, U+1F522, U+1F590, U+1F5B1, U+1F5BC, U+1F5D1, U+1F5FA, U+1F604, U+1F62C, U+1F648, U+1F64B, U+1F680, U+1F6A2, U+1F914, U+1F916, U+1F938, U+1F941, U+1F947-1F949, U+1F981, U+1F984, U+1F989-1F98B, U+1F992, U+1F996, U+1F9A1, U+1F9AB, U+1F9D1-1F9D2, U+1F9E0, U+1F9E9-1F9EA;
    }
    /* emoji-pisava:konec */
    html, body { margin: 0; }
    body {
      font-family: 'Brihta Emoji', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(rgba(31,35,64,.07) 1.2px, transparent 1.3px);
      background-size: 22px 22px;
      font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--accent-ink); }
    button { font: inherit; color: inherit; }
    h1, h2, h3 { font-family: var(--head); font-weight: 900; margin: 0; line-height: 1.15; letter-spacing: -.02em; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ─── Top bar ─── */
    .top {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,248,239,.82);
      backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
      border-bottom: 1px solid rgba(228,217,199,.7);
    }
    .top-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
    .brand img { width: 46px; height: 46px; display: block; filter: drop-shadow(0 4px 8px rgba(31,35,64,.18)); transition: transform .25s; }
    .brand:hover img { transform: rotate(-8deg) scale(1.05); }
    .brand b { font-family: var(--head); font-size: 1.45rem; font-weight: 900; letter-spacing: -.02em; }
    .brand b span { color: var(--accent); }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px;
      border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface);
      font-weight: 800; cursor: pointer; text-decoration: none; color: var(--ink);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .pill-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: #d5c7b0; }
    .pill-btn svg { width: 20px; height: 20px; }
    .pill-btn.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,.18); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; background: linear-gradient(135deg, #ffe7c2, #ffd1e8); margin-left: -8px; }
    .acct-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trail { max-width: 1180px; margin: 0 auto; padding: 14px 20px 0; font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 20px; }
    .trail a { color: var(--muted); text-decoration: none; font-weight: 700; }
    .trail a:hover { color: var(--ink); }
    .trail .sep { opacity: .5; }
    .trail .cur { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }

    main { max-width: 1180px; margin: 0 auto; padding: 14px 20px 60px; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
      height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 800; font-size: 1rem;
      border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); text-decoration: none; white-space: nowrap;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn.disabled { opacity: .55; pointer-events: none; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-go {
      border: 0; color: #fff; background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, var(--accent-2)));
      box-shadow: 0 8px 18px -8px var(--c1, var(--accent));
    }
    .btn-go:hover { box-shadow: 0 12px 24px -10px var(--c1, var(--accent)); }
    .btn.zaklenjeno { opacity: .4; filter: grayscale(.7); cursor: not-allowed; box-shadow: none; }
    .btn.tresi { animation: tresi .35s; }
    @keyframes tresi { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .btn-big { height: 54px; padding: 0 26px; font-size: 1.1rem; }
    .btn-block { width: 100%; }

    /* ─── Dashboard ─── */
    .hello {
      position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center;
      background: linear-gradient(120deg, #2a2366 0%, #5b3fd6 55%, #a855f7 100%);
      color: #fff; border-radius: var(--r-xl); padding: 30px 34px; overflow: hidden; margin: 6px 0 28px;
      box-shadow: var(--shadow-up);
    }
    .hello::before, .hello::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
    .hello::before { width: 260px; height: 260px; right: -60px; top: -110px; background: radial-gradient(circle, rgba(255,176,32,.55), transparent 70%); }
    .hello::after { width: 220px; height: 220px; left: 30%; bottom: -150px; background: radial-gradient(circle, rgba(56,189,248,.45), transparent 70%); }
    .hello > * { position: relative; }
    .hello .date { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; opacity: .8; }
    .hello h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); margin: 4px 0 8px; }
    .hello p { margin: 0; font-size: 1.08rem; opacity: .92; max-width: 560px; }
    .hello .resume { margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); color: #fff; padding: 8px 8px 8px 16px; border-radius: 999px; text-decoration: none; font-weight: 800; transition: background .15s; }
    .hello .resume:hover { background: rgba(255,255,255,.26); }
    .hello .resume span { background: #fff; color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-size: .9rem; white-space: nowrap; }
    .owl { display: flex; align-items: flex-end; }
    .owl img { width: 128px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.3)); animation: bob 4s ease-in-out infinite; }
    .bubble { background: #fff; color: var(--ink); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-weight: 700; font-size: .92rem; max-width: 220px; margin-bottom: 92px; margin-right: -14px; box-shadow: 0 8px 20px -10px rgba(0,0,0,.4); }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(2deg); } }

    .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
    .sec-h h2 { font-size: 1.5rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
    .card {
      position: relative; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg);
      text-decoration: none; color: var(--ink); box-shadow: var(--shadow); overflow: hidden;
      transition: transform .2s cubic-bezier(.2,.8,.3,1.4), box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow-up); }
    .card:hover .art .emoji { animation: wiggle .5s ease-in-out; }
    .card.wide { grid-column: span 2; }
    .card > a { color: inherit; text-decoration: none; display: block; }
    .art {
      position: relative; height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: linear-gradient(135deg, var(--c1), var(--c2));
    }
    .art::before { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.16); top: -70px; left: -50px; }
    .art::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 42% 58% 60% 40%; background: rgba(255,255,255,.12); bottom: -50px; right: -20px; }
    .art .emoji { font-size: 74px; line-height: 1; position: relative; z-index: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }
    .art .new { position: absolute; top: 12px; right: 12px; z-index: 1; background: var(--sun); color: #3b2500; font-weight: 800; font-size: .78rem; padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.35); animation: pop .5s ease-out; }
    @keyframes wiggle { 25% { transform: rotate(-10deg) scale(1.08); } 60% { transform: rotate(8deg) scale(1.08); } }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .card-body { padding: 14px 18px 16px; display: flex; align-items: center; gap: 10px; }
    .card-body h3 { font-size: 1.2rem; }
    .card-body p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; font-weight: 600; }
    .card-body .go { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s, color .2s; }
    .card:hover .go { background: var(--c1); color: #fff; }
    .card-body .go svg { width: 18px; height: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 18px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: .92rem;
      text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--c1) 12%, white); border: 1.5px solid color-mix(in srgb, var(--c1) 30%, white);
      transition: transform .15s, background .15s, color .15s;
    }
    .chip:hover { transform: translateY(-2px); background: var(--c1); color: #fff; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }

    /* ─── Subject banner ─── */
    .banner {
      position: relative; border-radius: var(--r-xl); padding: 26px 30px 0; color: #fff; overflow: hidden; margin: 6px 0 26px;
      background: linear-gradient(120deg, var(--c1), var(--c2)); box-shadow: var(--shadow-up);
    }
    .banner::before { content: ''; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: rgba(255,255,255,.12); right: -80px; top: -140px; }
    .banner::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.18) 1.4px, transparent 1.5px); background-size: 20px 20px; mask-image: linear-gradient(90deg, transparent 40%, #000); -webkit-mask-image: linear-gradient(90deg, transparent 40%, #000); pointer-events: none; }
    .banner > * { position: relative; z-index: 1; }
    .banner-top { display: flex; align-items: center; gap: 18px; }
    .banner .emoji { font-size: 64px; line-height: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }
    .banner h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
    .banner p { margin: 4px 0 0; font-weight: 700; opacity: .9; }
    .banner-sw { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .banner-sw a { color: #fff; text-decoration: none; font-weight: 800; font-size: .88rem; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.26); }
    .banner-sw a:hover { background: rgba(255,255,255,.28); }
    .tabs { display: flex; gap: 4px; margin-top: 20px; }
    .tabs a { color: #fff; text-decoration: none; font-weight: 800; padding: 10px 18px 12px; border-radius: 16px 16px 0 0; opacity: .85; }
    .tabs a:hover { opacity: 1; background: rgba(255,255,255,.12); }
    .tabs a.active { background: var(--bg); color: var(--ink); opacity: 1; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
    .layout.solo { grid-template-columns: minmax(0, 1fr); }
    .layout.ozko { max-width: 860px; margin: 0 auto; }
    .side { position: sticky; top: 90px; display: grid; gap: 18px; }
    .box { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); }
    .box h3 { font-size: 1.1rem; margin-bottom: 10px; }
    .box ul { list-style: none; margin: 0; padding: 0; }
    .box li { padding: 6px 0; font-weight: 600; }
    .note { color: var(--muted); font-size: .9rem; margin: 6px 0; }

    /* Today hero */
    .today {
      position: relative; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      background: var(--surface); border-radius: var(--r-xl); padding: 24px; margin: 8px 0 30px; box-shadow: var(--shadow-up);
      border: 2px solid color-mix(in srgb, var(--c1) 35%, white);
    }
    .today .label {
      position: absolute; top: -13px; left: 22px; background: var(--sun); color: #3b2500; font-weight: 800; font-size: .78rem;
      letter-spacing: .06em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.3);
    }
    .tile { width: 64px; height: 64px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--t) 13%, white); color: var(--t); }
    .tile svg { width: 34px; height: 34px; }
    .tile.sm { width: 46px; height: 46px; border-radius: 14px; }
    .tile.sm svg { width: 24px; height: 24px; }
    .tile.xs { width: 34px; height: 34px; border-radius: 10px; }
    .tile.xs svg { width: 18px; height: 18px; }
    .today .txt { flex: 1; min-width: 200px; }
    .today h2 { font-size: 1.6rem; }
    .today p { margin: 4px 0 0; color: var(--muted); font-weight: 700; }

    /* Weeks */
    .week { margin-bottom: 26px; }
    .week-h { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 4px 2px 10px; cursor: pointer; text-align: left; }
    .week-h h3 { font-size: 1.15rem; }
    .week-h .count { background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 999px; font-size: .8rem; font-weight: 800; padding: 1px 9px; color: var(--muted); }
    .week-h .chev { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line-2); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
    .week-h .chev svg { width: 16px; height: 16px; }
    .week.closed .chev { transform: rotate(-90deg); }
    .week.closed .items { display: none; }
    .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .item a {
      display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; background: var(--surface); border-radius: var(--r-md);
      text-decoration: none; color: var(--ink); box-shadow: 0 1px 2px rgba(31,35,64,.05); border: 1.5px solid transparent;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .item a:hover { transform: translateX(4px); border-color: color-mix(in srgb, var(--c1) 40%, white); box-shadow: var(--shadow); }
    .item .nm { flex: 1; min-width: 0; }
    .item .nm b { display: block; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .nm small { color: var(--muted); font-weight: 600; }
    .item .arrow { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .tag { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
    .tag.new { background: var(--sun); color: #3b2500; }
    .tag.done { background: #dcfce7; color: #166534; }
    .tag.hid { background: #ede9fe; color: #5b21b6; }
    /* Učitelj: objava/skrivanje in nalaganje */
    .item.ucit { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .item.ucit > a { flex: 1; min-width: 0; }
    .item.skrito > a { opacity: .6; border-style: dashed; border-color: var(--line-2); }
    .vis { flex-shrink: 0; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 999px;
           padding: 8px 12px; font: inherit; font-size: .82rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .vis.on { background: #dcfce7; border-color: #86efac; color: #166534; }
    .vis:disabled { opacity: .5; cursor: wait; }
    .upl { background: var(--surface); border-radius: var(--r-xl); padding: 24px; box-shadow: var(--shadow); max-width: 640px; }
    .upl .field { margin-bottom: 16px; }
    .upl label { display: block; font-weight: 800; margin-bottom: 6px; }
    .upl input[type=text], .upl input[type=date] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); }
    .upl .drop { display: block; border: 2px dashed var(--line-2); border-radius: 16px; padding: 22px; text-align: center; cursor: pointer; font-weight: 700; color: var(--muted); }
    .upl .drop.ima { border-color: color-mix(in srgb, var(--c1) 60%, white); color: var(--ink); }
    .upl .drop input { display: none; }
    .upl .chk { display: flex; gap: 10px; align-items: center; font-weight: 700; margin-bottom: 18px; }
    .upl .chk input { width: 20px; height: 20px; }
    /* Predmeti učiteljev: izbira ikone, barve in razredov */
    .tp-izbira { display: flex; flex-wrap: wrap; gap: 8px; }
    .upl .tp-moz { display: inline-block; margin: 0; cursor: pointer; position: relative; }
    .tp-moz input { position: absolute; opacity: 0; pointer-events: none; }
    .tp-moz span { display: grid; place-items: center; min-width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--surface); font-weight: 800; }
    .tp-em { font-size: 1.4rem; }
    .tp-raz { padding: 0 12px; }
    .tp-bar { width: 44px; border-color: transparent !important; }
    .tp-moz input:checked + span { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
    .tp-moz input:checked + .tp-raz { background: var(--ink); color: var(--surface); }
    .tp-moz input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

    .open-card p { color: var(--muted); word-break: break-all; font-weight: 600; }
    .seq { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

    /* ─── Učna ura ─── */

    .step a:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c1) 45%, white); }
    .step .n { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--line); font-weight: 900; font-size: .95rem; }

    .badge { background: color-mix(in srgb, var(--c1) 14%, white); color: color-mix(in srgb, var(--c1) 70%, black); font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; padding: 5px 12px; border-radius: 999px; }

    /* ─── Quiz ─── */
    .progress {
      position: sticky; top: 72px; z-index: 5; display: flex; align-items: center; gap: 14px; margin: 0 0 20px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 999px; padding: 10px 18px; box-shadow: var(--shadow); font-weight: 800;
    }

    .progress .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .35s cubic-bezier(.2,.8,.3,1.2); }

    dialog.iskalnik { width: min(860px, 94vw); max-height: 88vh; border: 0; border-radius: var(--r-xl); padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.25); background: var(--surface); }
    dialog.iskalnik::backdrop { background: rgba(30, 20, 10, .45); }
    .isk-glava { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

    .isk-cipi { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }

    .isk-mreza { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-height: 56vh; overflow-y: auto; }
    .isk-sl { padding: 0; border: 3px solid transparent; border-radius: 12px; overflow: hidden; cursor: pointer; background: #f3efe8; aspect-ratio: 4 / 3; }
    .isk-sl img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .isk-sl:hover:not(:disabled), .isk-sl.izbrana { border-color: var(--accent, #6366f1); }
    .isk-sl:disabled:not(.izbrana) { opacity: .4; cursor: default; }
    .q-slika-ur { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
    .q-slika-ur .msg { font-size: .85rem; }
    .q-hint { color: var(--muted); font-size: .85rem; font-weight: 700; margin: 2px 0 0; }
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .opt {
      display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--r-md); cursor: pointer;
      border: 2px solid var(--line); background: #fffdf9; font-weight: 700; transition: border-color .15s, background .15s, transform .1s;
    }
    .opt:hover { border-color: color-mix(in srgb, var(--c1) 45%, white); }
    .opt:active { transform: scale(.98); }
    .opt input { appearance: none; -webkit-appearance: none; margin: 0; width: 24px; height: 24px; flex-shrink: 0; border: 2px solid var(--line-2); background: #fff; display: grid; place-content: center; cursor: pointer; transition: all .15s; }
    .opt input[type=radio] { border-radius: 50%; }
    .opt input[type=checkbox] { border-radius: 7px; }
    .opt input::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .15s; }
    .opt input[type=checkbox]::after { width: 12px; height: 7px; border-radius: 0; background: none; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg) scale(0); margin-top: -3px; }
    .opt input:checked { background: var(--c1); border-color: var(--c1); }

    .opt input[type=checkbox]:checked::after { transform: rotate(-45deg) scale(1); }
    .opt:has(input:checked) { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 9%, white); }
    .opt input:disabled { cursor: default; }
    input.short { font: inherit; font-weight: 700; font-size: 1.1rem; padding: 12px 16px; border: 2px solid var(--line); border-radius: var(--r-md); width: 100%; max-width: 420px; background: #fffdf9; color: var(--ink); }
    input.short:focus { outline: none; border-color: var(--c1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c1) 18%, transparent); }
    .match { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 10px 8px; align-items: center; }
    .match .l { padding: 12px 14px; background: color-mix(in srgb, var(--c1) 9%, white); border-radius: var(--r-md); font-weight: 800; }
    .match .eq { text-align: center; color: var(--muted); font-weight: 800; }

    .match select:focus { outline: none; border-color: var(--c1); }
    .order { list-style: none; margin: 0; padding: 0; counter-reset: o; display: grid; gap: 8px; }
    .order li { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: var(--r-md); padding: 8px 8px 8px 12px; background: #fffdf9; font-weight: 700; transition: background .3s; }
    .order li.moved { background: color-mix(in srgb, var(--c1) 12%, white); }
    .order li::before { counter-increment: o; content: counter(o); width: 28px; height: 28px; border-radius: 9px; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .9rem; flex-shrink: 0; }
    .order li span { flex: 1; }

    .order button:hover:not(:disabled) { background: var(--c1); color: #fff; }
    .order button:disabled { opacity: .3; cursor: default; }
    .quiz-foot { display: flex; justify-content: flex-end; align-items: center; gap: 14px; flex-wrap: wrap; margin: 8px 0 40px; }
    .quiz-foot .saved { color: var(--muted); font-size: .88rem; font-weight: 700; margin-right: auto; }
    .msg { min-height: 1.4em; font-size: .92rem; font-weight: 700; margin: 8px 0; color: var(--bad); }

    .result { position: relative; overflow: hidden; background: var(--surface); border-radius: var(--r-xl); padding: 34px 24px 30px; text-align: center; box-shadow: var(--shadow-up); margin-bottom: 22px; }
    .ring { --p: 0; width: 170px; height: 170px; border-radius: 50%; margin: 6px auto 14px; display: grid; place-items: center; position: relative;
      background: conic-gradient(var(--c1) calc(var(--p) * 1%), var(--line) 0); }
    .ring::before { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: var(--surface); }
    .ring div { position: relative; font-family: var(--head); font-weight: 900; font-size: 2.6rem; line-height: 1; }
    .ring small { display: block; font-size: .9rem; color: var(--muted); font-weight: 800; margin-top: 4px; }
    .result h2 { font-size: 1.8rem; margin-bottom: 4px; }
    .result p { color: var(--muted); margin: 2px 0; font-weight: 700; }
    .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: fall var(--d) ease-in var(--w) forwards; }
    @keyframes fall { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), 420px) rotate(var(--r)); } }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin: 0 0 18px; }
    .stat { background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }
    .stat strong { display: block; font-family: var(--head); font-size: 2rem; font-weight: 900; line-height: 1.1; color: var(--c1); }
    .stat span { color: var(--muted); font-weight: 700; font-size: .88rem; }

    .cell.y { background: #22c55e; } .cell.n { background: #fecaca; }
    .bars li { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 10px; }
    .bars .b { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bars .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 999px; }

    /* ─── Nov kviz ─── */
    .banner-btn { margin-left: auto; align-self: flex-start; background: rgba(255,255,255,.95); border: 0; color: var(--ink); }

      padding: 14px 16px; border: 2px solid var(--line); border-radius: var(--r-md); background: #fffdf9; color: var(--ink);

    /* ─── Sheets (subjects, account) ─── */
    .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(31,35,64,.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .2s; }

    .sheet {
      position: fixed; z-index: 61; top: 76px; right: max(20px, calc((100vw - 1180px) / 2 + 20px)); width: 400px; max-width: calc(100vw - 24px);
      max-height: calc(100vh - 96px); overflow-y: auto; background: var(--surface); border-radius: var(--r-xl); padding: 22px 22px 24px;
      box-shadow: 0 30px 60px -20px rgba(31,35,64,.45); visibility: hidden; opacity: 0; transform: translateY(-10px) scale(.97); transform-origin: top right;

    .who { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; background: linear-gradient(135deg, #f3efff, #fff1e0); border-radius: var(--r-lg); padding: 14px; }

    .who small { color: var(--muted); font-weight: 700; }

    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,92,231,.15); }
    .help { background: #fff5d6; border-radius: var(--r-md); padding: 10px 14px; font-size: .9rem; font-weight: 600; margin: 6px 0 12px; }
    .linkbtn { background: none; border: 0; padding: 8px 0; color: var(--accent-ink); cursor: pointer; display: block; font-weight: 800; text-align: left; }
    .linkbtn:hover { text-decoration: underline; }
    .slots { display: flex; gap: 8px; margin-bottom: 10px; }
    .slots span { width: 52px; height: 52px; border: 2px dashed var(--line-2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: #fffdf9; }

    .animals { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .animals button, .emojis button { font-size: 26px; padding: 6px 0; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; line-height: 1.2; transition: transform .1s, border-color .15s; }
    .animals button:hover, .emojis button:hover { border-color: var(--accent); transform: translateY(-2px); }

    .animals-row { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; color: var(--muted); font-weight: 700; margin-top: 6px; }
    /* Računi učencev (učitelj; supabase_racuni_ucencev.sql) */
    .ru { max-width: 900px; margin: 0 auto; }
    .ru-head { display: flex; align-items: center; gap: 14px; margin: 6px 0 18px; flex-wrap: wrap; }
    .ru-head h1 { font-size: 1.9rem; margin-right: auto; }

const BARVE_TP = [['#6366f1', '#a855f7'], ['#0ea5e9', '#22c55e'], ['#f43f5e', '#f97316'], ['#10b981', '#0ea5e9'],
  ['#eab308', '#f97316'], ['#ec4899', '#8b5cf6'], ['#14b8a6', '#6366f1'], ['#ef4444', '#e11d48']];
const EMOJI_TP = ['📚', '🔢', '📐', '🧪', '🌍', '📖', '✏️', '🇬🇧', '🎵', '🎨', '⚽', '🌱', '🧠', '💻', '🦉', '⭐'];
const PREDLOGA_KVIZA = 'orodja/kviz-predloga/Brihta%20predloga%20za%20kviz.xlsx';
let TP = [];
const jeTP = id => /^u-[a-z0-9]{8}$/.test(String(id || ''));
function vPredmetTP(t) {
  const [c1, c2] = BARVE_TP[t.barva] || BARVE_TP[0];
  const razredi = (t.razredi || []).slice().sort();
  return { id: t.id, ime: t.ime, kratko: t.ime, polno: t.ime, emoji: t.emoji || '📚', c1, c2, barva: t.barva || 0, razredi, tp: true,
    koda: razredi.join(', ') || 'brez razreda', naslovSeznama: 'Kvizi',
    opis: razredi.length ? 'Razredi: ' + razredi.join(', ') : 'Še ni dodeljen nobenemu razredu' };
}
async function naloziTP() {
  const r = ucitelj ? await rpc('sola_tp_moji', { p_seja: ucitelj.seja })
    : ucenec ? await rpc('sola_tp_ucenec', { p_student: ucenec.id }) : [];
  if (!Array.isArray(r)) return;   // strežnik ni dosegljiv ali SQL še ni zagnan: obdrži, kar je
  TP = r.map(vPredmetTP);
  for (let i = VSI.length - 1; i >= 0; i--) if (VSI[i].tp) VSI.splice(i, 1);
  VSI.push(...TP);
}
const kvizov = n => n + ' ' + (n % 100 === 1 ? 'kviz' : n % 100 === 2 ? 'kviza' : (n % 100 === 3 || n % 100 === 4) ? 'kvizi' : 'kvizov');
async function naloziMoje() {
  MOJE = {};
  if (!ucenec) return;
  const r = await rpc('sola_kviz_moje', { p_student: ucenec.id });
  if (Array.isArray(r)) r.forEach(o => { MOJE[o.kviz_id] = o; });
}
/* Učna ura (mapa v gradiva/<predmet>/) ima korake; korak »kviz« kaže na kviz po id-ju ali naslovu.
   Kviz, ki je korak ure, se ne pokaže še posebej na seznamu. */
const ure = id => (GRADIVA[id] || []).filter(g => g.vrsta === 'ura');
function kvizKoraka(id, ref) {
  const r = String(ref || '').trim(), s = slugKviza(r);
  return KVIZI.find(k => k.predmet === id && (k.id === r || k.id === id + '/' + r || slugKviza(k.ime) === s || k.id === id + '/' + s));
}
function uraKviza(id, kviz) {
  return ure(id).find(u => u.koraki.some(k => k.vrsta === 'kviz' && kvizKoraka(id, k.kviz) === kviz));
}
/* Objava in naložena gradiva (supabase_gradiva.sql). Učitelj gradivo ročno objavi ali skrije;
   brez ročne izbire je skrito gradivo, naloženo vnaprej (g.vnaprej iz gradiva.json), ostalo objavljeno.
   Nič se ne objavi samo od sebe: vnaprej naloženo ostane skrito, dokler ga učitelj ne objavi.
   Naložene datoteke (PDF, Word, slike) so v Supabase shrambi in se pomešajo med gradiva. */
let STANJE = {};          // kljuc objave → true (objavljeno) / false (skrito)
let KLJUKICE = {};        // pot koraka ure → čas, ko je učitelj označil »Done in class« (supabase_kljukice.sql)
let DODANA = [];
let RAZPORED = {}, NASLOVI = [];   // predmet → [ključi v vrstnem redu]; naslovi, ki jih vpiše učitelj
const SHRAMBA = 'sola-gradiva';
const potShrambe = pot => pot.split('/').map(encodeURIComponent).join('/');
async function naloziObjave() {
  const [s, d, r, kl] = await Promise.all([rpc('sola_gradiva_stanje'), rpc('sola_gradiva_dodana'), rpc('sola_razpored_vse'), rpc('sola_ura_kljukice')]);
  if (Array.isArray(kl)) { KLJUKICE = {}; kl.forEach(x => { if (x.opravljeno) KLJUKICE[x.kljuc] = x.posodobljeno; }); }
  if (r && Array.isArray(r.naslovi)) { NASLOVI = r.naslovi; RAZPORED = r.razpored || {}; }
  if (Array.isArray(s)) { STANJE = {}; s.forEach(x => { STANJE[x.kljuc] = x.objavljeno; }); }
  if (Array.isArray(d)) DODANA = d.map(x => ({ vrsta: x.vrsta, ime: x.naslov, datum: x.datum, velikost: x.velikost,
    predmet: x.predmet, dodano: x.id, imeDatoteke: x.ime_datoteke,
    url: `${SUPABASE.url}/storage/v1/object/public/${SHRAMBA}/${potShrambe(x.pot)}` }));
}
const kljucObjave = g => g.vrsta === 'kviz' ? null : g.dodano ? 'dodano:' + g.dodano : (g.pot || g.url);
function skrito(g) {
  if (g.vrsta === 'kviz') return !!g.skrit;
  const k = kljucObjave(g);
  if (!k) return false;
  if (k in STANJE) return !STANJE[k];
  return !!g.vnaprej;
}
const gradivaZa = id => [...(GRADIVA[id] || []), ...DODANA.filter(g => g.predmet === id), ...KVIZI.filter(k => k.predmet === id && !uraKviza(id, k))]
  .filter(g => ucitelj || !skrito(g))
  .sort((a, b) => new Date(b.datum) - new Date(a.datum));
function gumbObjave(g) {
  if (ucitelj && g.vrsta === 'kviz' && jeTP(g.predmet)) {
    const s = !!g.skrit;
    return `<button class="vis${s ? '' : ' on'}" type="button" data-kviz-skrit="${esc(g.id)}" data-skrito="${s ? 1 : 0}"
      title="${s ? 'Učenci kviza ne vidijo. Klikni, da ga pokažeš.' : 'Učenci kviz vidijo. Klikni, da ga skriješ.'}">${s ? '👁 <span class="lbl">Pokaži</span>' : '🙈 <span class="lbl">Skrij</span>'}</button>`;
  }
  if (!ucitelj || !kljucObjave(g)) return '';
  const s = skrito(g);
  return `<button class="vis${s ? '' : ' on'}" type="button" data-objava="${esc(kljucObjave(g))}" data-skrito="${s ? 1 : 0}"
    title="${s ? 'Učenci tega ne vidijo. Klikni, da objaviš.' : 'Učenci to vidijo. Klikni, da skriješ.'}">${s ? '🙈 <span class="lbl">Skrito</span>' : '👁 <span class="lbl">Objavljeno</span>'}</button>`;
}
/* Skrij / Pokaži kviz v predmetu učitelja (oddaje ostanejo). */

const vsaZa = p => p.otroci ? p.otroci.flatMap(o => vsaZa(o)) : gradivaZa(p.id);

/* ─── Razpored strani predmeta (supabase_razpored.sql) ───────────────────────
   Brez datumov in tednov: seznam gradiv, ki ga učitelj uredi sam. Poleg gradiv sta še
   naslov (samo besedilo, ne zloži se) in modul (zložljiva skupina gradiv).
   RAZPORED[predmet] = ['ključ gradiva', 'naslov:<id>', {m: '<id modula>', v: ['ključ', …]}, …].
   Gradiva, ki jih v razporedu še ni (na novo naložena), so na vrhu; brez razporeda so
   objavljena (najnovejša zgoraj), nato skrita (po vrsti, v kateri pridejo na vrsto). */
const vrstaRazd = n => n.vrsta === 'modul' ? 'modul' : 'naslov';
function drevoPredmeta(p, seznam) {
  const vidni = seznam.filter(g => !skrito(g)), skriti = seznam.filter(g => skrito(g)).reverse();
  const gradiva = new Map([...vidni, ...skriti].map(g => [kljuc(g), g]));
  const razd = NASLOVI.filter(n => n.predmet === p.id);
  const poKljucu = new Map(razd.map(n => [vrstaRazd(n) + ':' + n.id, n]));
  const porabljeno = new Set(), drevo = [];
  const vzemi = k => { if (porabljeno.has(k) || !gradiva.has(k)) return null; porabljeno.add(k); return gradiva.get(k); };
  for (const e of (RAZPORED[p.id] || [])) {
    if (typeof e === 'string') {
      if (e.startsWith('naslov:')) {
        if (poKljucu.has(e) && !porabljeno.has(e)) { porabljeno.add(e); drevo.push({ tip: 'naslov', n: poKljucu.get(e) }); }
      } else { const g = vzemi(e); if (g) drevo.push({ tip: 'g', g }); }
    } else if (e && e.m) {
      const k = 'modul:' + e.m;
      if (!poKljucu.has(k) || porabljeno.has(k)) continue;
      porabljeno.add(k);
      drevo.push({ tip: 'modul', n: poKljucu.get(k), v: (e.v || []).map(vzemi).filter(Boolean) });
    }
  }
  const noviRazd = razd.filter(n => !porabljeno.has(vrstaRazd(n) + ':' + n.id))
    .map(n => vrstaRazd(n) === 'modul' ? { tip: 'modul', n, v: [] } : { tip: 'naslov', n });
  const novaGradiva = [...gradiva.keys()].filter(k => !porabljeno.has(k)).map(k => ({ tip: 'g', g: gradiva.get(k) }));
  return [...noviRazd, ...novaGradiva, ...drevo];
}
const redIzDrevesa = drevo => drevo.map(e => e.tip === 'g' ? kljuc(e.g) : e.tip === 'naslov' ? 'naslov:' + e.n.id : { m: e.n.id, v: e.v.map(g => kljuc(g)) });
const gradivaVRedu = drevo => drevo.flatMap(e => e.tip === 'g' ? [e.g] : e.tip === 'modul' ? e.v : []);
const modulOdprt = id => preberi('sola_modul_odprt:' + id) === '1';

async function shraniRazpored(p, red) {
  RAZPORED[p.id] = red;
  const y = window.scrollY; stranPredmet(p); window.scrollTo(0, y);
  const r = await rpc('sola_razpored_shrani', { p_seja: ucitelj.seja, p_predmet: p.id, p_red: red });
  if (r !== true) alert(r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv, vrstni red ni shranjen.' : 'Vrstni red ni shranjen. Se moraš znova prijaviti? (Ali pa v Supabase še ni zagnan supabase_razpored.sql.)');
}

function htmlRazporeda(p, seznam) {
  let drevo = drevoPredmeta(p, seznam);
  if (!ucitelj) {
    /* Učenec ne vidi praznega modula in ne naslova, pod katerim do naslednjega naslova ni ničesar. */
    drevo = drevo.filter(e => e.tip !== 'modul' || e.v.length);
    drevo = drevo.filter((e, i) => e.tip !== 'naslov' || (drevo[i + 1] && drevo[i + 1].tip !== 'naslov'));
  }
  const moduli = drevo.filter(e => e.tip === 'modul');
  const n = drevo.length;
  const vModul = (g, v) => moduli.length ? `<select class="v-modul" title="Premakni v modul" aria-label="Modul">
      <option value="">📁 brez modula</option>${moduli.map(m => `<option value="${esc(m.n.id)}"${m === v ? ' selected' : ''}>📁 ${esc(m.n.besedilo)}</option>`).join('')}</select>` : '';
  const kontrole = (g, v) => ucitelj ? `<span class="premik"><span class="rocaj" title="Primi in povleci">⋮⋮</span></span>${g ? vModul(g, v) : ''}` : '';
  const akcije = n => ucitelj ? `<span class="nasl-akc"><button class="vis" type="button" data-razd-uredi="${esc(n.id)}" title="Preimenuj">✎</button><button class="vis" type="button" data-razd-izbrisi="${esc(n.id)}" title="Izbriši">🗑</button></span>` : '';
  const vrstice = drevo.map((e, i) => {
    if (e.tip === 'g') return vrsticaGradiva(p, e.g, kontrole(e.g, null));
    if (e.tip === 'naslov') return `<li class="naslov-v"${ucitelj ? ` data-k="naslov:${esc(e.n.id)}"` : ''}>${kontrole()}<h3>${esc(e.n.besedilo)}</h3>${akcije(e.n)}</li>`;
    const odprt = modulOdprt(e.n.id), vidnih = e.v.filter(g => !skrito(g)).length;
    return `<li class="modul${odprt ? ' odprt' : ''}" data-m="${esc(e.n.id)}">
      <div class="modul-h">${kontrole()}<button class="modul-g" type="button" aria-expanded="${odprt}">
        <span class="modul-i" aria-hidden="true">📁</span><b>${esc(e.n.besedilo)}</b><span class="count">${ucitelj ? e.v.length : vidnih}</span><span class="chev">${SVG.chev}</span></button>${akcije(e.n)}</div>
      <ul class="items modul-v">${e.v.map(g => vrsticaGradiva(p, g, kontrole(g, e))).join('')}${ucitelj && !e.v.length ? '<li class="prazno">Prazen modul. Gradivo povleci sem (ali na ime modula) ali ga izberi z 📁.</li>' : ''}</ul>
    </li>`;
  }).join('');
  const imaRazd = drevo.some(e => e.tip !== 'g');
  return `<section class="week">${imaRazd ? '' : `<div class="week-h" style="cursor:default"><h3>${esc(p.naslovSeznama || 'Gradiva')}</h3><span class="count">${gradivaVRedu(drevo).filter(g => !skrito(g)).length}</span></div>`}
    <ul class="items" id="razpored">${vrstice}</ul></section>`;
}

let odstraniVlecenje = () => {};
function urejanjeRazporeda(p) {
  const ul = document.getElementById('razpored');
  const drevo = () => drevoPredmeta(p, gradivaZa(p.id));
  const dodaj = vrsta => async () => {
    const t = (prompt(vrsta === 'modul' ? 'Ime modula (npr. »Unit 1: Animals«):' : 'Naslov (npr. »Stories« ali »Poems«):') || '').trim().slice(0, 120);
    if (!t) return;
    const id = await rpc('sola_razdelek_dodaj', { p_seja: ucitelj.seja, p_predmet: p.id, p_besedilo: t, p_vrsta: vrsta });
    if (typeof id !== 'string') { alert(id === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Ni bilo mogoče dodati. Se moraš znova prijaviti? (Ali pa v Supabase še ni zagnan zadnji supabase_razpored.sql.)'); return; }
    NASLOVI.push({ id, predmet: p.id, besedilo: t, vrsta });
    if (vrsta === 'modul') shrani('sola_modul_odprt:' + id, '1');
    await shraniRazpored(p, [vrsta === 'modul' ? { m: id, v: [] } : 'naslov:' + id, ...redIzDrevesa(drevo()).filter(x => x !== 'naslov:' + id && !(x && x.m === id))]);
  };
  document.getElementById('dodaj-naslov')?.addEventListener('click', dodaj('naslov'));
  document.getElementById('dodaj-modul')?.addEventListener('click', dodaj('modul'));
  if (!ul) return;

  ul.addEventListener('change', e => {
    const s = e.target.closest('.v-modul');
    if (!s) return;
    const k = s.closest('li[data-k]').dataset.k, d = drevo();
    let g = null, iz = -1;
    d.forEach((x, i) => {
      if (x.tip === 'g' && kljuc(x.g) === k) { g = x.g; iz = i; }
      if (x.tip === 'modul') { const j = x.v.findIndex(y => kljuc(y) === k); if (j >= 0) { g = x.v[j]; x.v.splice(j, 1); iz = i; } }
    });
    if (!g) return;
    if (d[iz].tip === 'g') d.splice(iz, 1);
    if (s.value) {
      const m = d.find(x => x.tip === 'modul' && x.n.id === s.value);
      m.v.push(g); shrani('sola_modul_odprt:' + m.n.id, '1');
    } else {
      const mi = d.findIndex(x => x.tip === 'modul' && x === d[iz]);
      d.splice(mi >= 0 ? mi + 1 : 0, 0, { tip: 'g', g });
    }
    shraniRazpored(p, redIzDrevesa(d));
  });

  ul.addEventListener('click', async e => {
    const zlozi = e.target.closest('.modul-g');
    if (zlozi) return;   // zlaganje ureja stranPredmet (za vse)
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.razdUredi) {
      const n = NASLOVI.find(x => x.id === b.dataset.razdUredi);
      const t = (prompt(vrstaRazd(n) === 'modul' ? 'Novo ime modula:' : 'Nov naslov:', n.besedilo) || '').trim().slice(0, 120);
      if (!t || t === n.besedilo) return;
      const r = await rpc('sola_naslov_uredi', { p_seja: ucitelj.seja, p_id: n.id, p_besedilo: t });
      if (r !== true) return alert('Ni uspelo. Se moraš znova prijaviti?');
      n.besedilo = t; const y = window.scrollY; stranPredmet(p); window.scrollTo(0, y);
      return;
    }
    if (b.dataset.razdIzbrisi) {
      const id = b.dataset.razdIzbrisi, n = NASLOVI.find(x => x.id === id), modul = vrstaRazd(n) === 'modul';
      if (!confirm(modul ? `Izbrišem modul »${n.besedilo}«? Gradiva iz njega ostanejo na seznamu.` : `Izbrišem naslov »${n.besedilo}«? Gradiva pod njim ostanejo.`)) return;
      const d = drevo(), i = d.findIndex(x => x.tip !== 'g' && x.n.id === id);
      if (i >= 0) d.splice(i, 1, ...(modul ? d[i].v.map(g => ({ tip: 'g', g })) : []));
      const r = await rpc('sola_naslov_izbrisi', { p_seja: ucitelj.seja, p_id: id });
      if (r !== true) return alert('Ni uspelo. Se moraš znova prijaviti?');
      NASLOVI = NASLOVI.filter(x => x.id !== id);
      await shraniRazpored(p, redIzDrevesa(d));
    }
  });

  /* Vlečenje: primi katerokoli vrstico (gradivo, naslov, modul) in jo povleci. Z miško takoj,
     na telefonu po kratkem pritisku (sicer se stran premika). Gradivo spustiš med vrstice,
     v odprt modul ali na ime modula (gre na konec modula); naslov in modul samo zunaj modulov. */
  ul.classList.add('ured');
  const izDom = () => [...ul.children].filter(li => li.dataset.k || li.dataset.m).map(li => li.dataset.m
    ? { m: li.dataset.m, v: [...li.querySelector('.modul-v').children].filter(x => x.dataset.k).map(x => x.dataset.k) }
    : li.dataset.k);
  let vl = null, zadnjiVlek = 0;
  const zacni = () => {
    const li = vl.li, r = li.getBoundingClientRect();
    vl.zacel = true;
    vl.mesto = document.createElement('li');
    vl.mesto.className = 'mesto'; vl.mesto.style.height = r.height + 'px';
    li.parentElement.insertBefore(vl.mesto, li);
    vl.dx = vl.x - r.left; vl.dy = vl.y - r.top;
    li.classList.add('lebdi');
    Object.assign(li.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
    document.body.classList.add('vlecenje');
    if (navigator.vibrate && vl.dotik) navigator.vibrate(15);
  };
  const postavi = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (!el || !ul.contains(el) || vl.mesto.contains(el)) return;
    const gradivo = !!vl.li.dataset.k && !vl.li.classList.contains('naslov-v');
    let cilj = el.closest('li[data-k], li.modul, li.prazno');
    if (!cilj || cilj === vl.li) return;
    ul.querySelectorAll('.modul.cilj').forEach(m => m.classList.remove('cilj'));
    if (!gradivo) {
      if (cilj.parentElement !== ul) cilj = cilj.closest('li.modul');
      if (!cilj) return;
    } else if (cilj.classList.contains('modul') && el.closest('.modul-h')) {
      cilj.classList.add('cilj');
      const v = cilj.querySelector('.modul-v');
      v.insertBefore(vl.mesto, v.querySelector('.prazno'));
      return;
    } else if (cilj.classList.contains('prazno')) {
      cilj.parentElement.insertBefore(vl.mesto, cilj);
      return;
    }
    const r = cilj.getBoundingClientRect();
    cilj.parentElement.insertBefore(vl.mesto, y > r.top + r.height / 2 ? cilj.nextSibling : cilj);
  };
  const koncaj = shrani => {
    if (!vl) return;
    const d = vl; vl = null;
    clearTimeout(d.cas);
    if (!d.zacel) return;
    zadnjiVlek = Date.now();
    d.mesto.replaceWith(d.li);
    d.li.classList.remove('lebdi'); d.li.removeAttribute('style');
    document.body.classList.remove('vlecenje');
    ul.querySelectorAll('.modul.cilj').forEach(m => m.classList.remove('cilj'));
    const red = izDom();
    if (shrani && JSON.stringify(red) !== JSON.stringify(redIzDrevesa(drevo()))) shraniRazpored(p, red);
    else { const y = window.scrollY; stranPredmet(p); window.scrollTo(0, y); }
  };
  ul.addEventListener('pointerdown', e => {
    if (vl || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('select, .vis, .nasl-akc, input, .prazno')) return;
    const li = e.target.closest('li[data-k], li[data-m]');
    if (!li || !ul.contains(li)) return;
    vl = { li, x: e.clientX, y: e.clientY, zacel: false, dotik: e.pointerType !== 'mouse' };
    if (vl.dotik) vl.cas = setTimeout(() => { if (vl && !vl.zacel) zacni(); }, 300);
  });
  const premik = e => {
    if (!vl) return;
    if (!vl.zacel) {
      const d = Math.hypot(e.clientX - vl.x, e.clientY - vl.y);
      if (vl.dotik) { if (d > 10) { clearTimeout(vl.cas); vl = null; } return; }
      if (d < 6) return;
      zacni();
    }
    e.preventDefault();
    vl.li.style.left = (e.clientX - vl.dx) + 'px';
    vl.li.style.top = (e.clientY - vl.dy) + 'px';
    postavi(e.clientX, e.clientY);
    if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
  };
  const dotik = e => { if (vl && vl.zacel) e.preventDefault(); };
  const gor = () => koncaj(true), prekini = () => koncaj(false);
  odstraniVlecenje();   // poslušalci prejšnjega izrisa
  document.addEventListener('pointermove', premik);
  document.addEventListener('touchmove', dotik, { passive: false });
  document.addEventListener('pointerup', gor);
  document.addEventListener('pointercancel', prekini);
  odstraniVlecenje = () => {
    document.removeEventListener('pointermove', premik);
    document.removeEventListener('touchmove', dotik, { passive: false });
    document.removeEventListener('pointerup', gor);
    document.removeEventListener('pointercancel', prekini);
  };
  ul.addEventListener('contextmenu', e => { if (vl) e.preventDefault(); });
  /* Po vlečenju ne odpri gradiva in ne zloži modula. */
  ul.addEventListener('click', e => { if (Date.now() - zadnjiVlek < 400) { e.preventDefault(); e.stopPropagation(); } }, true);
}

function stranPredmet(p) {
  shrani('sola_zadnji', p.id);
  const seznam = gradivaZa(p.id);
  let vsebina = '';
  if (napaka) {
    vsebina = `<div class="empty"><img src="brihta.png" alt=""><strong>Ups!</strong>Gradiv trenutno ni mogoče naložiti. Osveži stran.</div>`;
  } else if (!seznam.length && !(ucitelj && NASLOVI.some(n => n.predmet === p.id))) {
    vsebina = ucitelj && p.tp
      ? `<div class="empty"><img src="brihta.png" alt=""><strong>Tukaj je še prazno</strong>Najprej dodaj modul (＋ Modul), npr. »Ulomki«, nato naloži prvi kviz (📊 Kviz iz Excela).</div>`
      : `<div class="empty"><img src="brihta.png" alt=""><strong>Tukaj je še prazno</strong>Ko učitelj objavi gradivo, se pokaže tukaj.</div>`;
  } else {
    vsebina = htmlRazporeda(p, seznam);
  }
  vsebina += povezaveHtml(p);
  okvirPredmeta(p, 'domov', vsebina, null);
  if (ucitelj) urejanjeRazporeda(p);
  else { const b = document.getElementById('dodaj-naslov'); if (b) b.remove(); }
  $main.querySelectorAll('.modul-g').forEach(b => b.addEventListener('click', () => {
    const m = b.closest('.modul'), odprt = !m.classList.contains('odprt');
    m.classList.toggle('odprt', odprt); b.setAttribute('aria-expanded', odprt);
    shrani('sola_modul_odprt:' + m.dataset.m, odprt ? '1' : '0');
  }));
}

function stranDatoteke(p) {

const OFFICE = ['word', 'powerpoint', 'excel'];
function stranGradivo(p, k, korak) {
  const seznam = [...gradivaZa(p.id), ...KVIZI.filter(x => x.predmet === p.id && uraKviza(p.id, x))];
  const i = seznam.findIndex(g => kljuc(g) === k);
  if (i < 0) { location.replace(`#/p/${p.id}`); return; }
  shrani('sola_zadnji', p.id);
  if (seznam[i].vrsta === 'kviz') return stranKviz(p, seznam[i]);
  if (seznam[i].vrsta === 'ura') return stranUra(p, seznam[i], korak);
  const g = seznam[i], url = naslov(g);
  const { notri, opomba } = prikaz(g);
  const vrsta = gradivaVRedu(drevoPredmeta(p, gradivaZa(p.id))), j = vrsta.findIndex(x => kljuc(x) === k);
  const starejse = j > 0 ? vrsta[j - 1] : null, novejse = j >= 0 ? vrsta[j + 1] : null;
  const vsebina = `<div class="vhead">
      <a class="btn" href="#/p/${p.id}" aria-label="Nazaj">${SVG.prev}</a>
      ${tile(g.vrsta, 'sm')}
      <h1>${esc(g.ime)}</h1>
      ${gumbObjave(g)}${ucitelj && g.dodano ? `<button class="btn" type="button" id="v-izbrisi" title="Izbriši naloženo datoteko">🗑 <span class="lbl">Izbriši</span></button>` : ''}
      ${gumbiOgleda(g, g.imeDatoteke)}
    </div>
    <div class="frame" id="frame">${notri}</div>
    ${opomba ? `<p class="note">${opomba}</p>` : ''}
    <div class="seq">
      ${starejse ? `<a class="btn" href="${hrefGradiva(p, starejse)}">${SVG.prev} Prejšnje</a>` : '<span></span>'}
      ${novejse ? `<a class="btn" href="${hrefGradiva(p, novejse)}">Naslednje ${SVG.next}</a>` : '<span></span>'}
    </div>`;
  okvirPredmeta(p, 'gradivo', vsebina, null, g.ime);
  poveziCelZaslon(url);
  const izb = document.getElementById('v-izbrisi');
  if (izb) izb.addEventListener('click', async () => {
    if (!confirm(`Izbrišem »${g.ime}«? Datoteka bo odstranjena s strani za vedno.`)) return;
    izb.disabled = true;
    const pot = await rpc('sola_gradivo_izbrisi', { p_seja: ucitelj.seja, p_id: g.dodano });
    if (typeof pot !== 'string') { izb.disabled = false; alert('Brisanje ni uspelo. Se moraš znova prijaviti?'); return; }
    try {
      await fetch(`${SUPABASE.url}/storage/v1/object/${SHRAMBA}/${potShrambe(pot)}`,
        { method: 'DELETE', headers: { apikey: SUPABASE.key, Authorization: `Bearer ${SUPABASE.key}` } });
    } catch (e) {}
    await naloziObjave();
    location.hash = `#/p/${p.id}`;
  });
}

  let datoteka = null;
  const izberi = f => {
    if (!f) return;
    const k = (f.name.split('.').pop() || '').toLowerCase();
    if (!NALAGANJE[k]) { $msg.textContent = 'Naložiš lahko samo PDF, Word (.doc, .docx), JPG ali PNG.'; return; }
    if (f.size > NAJVEC_MB * 1048576) { $msg.textContent = `Datoteka je prevelika (največ ${NAJVEC_MB} MB).`; return; }
    datoteka = f; $msg.textContent = '';
    $drop.classList.add('ima');
    document.getElementById('up-ime').innerHTML = `✅ <b>${esc(f.name)}</b> <small class="note">(${velikost(f.size)})</small>`;
    if (!$n.value.trim()) $n.value = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
  };
  $f.addEventListener('change', () => izberi($f.files[0]));
  $drop.addEventListener('dragover', e => { e.preventDefault(); $drop.classList.add('ima'); });
  $drop.addEventListener('dragleave', () => { if (!datoteka) $drop.classList.remove('ima'); });
  $drop.addEventListener('drop', e => { e.preventDefault(); izberi(e.dataTransfer.files[0]); });
  document.getElementById('up-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!datoteka) { $msg.textContent = 'Najprej izberi datoteko.'; return; }
    if (!$n.value.trim()) { $msg.textContent = 'Vpiši naslov.'; $n.focus(); return; }
    const k = datoteka.name.split('.').pop().toLowerCase(), [vrsta, mime] = NALAGANJE[k];
    $ok.disabled = true; $ok.textContent = 'Nalagam …'; $msg.textContent = '';
    const konec = t => { $ok.disabled = false; $ok.textContent = 'Naloži ⬆'; $msg.textContent = t; };
    const pot = await rpc('sola_nalaganje_zacni', { p_seja: ucitelj.seja, p_predmet: p.id, p_koncnica: k });
    if (typeof pot !== 'string') return konec(pot === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Nalaganje ni dovoljeno. Se moraš znova prijaviti? (Ali pa v Supabase še ni zagnan supabase_gradiva.sql.)');
    let r;
    try {
      r = await fetch(`${SUPABASE.url}/storage/v1/object/${SHRAMBA}/${potShrambe(pot)}`, {
        method: 'POST', body: datoteka,
        headers: { apikey: SUPABASE.key, Authorization: `Bearer ${SUPABASE.key}`, 'Content-Type': mime, 'x-upsert': 'false', 'cache-control': '3600' },
      });
    } catch (err) { return konec('Povezava se je prekinila. Poskusi znova.'); }
    if (!r.ok) { let t = ''; try { t = (await r.json()).message || ''; } catch (err) {} return konec(`Shramba je zavrnila datoteko (${r.status}${t ? ': ' + t : ''}).`); }
    const id = await rpc('sola_gradivo_dodaj', { p_seja: ucitelj.seja, p_pot: pot, p_naslov: $n.value.trim(), p_vrsta: vrsta,
      p_ime_datoteke: datoteka.name, p_velikost: datoteka.size, p_datum: new Date().toISOString(),
      p_objavljeno: document.getElementById('up-objavi').checked });
    if (typeof id !== 'string') return konec('Datoteka je naložena, a je ni bilo mogoče dodati med gradiva. Poskusi znova.');
    await naloziObjave();
    location.hash = `#/p/${p.id}`;
  });
}

/* Ime prenesene datoteke pri koraku ure: »6. ura Razgradnja in vzorci - Zapis.pdf«. */
function imePrenosa(ura, k) {
  const konc = (k.pot || '').match(/\.[^./]+$/);
  return `${ura.ime} - ${k.ime}${konc ? konc[0] : ''}`.replace(/[\\/:*?"<>|]/g, '');
}
const atrPrenosa = ime => ime ? `download="${esc(ime)}"` : 'download';

function gumbiOgleda(g, ime) {
  if (g.vrsta === 'kviz' || g.besedilo != null) return '';
  const url = naslov(g);
  return `<div class="actions">
        ${g.vrsta !== 'povezava' ? `<button class="btn" id="v-full" type="button" title="Čez cel zaslon">${SVG.full}<span class="lbl">Cel zaslon</span></button>` : ''}
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener" title="Odpri v novem zavihku">${SVG.ext}<span class="lbl">Nov zavihek</span></a>
        ${g.pot ? `<a class="btn" href="${esc(url)}" ${atrPrenosa(ime)} title="Prenesi">${SVG.dl}<span class="lbl">Prenesi</span></a>` : ''}
      </div>`;
}
function poveziCelZaslon(url) {
  const fb = document.getElementById('v-full');
  if (fb) fb.addEventListener('click', () => {
    const f = document.getElementById('frame');
    // Gumb za izhod: na interaktivni tabli ni tipke Esc, PDF pa ujame tudi tipkovnico.
    if (!f.querySelector('.fs-izhod')) {
      f.insertAdjacentHTML('beforeend', '<button class="btn btn-go btn-big fs-izhod" type="button">✕ Zapri cel zaslon</button>');
      f.querySelector('.fs-izhod').addEventListener('click', () => {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      });
    }
    if (f.requestFullscreen) f.requestFullscreen().catch(() => window.open(url, '_blank', 'noopener'));
    else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
    else window.open(url, '_blank', 'noopener');
  });
}

/* Zelo preprost Markdown za navodila ure: ## naslovi, seznami, **krepko**, odstavki. */
function md(besedilo) {
  const vrstica = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  let html = '', seznam = null;
  const zapri = () => { if (seznam) { html += `</${seznam}>`; seznam = null; } };
  for (const v of String(besedilo).split(/\r?\n/)) {
    let m;
    if (!v.trim()) { zapri(); continue; }
    if ((m = v.match(/^(#{1,3})\s+(.*)/))) { zapri(); const n = Math.min(m[1].length + 1, 4); html += `<h${n}>${vrstica(m[2])}</h${n}>`; }
    else if ((m = v.match(/^\s*[-*]\s+(.*)/))) { if (seznam !== 'ul') { zapri(); html += '<ul>'; seznam = 'ul'; } html += `<li>${vrstica(m[1])}</li>`; }
    else if ((m = v.match(/^\s*\d+[.)]\s+(.*)/))) { if (seznam !== 'ol') { zapri(); html += '<ol>'; seznam = 'ol'; } html += `<li>${vrstica(m[1])}</li>`; }
    else { zapri(); html += `<p>${vrstica(v)}</p>`; }
  }
  zapri();
  return html;
}

/* ─── Učna ura: koraki eden za drugim ─── */
const kljucUre = g => 'sola_ura:' + g.pot;
function videniKoraki(g) { try { return JSON.parse(preberi(kljucUre(g)) || '[]'); } catch (e) { return []; } }
function naslednjiKorak(g) {
  const v = videniKoraki(g);
  const i = g.koraki.findIndex((k, j) => !v.includes(j));
  return i < 0 ? 0 : i;
}
const hrefKoraka = (p, g, i) => `${hrefGradiva(p, g)}/${i + 1}`;
function korakOpravljen(p, g, k, i) {
  if (k.vrsta === 'kviz') { const kv = kvizKoraka(p.id, k.kviz); return !!(kv && MOJE[kv.id]); }
  /* Interaktivni korak je opravljen šele, ko je rešen (🎉 Končano!), ne že, ko ga učenec odpre. */
  if (k.interaktivno) return reseniKoraki(g).includes(i);
  return videniKoraki(g).includes(i);
}
function korakPika(p, g, k, i, zdaj) {
  const stanje = i === zdaj ? ' now' : korakOpravljen(p, g, k, i) ? ' done' : '';
  return `<li class="step${stanje}"><a href="${hrefKoraka(p, g, i)}"${i === zdaj ? ' aria-current="step"' : ''}><span class="n">${i + 1}</span><span class="t">${esc(k.ime)}${k.pot && KLJUKICE[k.pot] ? ' ✅' : ''}</span></a></li>`;
}
function vsebinaKoraka(p, g, k) {
  if (k.besedilo != null) return `<article class="md">${md(k.besedilo)}</article>`;
  if (k.vrsta === 'kviz') {
    const kv = kvizKoraka(p.id, k.kviz);
    if (!kv) return `<div class="empty"><img src="brihta.png" alt=""><strong>Kviz še ni objavljen</strong>Ko ga učitelj objavi, se pokaže tukaj.</div>`;
    /* Učitelj: brez zaklepa, takoj do oddaj učencev in predogleda vprašanj. */
    if (ucitelj) return `<div class="open-card wide">${tile('kviz')}<h2>${esc(kv.ime)}</h2>
      <p>👨‍🏫 Prijavljen si kot učitelj. ${kv.vprasanj ? kv.vprasanj + ' vprašanj.' : ''}</p>
      <a class="btn btn-go btn-big" href="${hrefGradiva(p, kv)}">📊 Oddaje učencev in vprašanja ${SVG.next}</a></div>`;
    const o = MOJE[kv.id];
    const manjka = nereseniPred(g, g.koraki.indexOf(k));
    if (!o && manjka.length) return `<div class="open-card wide">${tile('kviz')}<h2>🔒 Kviz se odpre, ko rešiš vse korake</h2>
      <p>Še nisi končal/a:</p><p>${manjka.map(j => `<a class="btn" href="${hrefKoraka(p, g, j)}">${j + 1}. ${esc(g.koraki[j].ime)}</a>`).join(' ')}</p>
      <p class="note">Korak je rešen, ko na njem piše 🎉 Končano!</p></div>`;
    if (!o) {
      /* Kviz se odpre sam, a samo prvič: gumb Nazaj na kvizu te vrne sem in ne odpre ga znova. */
      const kljuc = 'sola_kviz_odprt:' + g.pot;
      let ze = false; try { ze = sessionStorage.getItem(kljuc) === '1'; sessionStorage.setItem(kljuc, '1'); } catch (e) { ze = true; }
      if (!ze) setTimeout(() => location.assign(hrefGradiva(p, kv)), 0);
    }
    return `<div class="open-card wide">${tile('kviz')}<h2>${esc(kv.ime)}</h2>
      <p>${o ? `Kviz si že rešil: <b>${o.tocke}/${o.vseh}</b> ${tock(o.vseh)}.` : `${kv.vprasanj ? kv.vprasanj + ' vprašanj · ' : ''}${esc(kv.opis || 'Reši sam. Imaš en poskus.')}`}</p>
      <a class="btn btn-go btn-big" href="${hrefGradiva(p, kv)}">${o ? 'Poglej rezultat' : 'Reši kviz'} ${SVG.next}</a></div>`;
  }
  const { notri, opomba } = prikaz(k, imePrenosa(g, k));
  return `<div class="frame" id="frame">${notri}</div>${opomba ? `<p class="note">${opomba}</p>` : ''}`;
}
function stranUra(p, g, korak) {
  const n = g.koraki.length;
  let i = parseInt(korak, 10) - 1;
  if (!(i >= 0 && i < n)) { location.replace(hrefKoraka(p, g, naslednjiKorak(g))); return; }
  const k = g.koraki[i];
  const v = videniKoraki(g);
  if (!v.includes(i)) { v.push(i); shrani(kljucUre(g), JSON.stringify(v)); }
  const prej = g.koraki[i - 1], potem = g.koraki[i + 1];
  const vsebina = `<div class="vhead">
      <a class="btn" href="#/p/${p.id}" aria-label="Nazaj">${SVG.prev}</a>
      ${tile('ura', 'sm')}
      <h1>${esc(g.ime)}<small class="sub">Učna ura</small></h1>
    </div>
    <ol class="steps">${g.koraki.map((x, j) => korakPika(p, g, x, j, i)).join('')}</ol>
    <div class="vhead step-h"><span class="badge">Korak ${i + 1} od ${n}</span><h2>${esc(k.ime)}</h2>${gumbiOgleda(k, imePrenosa(g, k))}</div>
    ${p.samoUcitelj && ucitelj && k.pot ? `<p><button class="btn${KLJUKICE[k.pot] ? ' btn-go' : ''}" type="button" data-kljukica="${esc(k.pot)}">${KLJUKICE[k.pot] ? '✅ Done in class' : '⬜ Mark as done in class'}</button></p>` : ''}
    ${vsebinaKoraka(p, g, k)}
    <div class="seq">
      ${prej ? `<a class="btn" href="${hrefKoraka(p, g, i - 1)}">${SVG.prev} ${esc(prej.ime)}</a>` : '<span></span>'}
      ${potem ? `<a class="btn btn-go btn-big" id="ura-naprej" href="${hrefKoraka(p, g, i + 1)}">Naprej: ${esc(potem.ime)} ${SVG.next}</a>`
        : `<a class="btn" id="ura-naprej" href="#/p/${p.id}">Konec ure ✓</a>`}
    </div>`;
  okvirPredmeta(p, 'gradivo', vsebina, null, g.ime);
  if (k.vrsta !== 'kviz' && k.besedilo == null) poveziCelZaslon(naslov(k));
  trenutniKorak = { g, i };
}

/* Interaktivna stran v koraku ure lahko zaklene gumb »Naprej«, dokler je učenec ne reši:
   pošlje postMessage {tip:'brihta-korak', stanje:'zacetek'} ob nalaganju in {…, stanje:'koncano'} ob koncu.
   Strani, ki ničesar ne pošljejo, gumba ne zaklenejo. */
let trenutniKorak = null;
const kljucResenih = g => 'sola_ura_reseno:' + (ucenec ? ucenec.id + ':' : '') + g.pot;
function reseniKoraki(g) { try { return JSON.parse(preberi(kljucResenih(g)) || '[]'); } catch (e) { return []; } }
/* Interaktivni koraki pred korakom i, ki še niso rešeni (kviz ure se odpre šele, ko jih ni). */
function nereseniPred(g, i) {
  const r = reseniKoraki(g);
  return g.koraki.slice(0, i).map((k, j) => j).filter(j => g.koraki[j].interaktivno && !r.includes(j));
}
function zakleniNaprej(da) {
  const b = document.getElementById('ura-naprej');
  if (!b) return;
  b.classList.toggle('zaklenjeno', da);
  b.setAttribute('aria-disabled', da ? 'true' : 'false');
  b.title = da ? 'Najprej dokončaj nalogo v okvirju zgoraj.' : '';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('#ura-naprej.zaklenjeno');
  if (!b) return;
  e.preventDefault();
  b.classList.remove('tresi'); void b.offsetWidth; b.classList.add('tresi');
}, true);
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.tip !== 'brihta-korak' || !trenutniKorak) return;
  const f = document.querySelector('#frame iframe');
  if (!f || e.source !== f.contentWindow) return;
  const { g, i } = trenutniKorak, r = reseniKoraki(g);
  if (d.stanje === 'koncano') {
    if (!r.includes(i)) { r.push(i); shrani(kljucResenih(g), JSON.stringify(r)); }
    zakleniNaprej(false);
  } else if (d.stanje === 'zacetek') zakleniNaprej(!r.includes(i));
});

function prikaz(g, ime) {
  const url = naslov(g);
  const lokalno = /^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol === 'file:';
  let notri, opomba = '';
  if (g.vrsta === 'pdf' || g.vrsta === 'html' || g.vrsta === 'besedilo') notri = `<iframe src="${esc(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
  else if (g.vrsta === 'slika') notri = `<img src="${esc(url)}" alt="${esc(g.ime)}">`;
  else if (g.vrsta === 'video') notri = `<video src="${esc(url)}" controls playsinline></video>`;
  else if (g.vrsta === 'zvok') notri = `<audio src="${esc(url)}" controls></audio>`;
  else if (OFFICE.includes(g.vrsta)) {
    notri = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
    opomba = lokalno ? 'Predogled Word/PowerPoint datotek deluje šele na objavljeni strani. Uporabi »Prenesi«.' : 'Če se dokument ne prikaže, klikni »Prenesi«.';
  } else if (g.vrsta === 'povezava') {
    let gost = ''; try { gost = new URL(g.url).hostname.replace(/^www\./, ''); } catch (e) {}
    const slika = g.slika ? `<img src="${esc(g.slika)}" alt="">` : `<span class="go-emoji" aria-hidden="true">${esc(g.emoji || '🚀')}</span>`;
    notri = `<a class="go-card" href="${esc(g.url)}" target="_blank" rel="noopener">
      <span class="go-pic"><span class="go-iskra i1">✦</span><span class="go-iskra i2">✦</span><span class="go-iskra i3">✦</span>${slika}</span>
      <h2>${esc(g.ime)}</h2>
      <p>${esc(g.opis || 'Klikni in začni!')}</p>
      <span class="btn btn-go btn-big go-btn">Gremo! ${SVG.ext}</span>
      ${gost ? `<small class="go-gost">${esc(gost)}</small>` : ''}
    </a>`;
  } else {
    notri = `<div class="open-card">${tile(g.vrsta)}<h2>${esc(g.ime)}</h2><p>Te datoteke ni mogoče prikazati tukaj.</p><a class="btn btn-go btn-big" href="${esc(url)}" ${atrPrenosa(ime)}>Prenesi ${SVG.dl}</a></div>`;
  }
  return { notri, opomba };
}

/* ─── Kviz ─── */
const enakaStran = h => location.hash === h;
const osnutekKljuc = id => `sola_osnutek:${ucenec ? ucenec.id : ''}:${id}`;
const tock = n => n === 1 ? 'točka' : n === 2 ? 'točki' : (n === 3 || n === 4) ? 'točke' : 'točk';
const casOddaje = iso => { const d = new Date(iso); return `${kdaj(iso)} ob ${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`; };

function glavaKviza(p, g) {
  const u = uraKviza(p.id, g);
  const nazaj = u ? hrefKoraka(p, u, u.koraki.findIndex(k => k.vrsta === 'kviz' && kvizKoraka(p.id, k.kviz) === g)) : `#/p/${p.id}`;
  return `<div class="vhead"><a class="btn" href="${nazaj}" aria-label="Nazaj">${SVG.prev}</a>${tile('kviz', 'sm')}<h1>${esc(g.ime)}</h1></div>
    ${g.opis ? `<p class="note" style="font-size:1rem;margin:-6px 0 18px">${esc(g.opis)}</p>` : ''}`;
}
const okvirKviza = (p, g, vsebina, stranska) => okvirPredmeta(p, 'kviz', glavaKviza(p, g) + vsebina, stranska, g.ime);

async function stranKviz(p, g) {
  const h = location.hash;
  if (ucitelj) return rezultatiKviza(p, g, h);
  if (!ucenec) {
    okvirKviza(p, g, `<div class="empty"><img src="brihta.png" alt=""><strong>Najprej se prijavi</strong>
      <p style="margin:0 0 16px">Uporabi isti račun kot pri <b>Brihta-MAT</b>.</p>
      <button class="btn btn-go btn-big" type="button" id="k-prijava">Prijava</button></div>`);
    document.getElementById('k-prijava').addEventListener('click', () => odpriPredal('racun'));
    return;
  }
  if (MOJE[g.id] && !jeTP(p.id)) return izidKviza(p, g, MOJE[g.id]);   // vadba: vedno znova
  okvirKviza(p, g, '<p class="note">Nalagam kviz …</p>');
  const r = await rpc('sola_kviz', { p_id: g.id });
  if (Array.isArray(r) && r.length) await dodajSlike(g.id, r[0].vprasanja);
  if (!enakaStran(h)) return;
  if (!Array.isArray(r) || !r.length) {
    okvirKviza(p, g, `<div class="empty"><img src="brihta.png" alt=""><strong>Ups!</strong>${r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Preveri povezavo in osveži stran.' : 'Tega kviza ni več.'}</div>`);
    return;
  }
  resujKviz(p, g, r[0].vprasanja, h);
}

function konfeti(el) {
  const barvice = ['#6366f1', '#a855f7', '#ec4899', '#ffb020', '#22c55e', '#0ea5e9', '#f43f5e'];
  const c = document.createElement('div'); c.className = 'confetti';
  for (let i = 0; i < 70; i++) {
    const k = document.createElement('i');
    k.style.left = Math.random() * 100 + '%';
    k.style.background = barvice[i % barvice.length];
    k.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
    k.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    k.style.setProperty('--d', (1.6 + Math.random() * 1.6) + 's');
    k.style.setProperty('--w', (Math.random() * .6) + 's');
    if (i % 3 === 0) k.style.borderRadius = '50%';
    c.appendChild(k);
  }
  el.appendChild(c);
}

function izidKviza(p, g, o, svezje) {
  const odst = o.vseh ? Math.round(o.tocke / o.vseh * 100) : 0;
  const [naslovIzida, emoji] = odst === 100 ? ['Popolno!', '🏆'] : odst >= 80 ? ['Odlično!', '🌟'] : odst >= 50 ? ['Dobro ti gre!', '👍'] : ['Ne obupaj!', '💪'];
  okvirKviza(p, g, `<section class="result" id="izid">
      <div class="ring" style="--p:${odst}"><div>${o.tocke}/${o.vseh}<small>${tock(o.vseh)}</small></div></div>
      <h2>${emoji} ${naslovIzida}</h2>
      <p>${svezje ? 'Kviz je oddan.' : 'Ta kviz si že rešil/-a.'} Oddano ${casOddaje(o.oddano)}.</p>
    </section>
    <a class="btn" href="#/p/${p.id}">${SVG.prev} Nazaj na ${esc(p.ime)}</a>`);
  if (svezje && odst >= 50) konfeti(document.getElementById('izid'));
}

function poskusiZnova(p, g, o) {
  const odst = o.vseh ? Math.round(o.tocke / o.vseh * 100) : 0;
  okvirKviza(p, g, `<section class="result" id="izid">
      <div class="ring" style="--p:${odst}"><div>${o.tocke}/${o.vseh}<small>${tock(o.vseh)}</small></div></div>
      <h2>🔁 Poskusi znova!</h2>
      <p>Dosegel/-la si manj kot polovico točk, zato se ta poskus ne šteje.</p>
      <p>Še enkrat preberi vprašanja in reši kviz znova.</p>
      <button class="btn btn-go btn-big" type="button" id="k-znova" style="margin-top:16px">Reši znova ${SVG.next}</button>
    </section>
    <a class="btn" href="#/p/${p.id}">${SVG.prev} Nazaj na ${esc(p.ime)}</a>`);

const urlSlike = pot => `${SUPABASE.url}/storage/v1/object/public/${SHRAMBA}/${potShrambe(pot)}`;

/* Pomanjša sliko na največ 1200 px in jo shrani kot JPG (manj podatkov za učence). */
async function pomanjsajSliko(f) {
  const bm = await createImageBitmap(f);
  const k = Math.min(1, 1200 / Math.max(bm.width, bm.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bm, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}
const izbrisiIzShrambe = pot => fetch(`${SUPABASE.url}/storage/v1/object/${SHRAMBA}/${potShrambe(pot)}`,

async function naloziSlikoVprasanja(kvizId, besedilo, f, vir) {

  let r;

    r = await fetch(`${SUPABASE.url}/storage/v1/object/${SHRAMBA}/${potShrambe(pot)}`, { method: 'POST', body: blob,
      headers: { apikey: SUPABASE.key, Authorization: `Bearer ${SUPABASE.key}`, 'Content-Type': 'image/jpeg', 'x-upsert': 'false', 'cache-control': '31536000' } });
  } catch (e) { return 'Povezava se je prekinila. Poskusi znova.'; }
  if (!r.ok) return `Shramba je zavrnila sliko (${r.status}).`;

    p_vir: vir ? JSON.stringify(vir) : null });
  if (typeof stara !== 'string') { izbrisiIzShrambe(pot); return 'Slike ni bilo mogoče pripeti vprašanju. Poskusi znova.'; }

/* ─── Iskanje slik (Wikimedia Commons in Openverse: samo proste licence, brez ključa) ───
   Slovensko besedo prevede prek Wikidate (»buča« → pumpkin), da je zadetkov več.
   Izbrana slika se prenese v našo shrambo (učenci ne nalagajo s tujih strežnikov). */
const LICENCA = (l, v) => l === 'cc0' ? 'CC0' : l === 'pdm' ? 'javna domena' : `CC ${String(l).toUpperCase()}${v ? ' ' + v : ''}`;
async function prevodiIskanja(q) {
  try {
    const r = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=sl&uselang=en&limit=5&format=json&origin=*`);
    const d = await r.json(), mali = q.toLowerCase(), zad = d.search || [];
    /* Angleška beseda (npr. leaf): išči natanko njo, brez »prevodov«. */
    if (zad.some(x => x.match && x.match.language !== 'sl' && x.match.text.toLowerCase() === mali)) return [];
    /* Najprej zadetki, kjer se slovenska beseda ujema v celoti (kmet → farmer), nato ostali (kmetijstvo). */
    const sl = zad.filter(x => x.label && x.match && x.match.language === 'sl'), tocni = sl.filter(x => x.match.text.toLowerCase() === mali);
    return [...new Set([...tocni, ...sl.filter(x => !tocni.includes(x))].map(x => x.label).filter(x => x.toLowerCase() !== mali))].slice(0, 4);
  } catch (e) { return []; }
}
const zCasom = (url, ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t)); };
const brezHtml = h => (new DOMParser().parseFromString(String(h || ''), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
/* Vrne [{th, polna, n, a, l, u}] iz Wikimedia Commons in Openverse (kar odgovori). */
/* Wikimedia odgovori v ~1 s, Openverse včasih šele po 20 s: sproti(seznam, koncano) se pokliče ob vsakem odgovoru. */
const ISKANJA = new Map();
function iskanjeSlik(izraz, sproti) {
  if (ISKANJA.has(izraz)) { sproti(ISKANJA.get(izraz), true); return; }
  const commons = zCasom(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(izraz + ' filetype:bitmap')}&gsrlimit=20&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=330&iiextmetadatafilter=Artist|LicenseShortName|ObjectName`, 10000)
    .then(r => r.json()).then(d => Object.values((d.query || {}).pages || {}).sort((a, b) => a.index - b.index).map(p => {
      const ii = (p.imageinfo || [])[0]; if (!ii || !ii.thumburl) return null;
      const m = ii.extmetadata || {}, l = brezHtml((m.LicenseShortName || {}).value);
      if (!/^(cc|public domain|pd)/i.test(l)) return null;
      return { th: ii.thumburl, polna: ii.width > 960 ? ii.thumburl.replace(/\/330px-/, '/960px-').replace(/\?.*$/, '') : ii.url,
        n: brezHtml((m.ObjectName || {}).value) || p.title.replace(/^File:|\.[^.]+$/g, ''), a: brezHtml((m.Artist || {}).value).slice(0, 120), l, u: ii.descriptionurl };
    }).filter(Boolean));
  const openverse = zCasom(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(izraz)}&page_size=20&mature=false`, 25000)
    .then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => (d.results || []).map(x => ({ th: x.thumbnail,
      polna: x.thumbnail + (x.thumbnail.includes('?') ? '&' : '?') + 'full_size=true', n: x.title || '', a: x.creator || '',
      l: LICENCA(x.license, x.license_version), u: x.foreign_landing_url || x.url || '' })));
  const vse = [];   // v vrstnem redu prihoda (stran doda samo nove na konec)
  let odgovorov = 0, napak = 0;
  const javi = () => {
    const koncano = ++odgovorov === 2;
    if (koncano && napak === 2) { sproti(null, true); return; }
    if (koncano) ISKANJA.set(izraz, vse);
    sproti(vse.slice(), koncano);
  };
  [commons, openverse].forEach(v => v.then(x => { vse.push(...x); }, () => { napak++; }).then(javi));
}
function iskalnikSlik(zacetno, izberi) {

      $m.insertAdjacentHTML('beforeend', rez.slice(ze).map((x, j) => `<button type="button" class="isk-sl" data-i="${ze + j}" title="${esc(x.n)}"><img src="${esc(x.th)}" alt="${esc(x.n || 'slika')}" loading="lazy"></button>`).join(''));

      } catch (e) { nalagam = false; $msg.textContent = 'Te slike ni mogoče prenesti. Izberi drugo.'; $m.querySelectorAll('.isk-sl').forEach(y => { y.disabled = false; }); b.classList.remove('izbrana'); return; }
      const napaka = await izberi(f, { a: x.a.slice(0, 120), l: x.l, u: x.u, n: x.n.slice(0, 160) });
      if (napaka) { nalagam = false; $msg.textContent = napaka; $m.querySelectorAll('.isk-sl').forEach(y => { y.disabled = false; }); b.classList.remove('izbrana'); return; }

  $c.addEventListener('click', e => { const b = e.target.closest('[data-izraz]'); if (b) isci(b.dataset.izraz); });
  dlg.querySelector('#isk-f').addEventListener('submit', async e => {

}
const htmlVira = v => v ? `<p class="q-vir">${v.u ? `<a href="${esc(v.u)}" target="_blank" rel="noopener">` : ''}${esc(v.n || 'Slika')}${v.a ? ', ' + esc(v.a) : ''}${v.u ? '</a>' : ''} · ${esc(v.l || '')}</p>` : '';

function htmlVprasanj(vpr, predogled, uredi) {

function posodobiPuscice(ol) {
