<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brihta — Šola</title>
  <link rel="icon" href="brihta.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --nav: #2d3b45;
      --nav-hover: #3d4f5c;
      --nav-w: 84px;
      --blue: #0374b5;
      --blue-dk: #02578a;
      --text: #2d3b45;
      --muted: #6b7780;
      --line: #c7cdd1;
      --line-lt: #e8eaec;
      --bg: #ffffff;
      --bg-soft: #f5f5f5;
      --green: #0b874b;
      --red: #e0061f;
    }
    html, body { margin: 0; }
    body {
      font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; }
    h1, h2, h3 { font-weight: 400; margin: 0; }

    /* ─── Global navigation (Canvas left rail) ─── */
    .gnav {
      position: fixed; inset: 0 auto 0 0; width: var(--nav-w); z-index: 50;
      background: var(--nav);
      display: flex; flex-direction: column; align-items: stretch;
    }
    .gnav-logo { display: flex; justify-content: center; padding: 14px 0 12px; }
    .gnav-logo img { width: 58px; height: 58px; display: block; }
    .gnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 4px; border: 0; background: none; cursor: pointer;
      color: #fff; font-size: 12px; text-align: center; line-height: 1.2;
      text-decoration: none !important;
    }
    .gnav-item svg { width: 26px; height: 26px; }
    .gnav-item:hover { background: var(--nav-hover); }
    .gnav-item.active { background: #fff; color: var(--blue); }
    .gnav-item:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

    /* Courses tray */
    .tray-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .tray {
      position: fixed; top: 0; bottom: 0; left: var(--nav-w); width: 320px; max-width: calc(100vw - var(--nav-w));
      z-index: 61; background: #fff; box-shadow: 4px 0 16px rgba(0,0,0,.18);
      transform: translateX(calc(-100% - var(--nav-w))); transition: transform .22s ease;
      padding: 22px 24px; overflow-y: auto; visibility: hidden;
    }
    .tray.open { transform: none; visibility: visible; }
    body.tray-open .tray-back { opacity: 1; pointer-events: auto; }
    .gnav-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1;
      border: 2px solid rgba(255,255,255,.6);
    }
    .gnav-item.active .gnav-avatar { border-color: var(--blue); }
    .gnav-item .gnav-name { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Account tray / forms */
    .acct-who { display: flex; align-items: center; gap: 14px; margin: 10px 0 18px; }
    .acct-who .big { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 34px; }
    .acct-who strong { display: block; font-size: 1.15rem; }
    .acct-who small { color: var(--muted); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
    .field input[type=text], .field input[type=email], .field input[type=password], .field input:not([type]) {
      width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--text);
    }
    .field input:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
    .msg { min-height: 1.4em; font-size: .9rem; margin: 8px 0; color: var(--red); }
    .msg.ok { color: var(--green); }
    .help { background: #fff8e5; border: 1px solid #f2d37a; border-radius: 4px; padding: 10px 12px; font-size: .88rem; margin: 6px 0 10px; }
    .linkbtn { background: none; border: 0; padding: 6px 0; color: var(--blue); cursor: pointer; display: block; font-size: .95rem; text-align: left; }
    .linkbtn:hover { text-decoration: underline; }
    .btn-block { width: 100%; justify-content: center; }
    .animals-slots { display: flex; gap: 8px; margin-bottom: 8px; }
    .animals-slots span { width: 46px; height: 46px; border: 2px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .animals-slots span.full { border-style: solid; border-color: var(--blue); background: #eef6fb; }
    .animals { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .animals button, .emojis button {
      font-size: 24px; padding: 6px 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; line-height: 1.2;
    }
    .animals button:hover, .emojis button:hover { background: var(--bg-soft); }
    .emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .emojis button { font-size: 20px; padding: 4px 0; }
    .emojis button.on { border-color: var(--blue); background: #eef6fb; box-shadow: inset 0 0 0 1px var(--blue); }
    .animals-row { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .reg-user { font-size: 1.6rem; font-weight: 900; letter-spacing: .02em; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; text-align: center; margin: 8px 0 12px; }

    /* ─── Quiz ─── */
    .q { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 22px; overflow: hidden; }
    .q-head { background: var(--bg-soft); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; justify-content: space-between; font-weight: 700; }
    .q-head span:last-child { font-weight: 400; color: var(--muted); font-size: .9rem; }
    .q-body { padding: 16px 14px; }
    .q-text { margin: 0 0 14px; white-space: pre-line; font-size: 1.05rem; }
    .opt { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-top: 1px solid var(--line-lt); cursor: pointer; border-radius: 2px; }
    .opt:hover { background: #f5f8fa; }
    .opt input { width: 18px; height: 18px; accent-color: var(--blue); flex-shrink: 0; margin: 0; }
    .q-body input.short { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; width: 100%; max-width: 360px; }
    .match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 16px; align-items: center; }
    .match .l { padding: 8px 10px; background: var(--bg-soft); border-radius: 4px; }
    .match select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 4px; width: 100%; background: #fff; color: var(--text); }
    .order { list-style: none; margin: 0; padding: 0; counter-reset: o; }
    .order li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; background: #fff; }
    .order li::before { counter-increment: o; content: counter(o) "."; font-weight: 700; color: var(--muted); width: 22px; text-align: right; }
    .order li span { flex: 1; }
    .order button { border: 1px solid var(--line); background: var(--bg-soft); border-radius: 4px; width: 34px; height: 30px; cursor: pointer; font-size: 14px; }
    .order button:disabled { opacity: .35; cursor: default; }
    .quiz-foot { display: flex; justify-content: flex-end; align-items: center; gap: 14px; border-top: 1px solid var(--line); padding-top: 16px; margin-bottom: 40px; }
    .quiz-foot .saved { color: var(--muted); font-size: .85rem; margin-right: auto; }
    .result { border: 1px solid var(--line); border-radius: 6px; padding: 30px 20px; text-align: center; margin-bottom: 24px; }
    .result .score { font-size: 3rem; font-weight: 900; line-height: 1.1; margin: 6px 0; }
    .result p { color: var(--muted); margin: 4px 0; }
    .qnav li { align-items: center; }
    .qnav .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
    .qnav .dot.on { background: var(--green); border-color: var(--green); }
    .tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e7f0f7; color: var(--blue-dk); flex-shrink: 0; white-space: nowrap; }
    .rtable td.cells { white-space: nowrap; }
    .rtable .c { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 2px; vertical-align: -2px; }
    .rtable .c.y { background: var(--green); } .rtable .c.n { background: #e8b4b4; }
    .stats { display: flex; gap: 26px; flex-wrap: wrap; margin: 0 0 18px; }
    .stats div strong { display: block; font-size: 1.6rem; }
    .stats div span { color: var(--muted); font-size: .85rem; }
    .tray-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 8px; }
    .tray-head h2 { font-size: 1.4rem; font-weight: 700; }
    .icon-btn { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 4px; display: inline-flex; }
    .icon-btn:hover { background: var(--bg-soft); }
    .icon-btn svg { width: 20px; height: 20px; }
    .tray ul { list-style: none; margin: 0; padding: 0; }
    .tray li a { display: block; padding: 10px 0; border-bottom: 1px solid var(--line-lt); font-size: 1rem; }
    .tray li.sub a { padding-left: 18px; font-size: .95rem; }
    .tray li .term { display: block; color: var(--muted); font-size: .8rem; }

    /* ─── Layout ─── */
    .app { margin-left: var(--nav-w); min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 14px; min-height: 64px;
      padding: 0 24px; border-bottom: 1px solid var(--line);
    }
    .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 1.05rem; min-width: 0; }
    .crumbs .sep { color: var(--muted); }
    .crumbs .cur { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page { padding: 24px; max-width: 1360px; }
    .page-title { font-size: 1.75rem; margin-bottom: 4px; }
    .page-sub { color: var(--muted); margin: 0 0 22px; }
    .rule { border: 0; border-top: 1px solid var(--line); margin: 0 0 24px; }

    /* ─── Dashboard cards ─── */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 32px 28px; }
    .card {
      background: #fff; border-radius: 4px; overflow: hidden; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,.3); transition: box-shadow .15s, transform .15s;
      display: flex; flex-direction: column; color: inherit; text-decoration: none !important;
    }
    .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.32); transform: translateY(-1px); }
    .card:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .card-hero { height: 146px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.16) 1.5px, transparent 1.6px);
      background-size: 18px 18px;
    }
    .card-hero .emoji { font-size: 64px; position: relative; filter: drop-shadow(0 3px 6px rgba(0,0,0,.25)); }
    .card-hero .badge {
      position: absolute; top: 10px; right: 10px; background: #fff; color: var(--text);
      font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px;
    }
    .card-body { padding: 12px 16px 6px; flex: 1; }
    .card-name { font-weight: 700; font-size: 1rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-code { color: var(--muted); font-size: .875rem; display: block; }
    .card-term { color: var(--muted); font-size: .75rem; display: block; margin-top: 2px; }
    .card-foot { display: flex; gap: 18px; padding: 8px 16px 14px; color: var(--muted); font-size: .8rem; align-items: center; }
    .card-foot svg { width: 20px; height: 20px; vertical-align: -5px; margin-right: 4px; }
    .card-foot .hot { color: var(--red); font-weight: 700; }

    .resume {
      display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-left: 6px solid var(--blue);
      border-radius: 4px; padding: 12px 16px; margin-bottom: 28px; max-width: 720px;
    }
    .resume .txt { flex: 1; min-width: 0; }
    .resume .txt small { color: var(--muted); display: block; font-size: .8rem; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; border-radius: 4px; cursor: pointer;
      padding: 8px 14px; font-size: 1rem; border: 1px solid var(--line); background: var(--bg-soft);
      color: var(--text); text-decoration: none !important; white-space: nowrap;
    }
    .btn:hover { background: #e9eaeb; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary { background: var(--blue); border-color: var(--blue-dk); color: #fff; }
    .btn-primary:hover { background: var(--blue-dk); }
    .btn-big { font-size: 1.1rem; padding: 11px 20px; font-weight: 700; }

    /* ─── Course layout ─── */
    .course { display: grid; grid-template-columns: 200px minmax(0, 1fr) 280px; gap: 0 32px; padding: 24px; max-width: 1400px; }
    .course.no-side { grid-template-columns: 200px minmax(0, 1fr); }
    .cnav { list-style: none; margin: 0; padding: 0; }
    .cnav a {
      display: block; padding: 6px 10px; border-left: 3px solid transparent; margin-bottom: 2px; font-size: .95rem;
    }
    .cnav a.active { border-left-color: var(--text); color: var(--text); font-weight: 700; text-decoration: none; }
    .cnav-color { height: 6px; border-radius: 3px; margin: 0 0 14px 0; }

    .today { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 30px; }
    .today-head { padding: 10px 18px; color: #fff; font-weight: 700; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .today-body { padding: 20px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .today-icon { width: 64px; height: 64px; flex-shrink: 0; border-radius: 8px; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; }
    .today-icon svg { width: 36px; height: 36px; }
    .today-txt { flex: 1; min-width: 200px; }
    .today-txt h2 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; }
    .today-txt p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
    .empty { border: 1px dashed var(--line); border-radius: 6px; padding: 34px 20px; text-align: center; color: var(--muted); }
    .empty img { width: 90px; height: 90px; opacity: .9; display: block; margin: 0 auto 10px; }

    /* Modules */
    .module { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 22px; overflow: hidden; }
    .module-head {
      width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
      background: var(--bg-soft); border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; cursor: pointer; font-weight: 700;
    }
    .module-head svg { width: 16px; height: 16px; transition: transform .15s; flex-shrink: 0; }
    .module.closed .module-head { border-bottom: 0; }
    .module.closed .module-head svg { transform: rotate(-90deg); }
    .module.closed .module-items { display: none; }
    .module-head .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: .85rem; }
    .module-items { list-style: none; margin: 0; padding: 0; }
    .item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line-lt);
      border-left: 4px solid transparent;
    }
    .item:last-child { border-bottom: 0; }
    .item:hover { background: #f5f8fa; border-left-color: var(--blue); }
    .item svg.ti { width: 24px; height: 24px; flex-shrink: 0; }
    .item .nm { flex: 1; min-width: 0; }
    .item .nm a { font-size: 1rem; display: block; overflow: hidden; text-overflow: ellipsis; }
    .item .meta { color: var(--muted); font-size: .8rem; }
    .pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--green); color: #fff; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }

    /* Files table */
    .ftable { width: 100%; border-collapse: collapse; }
    .ftable th { text-align: left; font-size: .85rem; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .ftable td { padding: 10px; border-bottom: 1px solid var(--line-lt); vertical-align: middle; font-size: .95rem; }
    .ftable td.n { display: flex; align-items: center; gap: 10px; }
    .ftable td.n svg { width: 22px; height: 22px; flex-shrink: 0; }
    .ftable tr:hover td { background: #f5f8fa; }
    .ftable .m { color: var(--muted); white-space: nowrap; }

    /* Right sidebar */
    .side h3 { font-size: 1rem; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
    .side ul { list-style: none; margin: 0 0 26px; padding: 0; }
    .side li { display: flex; gap: 10px; padding: 6px 0; font-size: .9rem; }
    .side li svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
    .side li small { display: block; color: var(--muted); }
    .side .switch a { display: block; padding: 4px 0; font-size: .9rem; }

    /* ─── Viewer ─── */
    .viewer-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .viewer-head > svg { width: 28px; height: 28px; flex-shrink: 0; }
    .viewer-head h1 { font-size: 1.5rem; flex: 1; min-width: 200px; line-height: 1.3; }
    .viewer-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .frame {
      border: 1px solid var(--line); border-radius: 4px; background: #e9ebed; overflow: hidden;
      height: calc(100vh - 230px); min-height: 420px; display: flex; align-items: center; justify-content: center;
    }
    .frame iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; background: #fff; }
    .frame video { max-width: 100%; max-height: 100%; }
    .frame:fullscreen { height: 100vh; border: 0; border-radius: 0; }
    .frame .open-card { text-align: center; padding: 30px; background: #fff; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.12); max-width: 440px; margin: 16px; }
    .frame .open-card svg { width: 54px; height: 54px; }
    .frame .open-card p { color: var(--muted); word-break: break-all; }
    .seq { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
    .note { color: var(--muted); font-size: .85rem; margin-top: 8px; }

    /* ─── Responsive ─── */
    @media (max-width: 1100px) {
      .course { grid-template-columns: 180px minmax(0, 1fr); }
      .side { grid-column: 2; margin-top: 10px; }
    }
    @media (max-width: 760px) {
      :root { --nav-w: 0px; }
      .gnav { inset: 0 0 auto 0; width: auto; height: 60px; flex-direction: row; align-items: center; padding: 0 8px; }
      .gnav-logo { padding: 0 8px 0 0; }
      .gnav-logo img { width: 44px; height: 44px; }
      .gnav-item { flex-direction: row; padding: 8px 10px; border-radius: 4px; font-size: 13px; }
      .gnav-item svg { width: 22px; height: 22px; }
      #nav-dash span { display: none; }
      .app { padding-top: 60px; }
      .tray { left: 0; top: 60px; width: 100%; max-width: 100%; transform: translateX(-105%); }
      .topbar { padding: 0 16px; min-height: 52px; }
      .page { padding: 18px 16px; }
      .course, .course.no-side { grid-template-columns: minmax(0, 1fr); padding: 16px; }
      .side { grid-column: 1; }
      .cnav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
      .cnav a { border-left: 0; border-bottom: 3px solid transparent; padding: 8px 10px; margin: 0; white-space: nowrap; }
      .cnav a.active { border-bottom-color: var(--text); }
      .cnav-color { display: none; }
      .cards { grid-template-columns: minmax(0, 1fr); gap: 20px; }
      .ftable .hide-m { display: none; }
      .frame { height: calc(100vh - 260px); min-height: 360px; }
      .viewer-head .actions .lbl { display: none; }
    }
  </style>
</head>
<body>

<nav class="gnav" aria-label="Glavna navigacija">
  <a class="gnav-logo" href="#/" title="Brihta"><img src="brihta.png" alt="Brihta"></a>
  <button class="gnav-item" id="nav-acct" type="button" aria-expanded="false" aria-controls="acct">
    <span class="gnav-avatar" id="nav-avatar">👤</span>
    <span class="gnav-name" id="nav-name">Prijava</span>
  </button>
  <a class="gnav-item" id="nav-dash" href="#/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 15a8.5 8.5 0 1 1 17 0"/><path d="M12 15l4-4.5" stroke-linecap="round"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/><path d="M3.5 19h17" stroke-linecap="round"/></svg>

PREDMETI.forEach(p => { if (p.otroci) p.otroci.forEach(o => { o.stars = p; VSI.push(o); }); else VSI.push(p); });
const najdi = id => VSI.find(p => p.id === id) || PREDMETI.find(p => p.id === id);

/* ─── Ikone ─── */
const IKONE = {
  pdf:        ['#d0021b', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5"/><text x="12.2" y="17.3" font-size="5.4" font-weight="900" text-anchor="middle" fill="currentColor" stroke="none" font-family="Lato,Arial">PDF</text>'],
  slika:      ['#0b874b', '<rect x="3" y="4.5" width="18" height="15" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="M3.5 17.5l5.5-5 4 3.5 3-2.5 4.5 4"/>'],
  word:       ['#2b579a', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5"/><path d="M8.5 11l1.3 6 2.2-5 2.2 5 1.3-6" stroke-linejoin="round"/>'],
  powerpoint: ['#c43e1c', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5"/><path d="M10 18v-7h2.6a2 2 0 0 1 0 4H10"/>'],
  excel:      ['#217346', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5"/><path d="M9.5 11l5 7M14.5 11l-5 7"/>'],
  html:       ['#e66000', '<rect x="2.5" y="4" width="19" height="16" rx="1.5"/><path d="M2.5 8h19"/><path d="M9.5 11.5l-2.5 2.5 2.5 2.5M14.5 11.5l2.5 2.5-2.5 2.5"/>'],
  video:      ['#7d3f98', '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M10 9.2v5.6l4.6-2.8z" fill="currentColor"/>'],
  zvok:       ['#7d3f98', '<path d="M9 17V6l10-2v11"/><circle cx="6.5" cy="17" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/>'],
  povezava:   ['#0374b5', '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'],
  besedilo:   ['#6b7780', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5M9 12h6M9 15h6M9 18h4"/>'],
  datoteka:   ['#6b7780', '<path d="M6 2.5h8l4.5 4.5v14.5h-12.5z"/><path d="M14 2.5V7h4.5"/>'],
  kviz:       ['#bf32a4', '<rect x="4.5" y="3.5" width="15" height="18" rx="1.5"/><path d="M9 2.5h6v2.5H9z"/><path d="M8 11l1.5 1.5L12 10M8 16.5l1.5 1.5L12 15.5M14 11.5h2.5M14 17h2.5"/>'],
};
const IMENA_VRST = { kviz: 'Kviz', pdf: 'PDF', slika: 'Slika', word: 'Word', powerpoint: 'PowerPoint', excel: 'Excel', html: 'Spletna stran', video: 'Video', zvok: 'Posnetek', povezava: 'Povezava', besedilo: 'Besedilo', datoteka: 'Datoteka' };
function ikona(vrsta, cls = 'ti') {
  const [barva, pot] = IKONE[vrsta] || IKONE.datoteka;
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:${barva}" aria-hidden="true">${pot}</svg>`;
}
const SVG = {
  chev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
  dl: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 8.5L10 13l4.5-4.5M3.5 16.5h13"/></svg>',
  ext: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5h5.5V9M16.5 3.5L9 11M14 12v4.5H3.5V6H8"/></svg>',
  full: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V3.5H8M12 3.5h4.5V8M16.5 12v4.5H12M8 16.5H3.5V12"/></svg>',
  prev: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>',
  next: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5L13 10l-5.5 5.5"/></svg>',
  star: '<svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 1.8l2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.7l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z"/></svg>',
  files: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  sub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg>',
};

/* ─── Pomožne ─── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DNI = ['nedelja', 'ponedeljek', 'torek', 'sreda', 'četrtek', 'petek', 'sobota'];
const MES = ['jan.', 'feb.', 'mar.', 'apr.', 'maj', 'jun.', 'jul.', 'avg.', 'sep.', 'okt.', 'nov.', 'dec.'];
const dan0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const ponedeljek = d => { const x = dan0(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const kratek = d => `${d.getDate()}. ${d.getMonth() + 1}.`;
function kdaj(iso) {
  const d = new Date(iso), razlika = Math.round((dan0(new Date()) - dan0(d)) / 864e5);
  if (razlika === 0) return 'danes';
  if (razlika === 1) return 'včeraj';
  if (razlika > 1 && razlika < 7) return DNI[d.getDay()];
  return `${d.getDate()}. ${MES[d.getMonth()]} ${d.getFullYear()}`;
}
const jeDanes = iso => dan0(iso).getTime() === dan0(new Date()).getTime();
function velikost(b) {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
}
function gradiv(n) { const m = n % 100; return n + ' ' + (m === 1 ? 'gradivo' : m === 2 ? 'gradivi' : (m === 3 || m === 4) ? 'gradiva' : 'gradiv'); }
const shrani = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const preberi = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const absolutno = pot => new URL(pot.split('/').map(encodeURIComponent).join('/'), location.href).href;
const naslov = g => g.url || absolutno(g.pot);

/* ─── Podatki ─── */
let GRADIVA = {};
let napaka = false;
async function naloziGradiva() {
  try {
    const r = await fetch('gradiva.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    GRADIVA = (await r.json()).predmeti || {};
    napaka = false;
  } catch (e) { napaka = true; }
}
/* Kvizi so v Supabase (pravilni odgovori ne smejo biti v javnem repozitoriju).
   Stran jih pomeša med gradiva kot vrsto 'kviz'. */
const SUPABASE = { url: 'https://ldczgbajbarlgwqzcggh.supabase.co', key: 'sb_publishable_888IYcEb-nSmGO0d67hEwA_rBFuXnv8' };
const NEDOSEGLJIVO = { nedosegljivo: true };
async function rpc(fn, params) {
  try {
    const r = await fetch(`${SUPABASE.url}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SUPABASE.key, Authorization: `Bearer ${SUPABASE.key}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(params || {}),
    });
    if (r.status >= 500) return NEDOSEGLJIVO;
    if (!r.ok) return null;
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  } catch (e) { return NEDOSEGLJIVO; }
}
let KVIZI = [];
let MOJE = {};            // kviz_id → {tocke, vseh, oddano}
async function naloziKvize() {
  const r = await rpc('sola_kvizi_seznam');
  if (Array.isArray(r)) KVIZI = r.map(k => ({ vrsta: 'kviz', ime: k.naslov, opis: k.opis, id: k.id, predmet: k.predmet, datum: k.objavljeno, vprasanj: k.vprasanj }));
}
async function naloziMoje() {
  MOJE = {};
  if (!ucenec) return;
  const r = await rpc('sola_kviz_moje', { p_student: ucenec.id });
  if (Array.isArray(r)) r.forEach(o => { MOJE[o.kviz_id] = o; });
}
const gradivaZa = id => [...(GRADIVA[id] || []), ...KVIZI.filter(k => k.predmet === id)]
  .sort((a, b) => new Date(b.datum) - new Date(a.datum));
const vsaZa = p => p.otroci ? p.otroci.flatMap(o => gradivaZa(o.id)) : gradivaZa(p.id);
const kljuc = g => g.vrsta === 'kviz' ? 'kviz:' + g.id : (g.pot || g.url);

/* ─── Računi (isti kot v Brihta-MAT; ista domena, zato tudi ista prijava) ─── */
const KLJUC_UCENEC = 'brihta_profile_v1';
const KLJUC_UCITELJ = 'brihta_teacher_v1';
const ZIVALI = ['🐘','🦁','🦊','🐊','🐬','🦉','🐸','🐢','🦒','🐧','🐝','🐙'];
const EMOJIJI = ['🦉','🚀','🦄','🐉','🌟','⚡','🎮','🍕','🦖','🐱','🐶','🦁','🌈','🎨','⚽','🦋'];
let ucenec = null, ucitelj = null;
try { const u = JSON.parse(preberi(KLJUC_UCENEC) || 'null'); if (u && u.id && u.username) ucenec = u; } catch (e) {}
try { const t = JSON.parse(preberi(KLJUC_UCITELJ) || 'null'); if (t && t.id && t.username) ucitelj = t; } catch (e) {}
function shraniRacun() {
  try {
    if (ucenec) localStorage.setItem(KLJUC_UCENEC, JSON.stringify(ucenec)); else localStorage.removeItem(KLJUC_UCENEC);
    if (ucitelj) localStorage.setItem(KLJUC_UCITELJ, JSON.stringify(ucitelj)); else localStorage.removeItem(KLJUC_UCITELJ);
  } catch (e) {}
}
const hrefGradiva = (p, g) => `#/p/${p.id}/${encodeURIComponent(kljuc(g))}`;

/* ─── Izris ─── */
const $main = document.getElementById('main');
const $crumbs = document.getElementById('crumbs');
function drobtine(deli) {
  $crumbs.innerHTML = deli.map((d, i) => i === deli.length - 1
    ? `<span class="cur">${esc(d[0])}</span>`
    : `<a href="${d[1]}">${esc(d[0])}</a><span class="sep">›</span>`).join('');
  document.title = (deli.length > 1 ? deli[deli.length - 1][0] + ' — ' : '') + 'Brihta — Šola';
}
function aktivniNav(dash) { document.getElementById('nav-dash').classList.toggle('active', dash); }

function kartica(p) {
  const href = p.otroci ? `#/${p.id}` : `#/p/${p.id}`;
  const vsa = vsaZa(p), n = vsa.filter(g => jeDanes(g.datum)).length;
  const term = p.otroci ? `${p.otroci.length} skupine` : (p.opis || 'Šolsko leto 2026/27');
  return `<a class="card" href="${href}">
    <div class="card-hero" style="background:${p.barva}">
      <span class="emoji" aria-hidden="true">${p.emoji}</span>
      ${n ? `<span class="badge">Novo danes</span>` : ''}
    </div>
    <div class="card-body">
      <span class="card-name" style="color:${p.barva}">${esc(p.ime)}</span>
      <span class="card-code">${esc(p.koda)}</span>
      <span class="card-term">${esc(term)}</span>
    </div>
    <div class="card-foot">
      <span>${p.otroci ? SVG.sub + 'Izberi skupino' : SVG.files + gradiv(vsa.length)}</span>
    </div>
  </a>`;
}

function stranNadzorna() {
  drobtine([['Nadzorna plošča']]);
  aktivniNav(true);
  const zadnji = najdi(preberi('sola_zadnji') || '');
  $main.innerHTML = `<div class="page">
    <h1 class="page-title">Nadzorna plošča</h1>
    <p class="page-sub">Izberi svoj predmet. Tam te čaka gradivo za današnjo uro.</p>
    <hr class="rule">
    ${zadnji && !zadnji.otroci ? `<div class="resume">
      <span style="font-size:28px" aria-hidden="true">${zadnji.emoji}</span>
      <div class="txt"><small>Nazadnje odprto</small><strong>${esc(zadnji.ime)}</strong></div>
      <a class="btn btn-primary" href="#/p/${zadnji.id}">Nadaljuj</a>
    </div>` : ''}
    <div class="cards">${PREDMETI.map(kartica).join('')}</div>
  </div>`;
}

function stranSkupina(p) {
  drobtine([['Nadzorna plošča', '#/'], [p.ime]]);
  aktivniNav(false);
  $main.innerHTML = `<div class="page">
    <h1 class="page-title">${p.emoji} ${esc(p.ime)}</h1>
    <p class="page-sub">Izberi svojo skupino.</p>
    <hr class="rule">
    <div class="cards">${p.otroci.map(kartica).join('')}</div>
  </div>`;
}

function poTednih(seznam) {
  const tedni = new Map();
  seznam.forEach(g => {
    const k = ponedeljek(g.datum).getTime();
    if (!tedni.has(k)) tedni.set(k, []);
    tedni.get(k).push(g);
  });
  const ta = ponedeljek(new Date()).getTime();
  return [...tedni.entries()].sort((a, b) => b[0] - a[0]).map(([k, g]) => {
    const pon = new Date(k), pet = new Date(k); pet.setDate(pet.getDate() + 4);
    const raz = Math.round((ta - k) / (7 * 864e5));
    const obseg = `${kratek(pon)} – ${kratek(pet)}`;
    const ime = raz === 0 ? `Ta teden (${obseg})` : raz === 1 ? `Prejšnji teden (${obseg})` : `Teden ${obseg} ${pon.getFullYear()}`;
    return { ime, gradiva: g, odprt: raz <= 1 };
  });
}

function vrsticaGradiva(p, g) {
  return `<li class="item">
    ${ikona(g.vrsta)}
    <div class="nm"><a href="${hrefGradiva(p, g)}">${esc(g.ime)}</a>
      <span class="meta">${IMENA_VRST[g.vrsta] || 'Datoteka'} · ${kdaj(g.datum)}${g.velikost ? ' · ' + velikost(g.velikost) : ''}</span></div>
    ${oznaka(g)}
  </li>`;
}
function oznaka(g) {
  const o = g.vrsta === 'kviz' && MOJE[g.id];
  if (o) return `<span class="tag">Oddano · ${o.tocke}/${o.vseh}</span>`;
  return jeDanes(g.datum) ? '<span class="pill">Novo</span>' : '';
}

function okvirPredmeta(p, zavihek, vsebina, stranska, zadnjaDrobtina) {
  const s = p.stars;
  drobtine([['Nadzorna plošča', '#/'], ...(s ? [[s.ime, `#/${s.id}`]] : []), [p.ime, `#/p/${p.id}`], ...(zadnjaDrobtina ? [[zadnjaDrobtina]] : [])]);
  aktivniNav(false);
  $main.innerHTML = `<div class="course${stranska ? '' : ' no-side'}">
    <nav aria-label="Navigacija predmeta">
      <div class="cnav-color" style="background:${p.barva}"></div>
      <ul class="cnav">
        <li><a href="#/p/${p.id}" class="${zavihek === 'domov' ? 'active' : ''}">Domov</a></li>
        <li><a href="#/p/${p.id}/datoteke" class="${zavihek === 'datoteke' ? 'active' : ''}">Datoteke</a></li>
      </ul>
    </nav>
    <div>${vsebina}</div>
    ${stranska ? `<aside class="side">${stranska}</aside>` : ''}
  </div>`;
}

function stranPredmet(p) {
  shrani('sola_zadnji', p.id);
  const seznam = gradivaZa(p.id);
  const zadnje = seznam[0];
  let vsebina = `<h1 class="page-title">${p.emoji} ${esc(p.ime)}</h1><p class="page-sub">${esc(p.koda)}${p.opis ? ' · ' + esc(p.opis) : ''}</p>`;
  if (napaka) {
    vsebina += `<div class="empty">Gradiv trenutno ni mogoče naložiti. Osveži stran.</div>`;
  } else if (!zadnje) {
    vsebina += `<div class="empty"><img src="brihta.png" alt="">Tukaj še ni gradiv.<br>Ko jih učitelj objavi, se pokažejo tukaj.</div>`;
  } else {
    vsebina += `<section class="today" aria-label="Zadnje gradivo">
      <div class="today-head" style="background:${p.barva}">${SVG.star} ${jeDanes(zadnje.datum) ? 'Danes na uri' : 'Zadnje objavljeno'}</div>
      <div class="today-body">
        <div class="today-icon">${ikona(zadnje.vrsta, '')}</div>
        <div class="today-txt"><h2>${esc(zadnje.ime)}</h2><p>${IMENA_VRST[zadnje.vrsta] || 'Datoteka'} · objavljeno ${kdaj(zadnje.datum)}</p></div>
        <a class="btn btn-primary btn-big" href="${hrefGradiva(p, zadnje)}">Odpri</a>
      </div>

    vsebina += poTednih(seznam).map(t => `<section class="module${t.odprt ? '' : ' closed'}">
      <button class="module-head" type="button" aria-expanded="${t.odprt}">${SVG.chev}<span>${esc(t.ime)}</span><span class="count">${t.gradiva.length}</span></button>
      <ul class="module-items">${t.gradiva.map(g => vrsticaGradiva(p, g)).join('')}</ul>
    </section>`).join('');
  }
  const danes = seznam.filter(g => jeDanes(g.datum));
  let stranska = `<h3>Danes</h3><ul>${danes.length
    ? danes.map(g => `<li>${ikona(g.vrsta)}<div><a href="${hrefGradiva(p, g)}">${esc(g.ime)}</a><small>${IMENA_VRST[g.vrsta] || ''}</small></div></li>`).join('')
    : '<li style="color:var(--muted)">Danes še ni novih gradiv.</li>'}</ul>`;
  if (p.stars) stranska += `<h3>Druge skupine</h3><div class="switch">${p.stars.otroci.filter(o => o !== p).map(o => `<a href="#/p/${o.id}">${esc(o.ime)}</a>`).join('')}</div>`;
  okvirPredmeta(p, 'domov', vsebina, stranska);
  $main.querySelectorAll('.module-head').forEach(b => b.addEventListener('click', () => {
    const m = b.parentElement; m.classList.toggle('closed'); b.setAttribute('aria-expanded', !m.classList.contains('closed'));

}

    </tbody></table>` : `<div class="empty"><img src="brihta.png" alt="">Tukaj še ni gradiv.</div>`}`;

}

const OFFICE = ['word', 'powerpoint', 'excel'];
function stranGradivo(p, k) {
  const seznam = gradivaZa(p.id);
  const i = seznam.findIndex(g => kljuc(g) === k);
  if (i < 0) { location.replace(`#/p/${p.id}`); return; }
  shrani('sola_zadnji', p.id);
  if (seznam[i].vrsta === 'kviz') return stranKviz(p, seznam[i]);
  const g = seznam[i], url = naslov(g);
  const lokalno = /^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol === 'file:';
  let notri, opomba = '';
  if (g.vrsta === 'pdf' || g.vrsta === 'html' || g.vrsta === 'besedilo') notri = `<iframe src="${esc(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
  else if (g.vrsta === 'slika') notri = `<img src="${esc(url)}" alt="${esc(g.ime)}">`;
  else if (g.vrsta === 'video') notri = `<video src="${esc(url)}" controls playsinline></video>`;
  else if (g.vrsta === 'zvok') notri = `<audio src="${esc(url)}" controls></audio>`;
  else if (OFFICE.includes(g.vrsta)) {
    notri = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
    opomba = lokalno ? 'Predogled Word/PowerPoint datotek deluje šele na objavljeni strani. Uporabi »Prenesi«.' : 'Če se dokument ne prikaže, klikni »Prenesi«.';
  } else if (g.vrsta === 'povezava') {
    notri = `<div class="open-card">${ikona('povezava', '')}<h2 style="margin:8px 0 4px">${esc(g.ime)}</h2><p>${esc(g.url)}</p><a class="btn btn-primary btn-big" href="${esc(g.url)}" target="_blank" rel="noopener">Odpri povezavo</a></div>`;
  } else {
    notri = `<div class="open-card">${ikona(g.vrsta, '')}<h2 style="margin:8px 0 4px">${esc(g.ime)}</h2><p>Te datoteke ni mogoče prikazati tukaj.</p><a class="btn btn-primary btn-big" href="${esc(url)}" download>Prenesi</a></div>`;
  }
  const starejse = seznam[i + 1], novejse = seznam[i - 1];
  const vsebina = `<div class="viewer-head">
      ${ikona(g.vrsta, '')}
      <h1>${esc(g.ime)}</h1>
      <div class="actions">
        ${g.vrsta !== 'povezava' ? `<button class="btn" id="v-full" type="button" title="Čez cel zaslon">${SVG.full}<span class="lbl">Cel zaslon</span></button>` : ''}
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener" title="Odpri v novem zavihku">${SVG.ext}<span class="lbl">Nov zavihek</span></a>
        ${g.pot ? `<a class="btn" href="${esc(url)}" download title="Prenesi">${SVG.dl}<span class="lbl">Prenesi</span></a>` : ''}
      </div>
    </div>
    <div class="frame" id="frame">${notri}</div>
    ${opomba ? `<p class="note">${opomba}</p>` : ''}
    <div class="seq">
      ${starejse ? `<a class="btn" href="${hrefGradiva(p, starejse)}">${SVG.prev} Prejšnje</a>` : '<span></span>'}
      ${novejse ? `<a class="btn" href="${hrefGradiva(p, novejse)}">Naslednje ${SVG.next}</a>` : '<span></span>'}
    </div>`;
  okvirPredmeta(p, 'domov', vsebina, null, g.ime);
  const fb = document.getElementById('v-full');
  if (fb) fb.addEventListener('click', () => {
    const f = document.getElementById('frame');
    if (f.requestFullscreen) f.requestFullscreen().catch(() => window.open(url, '_blank', 'noopener'));
    else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
    else window.open(url, '_blank', 'noopener');
  });
}

/* ─── Kviz ─── */
const enakaStran = h => location.hash === h;
const osnutekKljuc = id => `sola_osnutek:${ucenec ? ucenec.id : ''}:${id}`;
const tock = n => n === 1 ? 'točka' : n === 2 ? 'točki' : (n === 3 || n === 4) ? 'točke' : 'točk';
const casOddaje = iso => { const d = new Date(iso); return `${kdaj(iso)} ob ${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`; };

function glavaKviza(g) {
  return `<div class="viewer-head">${ikona('kviz', '')}<h1>${esc(g.ime)}</h1></div>
    ${g.opis ? `<p class="page-sub">${esc(g.opis)}</p>` : ''}`;
}

async function stranKviz(p, g) {
  const h = location.hash;
  const glava = glavaKviza(g);
  if (ucitelj) return rezultatiKviza(p, g, glava, h);
  if (!ucenec) {
    okvirPredmeta(p, 'domov', glava + `<div class="empty"><img src="brihta.png" alt="">
      <p style="margin:0 0 14px">Za reševanje kviza se moraš prijaviti.<br>Uporabi isti račun kot pri <strong>Brihta-MAT</strong>.</p>
      <button class="btn btn-primary btn-big" type="button" id="k-prijava">Prijava</button></div>`, null, g.ime);
    document.getElementById('k-prijava').addEventListener('click', () => odpriPredal('racun'));
    return;
  }
  if (MOJE[g.id]) return izidKviza(p, g, MOJE[g.id]);
  okvirPredmeta(p, 'domov', glava + '<p class="note">Nalagam kviz …</p>', null, g.ime);
  const r = await rpc('sola_kviz', { p_id: g.id });
  if (!enakaStran(h)) return;
  if (!Array.isArray(r) || !r.length) {
    okvirPredmeta(p, 'domov', glava + `<div class="empty">${r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Preveri povezavo in osveži stran.' : 'Tega kviza ni več.'}</div>`, null, g.ime);
    return;
  }
  resujKviz(p, g, r[0].vprasanja, h);
}

function izidKviza(p, g, o, svezje) {
  const odst = o.vseh ? Math.round(o.tocke / o.vseh * 100) : 0;
  okvirPredmeta(p, 'domov', glavaKviza(g) + `<div class="result">
      <div style="font-size:2.4rem" aria-hidden="true">${odst >= 80 ? '🏆' : odst >= 50 ? '👍' : '💪'}</div>
      <p>${svezje ? 'Kviz je oddan.' : 'Ta kviz si že oddal/-a.'} Dosegel/-a si</p>
      <div class="score">${o.tocke} / ${o.vseh}</div>
      <p>${tock(o.vseh)} · oddano ${casOddaje(o.oddano)}</p>
    </div>
    <a class="btn" href="#/p/${p.id}">${SVG.prev} Nazaj na ${esc(p.ime)}</a>`, null, g.ime);
}

/* Izriše vprašanja. predogled = samo za ogled (učitelj), brez oddaje. */
function htmlVprasanj(vpr, predogled) {
  const dis = predogled ? ' disabled' : '';
  return vpr.map((q, i) => {
    let telo = '';
    if (q.t === 'izbira' || q.t === 'vec') {
      const tip = q.t === 'izbira' ? 'radio' : 'checkbox';
      telo = (q.t === 'vec' ? '<p class="note" style="margin:-6px 0 8px">Označi vse pravilne odgovore.</p>' : '') +
        q.m.map(m => `<label class="opt"><input type="${tip}" name="q${i}" value="${esc(m)}"${dis}><span>${esc(m)}</span></label>`).join('');
    } else if (q.t === 'kratek') {
      telo = `<input class="short" type="text" data-q="${i}" autocomplete="off" spellcheck="false" placeholder="Tvoj odgovor"${dis}>`;
    } else if (q.t === 'povezi') {
      telo = `<div class="match">${q.l.map((l, j) => `<div class="l">${esc(l)}</div>
        <select data-q="${i}" data-l="${j}" aria-label="${esc(l)}"${dis}><option value="">Izberi …</option>${q.d.map(d => `<option>${esc(d)}</option>`).join('')}</select>`).join('')}</div>`;
    } else if (q.t === 'vrstni') {
      telo = `<p class="note" style="margin:-6px 0 8px">Uredi s puščicama ↑ ↓.</p><ol class="order" data-q="${i}">${q.m.map(m => `<li data-v="${esc(m)}"><span>${esc(m)}</span>
        <button type="button" data-gor aria-label="Gor"${dis}>↑</button><button type="button" data-dol aria-label="Dol"${dis}>↓</button></li>`).join('')}</ol>`;
    }
    return `<section class="q" id="q${i}">
      <div class="q-head"><span>Vprašanje ${i + 1}</span><span>1 ${tock(1)}</span></div>
      <div class="q-body"><p class="q-text">${esc(q.b)}</p>${telo}</div>
    </section>`;
  }).join('');
}

function posodobiPuscice(ol) {
  const li = [...ol.children];
  li.forEach((x, j) => { x.querySelector('[data-gor]').disabled = j === 0; x.querySelector('[data-dol]').disabled = j === li.length - 1; });
}

function resujKviz(p, g, vpr, h) {
  const stranska = `<h3>Vprašanja</h3><ul class="qnav">${vpr.map((q, i) =>
    `<li><span class="dot" id="dot${i}"></span><a href="#q${i}" data-skoci="${i}">Vprašanje ${i + 1}</a></li>`).join('')}</ul>`;
  okvirPredmeta(p, 'domov', glavaKviza(g) + `<form id="kviz" novalidate>${htmlVprasanj(vpr)}
    <div class="quiz-foot"><span class="saved" id="k-shranjeno"></span><span class="msg" id="k-msg"></span>
      <button class="btn btn-primary btn-big" type="submit" id="k-oddaj">Oddaj kviz</button></div></form>`, stranska, g.ime);
  const f = document.getElementById('kviz');

  const zberi = () => vpr.map((q, i) => {
    if (q.t === 'izbira') { const x = f.querySelector(`input[name=q${i}]:checked`); return x ? x.value : null; }
    if (q.t === 'vec') return [...f.querySelectorAll(`input[name=q${i}]:checked`)].map(x => x.value);
    if (q.t === 'kratek') { const v = f.querySelector(`input[data-q="${i}"]`).value.trim(); return v || null; }
    if (q.t === 'povezi') { const o = {}; f.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { if (s.value) o[q.l[+s.dataset.l]] = s.value; }); return o; }
    if (q.t === 'vrstni') return [...f.querySelector(`ol[data-q="${i}"]`).children].map(li => li.dataset.v);
  });
  const odgovorjeno = (q, a) => q.t === 'vec' ? a.length > 0 : q.t === 'povezi' ? Object.keys(a).length === q.l.length
    : q.t === 'vrstni' ? !!premaknjeno[vpr.indexOf(q)] : a != null;
  const premaknjeno = {};

  function osvezi(shraniOsnutek) {
    const a = zberi();
    vpr.forEach((q, i) => document.getElementById('dot' + i).classList.toggle('on', odgovorjeno(q, a[i])));
    if (shraniOsnutek) {
      shrani(osnutekKljuc(g.id), JSON.stringify({ a, premaknjeno }));
      document.getElementById('k-shranjeno').textContent = 'Odgovori so shranjeni na tej napravi.';
    }
  }

  // Obnovi osnutek (npr. po nenamernem osveževanju strani).
  try {
    const o = JSON.parse(preberi(osnutekKljuc(g.id)) || 'null');
    if (o && Array.isArray(o.a)) {
      vpr.forEach((q, i) => {
        const a = o.a[i];
        if (a == null) return;
        if (q.t === 'izbira' || q.t === 'vec') f.querySelectorAll(`input[name=q${i}]`).forEach(x => { x.checked = [].concat(a).includes(x.value); });
        else if (q.t === 'kratek') f.querySelector(`input[data-q="${i}"]`).value = a;
        else if (q.t === 'povezi') f.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { const v = a[q.l[+s.dataset.l]]; if (v && q.d.includes(v)) s.value = v; });
        else if (q.t === 'vrstni' && Array.isArray(a) && a.length === q.m.length && a.every(v => q.m.includes(v))) {
          const ol = f.querySelector(`ol[data-q="${i}"]`);
          a.forEach(v => ol.appendChild([...ol.children].find(li => li.dataset.v === v)));
        }
      });
      Object.assign(premaknjeno, o.premaknjeno || {});
    }
  } catch (e) {}
  f.querySelectorAll('ol.order').forEach(posodobiPuscice);
  osvezi(false);

  f.addEventListener('input', () => osvezi(true));
  f.addEventListener('change', () => osvezi(true));
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-gor],[data-dol]');
    if (b) {
      const li = b.closest('li'), ol = li.parentElement;
      if (b.hasAttribute('data-gor') && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);
      if (b.hasAttribute('data-dol') && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);
      premaknjeno[+ol.dataset.q] = true;
      posodobiPuscice(ol);
      (b.disabled ? li.querySelector('button:not(:disabled)') : b)?.focus();
      osvezi(true);
    }
  });
  document.querySelectorAll('[data-skoci]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); document.getElementById('q' + a.dataset.skoci).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const a = zberi();
    const manjka = vpr.filter((q, i) => q.t !== 'vrstni' && !odgovorjeno(q, a[i])).length;
    const vprasaj = manjka
      ? `Na ${manjka} ${manjka === 1 ? 'vprašanje' : manjka === 2 ? 'vprašanji' : manjka < 5 ? 'vprašanja' : 'vprašanj'} nisi odgovoril/-a. Vseeno oddam?`
      : 'Oddam kviz? Potem odgovorov ne moreš več spreminjati.';
    if (!confirm(vprasaj)) return;
    const btn = document.getElementById('k-oddaj'), msg = document.getElementById('k-msg');
    btn.disabled = true; btn.textContent = 'Oddajam …'; msg.textContent = '';
    const r = await rpc('sola_kviz_oddaj', { p_student: ucenec.id, p_kviz: g.id, p_odgovori: a });
    if (!Array.isArray(r) || !r.length) {
      btn.disabled = false; btn.textContent = 'Oddaj kviz';
      msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Odgovori so shranjeni — poskusi znova.' : 'Oddaja ni uspela. Povej učitelju.';
      return;
    }
    const o = { kviz_id: g.id, tocke: r[0].tocke, vseh: r[0].vseh, oddano: new Date().toISOString() };
    if (!r[0].novo) { const m = await rpc('sola_kviz_moje', { p_student: ucenec.id }); const x = Array.isArray(m) && m.find(y => y.kviz_id === g.id); if (x) Object.assign(o, x); }
    MOJE[g.id] = o;
    try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
    if (enakaStran(h)) { window.scrollTo(0, 0); izidKviza(p, g, o, r[0].novo); }
  });
}

async function rezultatiKviza(p, g, glava, h) {
  okvirPredmeta(p, 'domov', glava + '<p class="note">Nalagam rezultate …</p>', null, g.ime);
  const [rez, kv] = await Promise.all([
    rpc('sola_kviz_rezultati', { p_teacher_id: ucitelj.id, p_kviz: g.id }),
    rpc('sola_kviz', { p_id: g.id }),
  ]);
  if (!enakaStran(h)) return;
  if (!Array.isArray(rez)) {
    okvirPredmeta(p, 'domov', glava + `<div class="empty">${rez === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Rezultatov ni mogoče naložiti.'}</div>`, null, g.ime);
    return;
  }
  const vpr = Array.isArray(kv) && kv.length ? kv[0].vprasanja : [];
  const n = rez.length;
  const povp = n ? Math.round(rez.reduce((s, r) => s + (r.vseh ? r.tocke / r.vseh : 0), 0) / n * 100) : 0;
  const poVpr = vpr.map((_, i) => n ? Math.round(rez.filter(r => r.pravilni && r.pravilni[i] === true).length / n * 100) : 0);
  const celice = r => (r.pravilni || []).map((ok, i) => `<span class="c ${ok ? 'y' : 'n'}" title="Vprašanje ${i + 1}: ${ok ? 'pravilno' : 'napačno'}"></span>`).join('');
  const vsebina = glava + `<div class="stats">
      <div><strong>${n}</strong><span>${n === 1 ? 'oddaja' : n === 2 ? 'oddaji' : n < 5 ? 'oddaje' : 'oddaj'}</span></div>
      <div><strong>${n ? povp + ' %' : '–'}</strong><span>povprečje</span></div>
      ${vpr.length ? `<div><strong>${vpr.length}</strong><span>vprašanj</span></div>` : ''}
    </div>
    ${n ? `<table class="ftable rtable"><thead><tr><th>Učenec</th><th class="hide-m">Razred</th><th>Točke</th><th class="hide-m">Po vprašanjih</th><th class="hide-m">Oddano</th><th></th></tr></thead><tbody>
      ${rez.map(r => `<tr><td>${esc(r.emoji || '🦉')} ${esc(r.ime)}<br><small class="m">${esc(r.username)}</small></td>
        <td class="m hide-m">${esc(r.razred || '–')}</td><td><strong>${r.tocke}</strong> / ${r.vseh}</td>
        <td class="cells hide-m">${celice(r)}</td><td class="m hide-m">${casOddaje(r.oddano)}</td>
        <td><button class="btn" type="button" data-ponastavi="${esc(r.student_id)}" data-ime="${esc(r.ime)}" title="Izbriše oddajo, da lahko učenec kviz reši znova">Ponastavi</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Kviza še ni oddal nihče.</div>'}
    <div style="margin:18px 0 30px"><button class="btn" type="button" id="r-osvezi">Osveži</button></div>
    ${vpr.length ? `<h2 style="font-size:1.25rem;margin-bottom:12px">Predogled vprašanj</h2>${htmlVprasanj(vpr, true)}` : ''}`;
  const stranska = `<h3>Učiteljski pogled</h3><p class="note" style="margin-top:0">Učenci tukaj vidijo kviz za reševanje. Po oddaji vidijo samo svoje točke.</p>
    ${vpr.length ? `<h3>Uspešnost po vprašanjih</h3><ul>${poVpr.map((x, i) => `<li><span style="flex:1">Vprašanje ${i + 1}</span><strong>${n ? x + ' %' : '–'}</strong></li>`).join('')}</ul>` : ''}`;
  okvirPredmeta(p, 'domov', vsebina, stranska, g.ime);
  document.getElementById('r-osvezi').addEventListener('click', () => rezultatiKviza(p, g, glava, h));
  $main.querySelectorAll('[data-ponastavi]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Izbrišem oddajo učenca ${b.dataset.ime}? Kviz bo lahko rešil znova.`)) return;
    b.disabled = true;
    await rpc('sola_kviz_ponastavi', { p_teacher_id: ucitelj.id, p_kviz: g.id, p_student: b.dataset.ponastavi });
    rezultatiKviza(p, g, glava, h);
  }));
}

function izbiraZivali() {
  const el = document.createElement('div');
  let zap = [];
  el.innerHTML = `<div class="animals-slots"></div><div class="animals">${ZIVALI.map((z, i) => `<button type="button" data-z="${i}" aria-label="${z}">${z}</button>`).join('')}</div>
    <div class="animals-row"><span class="kaj"></span><button type="button" class="linkbtn" data-pocisti>⌫ Počisti</button></div>`;
  const izris = () => {
    el.querySelector('.animals-slots').innerHTML = [0, 1, 2, 3].map(i => `<span class="${zap[i] != null ? 'full' : ''}">${zap[i] != null ? ZIVALI[zap[i]] : ''}</span>`).join('');
    el.querySelector('.kaj').textContent = zap.length < 4 ? `Izberi še ${4 - zap.length}` : '✓ Geslo izbrano';
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-z]');
    if (b && zap.length < 4) { zap.push(+b.dataset.z); izris(); }
    if (e.target.closest('[data-pocisti]')) { zap = []; izris(); }
  });
  izris();
  return { el, geslo: () => zap.length === 4 ? zap.join(',') : null };
}

function posodobiNav() {
  document.getElementById('nav-avatar').textContent = ucitelj ? '👨‍🏫' : ucenec ? (ucenec.emoji || '🦉') : '👤';
  document.getElementById('nav-name').textContent = ucitelj ? ucitelj.username : ucenec ? ucenec.username : 'Prijava';
}

async function poPrijavi() {
  shraniRacun();
  posodobiNav();
  odpriPredal(null);
  await naloziMoje();
  usmeri();
}

function izrisiRacun(pogled) {
  const $t = document.getElementById('acct-title'), $b = document.getElementById('acct-body');
  if (ucitelj || ucenec) {
    $t.textContent = 'Račun';
    const oddanih = Object.keys(MOJE).length;
    $b.innerHTML = `<div class="acct-who"><span class="big">${ucitelj ? '👨‍🏫' : esc(ucenec.emoji || '🦉')}</span>
        <div><strong>${esc(ucitelj ? ucitelj.username : (ucenec.display_name || ucenec.username))}</strong>
        <small>${ucitelj ? 'Učitelj' : 'Uporabniško ime: ' + esc(ucenec.username)}</small></div></div>
      ${ucenec ? `<p class="note">Oddanih kvizov: ${oddanih}</p>` : '<p class="note">Odpri kviz in videl boš rezultate učencev.</p>'}
      <button class="btn btn-block" type="button" id="a-odjava">Odjava</button>
      <p class="note">Isti račun velja tudi za Brihta-MAT.</p>`;
    document.getElementById('a-odjava').addEventListener('click', () => { ucenec = null; ucitelj = null; MOJE = {}; poPrijavi(); });
    return;
  }
  if (pogled === 'nov') {
    $t.textContent = 'Nov račun';
    $b.innerHTML = `<div class="help">⚠️ Nov račun ustvari <strong>samo, če ga še nimaš</strong> (tudi pri Brihta-MAT).
        Če si geslo pozabil/-a, ti ga učitelj ponastavi.</div>
      <div class="field"><label for="n-ime">Tvoje ime</label><input id="n-ime" maxlength="20" autocomplete="off" placeholder="npr. Nina"></div>
      <div class="field"><label for="n-st">Tvoja najljubša številka</label><input id="n-st" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="npr. 7"></div>
      <div class="field"><label>Izberi svoj emoji</label><div class="emojis">${EMOJIJI.map((x, i) => `<button type="button" data-e="${x}" class="${i ? '' : 'on'}">${x}</button>`).join('')}</div></div>
      <div class="field"><label>Geslo — izberi 4 živali in si zapomni vrstni red</label><div id="n-zivali"></div></div>
      <button class="btn btn-primary btn-block" type="button" id="n-ok">Ustvari račun</button>
      <div class="msg" id="n-msg"></div>
      <button class="linkbtn" type="button" data-pogled="prijava">← Že imam račun</button>`;
    const z = izbiraZivali(); document.getElementById('n-zivali').appendChild(z.el);
    let emoji = EMOJIJI[0];
    $b.querySelector('.emojis').addEventListener('click', e => {
      const b = e.target.closest('[data-e]'); if (!b) return;
      $b.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('on', x === b)); emoji = b.dataset.e;
    });
    document.getElementById('n-ok').addEventListener('click', async () => {
      const ime = document.getElementById('n-ime').value.trim().slice(0, 20);
      const st = document.getElementById('n-st').value.replace(/\D/g, '').slice(0, 3);
      const msg = document.getElementById('n-msg');
      if (!ime) return void (msg.textContent = 'Vpiši svoje ime.');
      if (!st) return void (msg.textContent = 'Vpiši svojo najljubšo številko.');
      if (!z.geslo()) return void (msg.textContent = 'Izberi vse 4 živali.');
      const btn = document.getElementById('n-ok'); btn.disabled = true; btn.textContent = 'Ustvarjam …';
      const r = await rpc('register_student', { p_name: ime, p_number: st, p_emoji: emoji, p_pin: z.geslo() });
      if (!Array.isArray(r) || !r.length) {
        btn.disabled = false; btn.textContent = 'Ustvari račun';
        msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Računa ni bilo mogoče ustvariti. Poskusi znova.';
        return;
      }
      ucenec = { id: r[0].id, username: r[0].username, emoji: r[0].emoji, display_name: r[0].display_name };
      ucitelj = null; shraniRacun(); posodobiNav();
      $b.innerHTML = `<p>Račun je ustvarjen. Tvoje uporabniško ime je</p><div class="reg-user">${esc(ucenec.username)}</div>
        <div class="help">📌 Dobro si ga zapomni (in svoje 4 živali) — rabil/-a ga boš za prijavo.</div>
        <button class="btn btn-primary btn-block" type="button" id="n-naprej">Naprej</button>`;
      document.getElementById('n-naprej').addEventListener('click', poPrijavi);
    });
  } else if (pogled === 'ucitelj') {
    $t.textContent = 'Prijava za učitelje';
    $b.innerHTML = `<form id="u-form">
      <div class="field"><label for="u-mail">E-naslov</label><input id="u-mail" type="email" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="u-pass">Geslo</label><input id="u-pass" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" type="submit" id="u-ok">Prijava</button>
      <div class="msg" id="u-msg"></div></form>
      <p class="note">Isti račun kot v Brihta-MAT. Novega učiteljskega računa ustvariš tam.</p>
      <button class="linkbtn" type="button" data-pogled="prijava">← Prijava za učence</button>`;
    document.getElementById('u-form').addEventListener('submit', async e => {
      e.preventDefault();
      const mail = document.getElementById('u-mail').value.trim().toLowerCase(), pass = document.getElementById('u-pass').value;
      const msg = document.getElementById('u-msg');
      if (!mail || !pass) return void (msg.textContent = 'Vpiši e-naslov in geslo.');
      const btn = document.getElementById('u-ok'); btn.disabled = true; btn.textContent = 'Preverjam …';
      const r = await rpc('login_teacher_email', { p_email: mail, p_password: pass });
      btn.disabled = false; btn.textContent = 'Prijava';
      if (r === NEDOSEGLJIVO) return void (msg.textContent = 'Strežnik ni dosegljiv.');
      if (!Array.isArray(r) || !r.length) return void (msg.textContent = 'Napačen e-naslov ali geslo.');
      if (!r[0].approved) return void (msg.textContent = 'Račun še ni potrjen.');
      if (r[0].must_change) return void (msg.textContent = 'Najprej se prijavi v Brihta-MAT in zamenjaj začetno geslo.');
      ucitelj = { id: r[0].id, username: r[0].username, email: r[0].email, mustChange: false };
      ucenec = null; MOJE = {};
      poPrijavi();
    });
  } else {
    $t.textContent = 'Prijava';
    $b.innerHTML = `<p class="note" style="margin-top:0">Prijavi se z računom, ki ga imaš pri <strong>Brihta-MAT</strong>.</p>
      <div class="field"><label for="p-ime">Uporabniško ime</label><input id="p-ime" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="npr. nina7"></div>
      <div class="field"><label>Geslo — poklikaj svoje 4 živali</label><div id="p-zivali"></div></div>
      <button class="btn btn-primary btn-block" type="button" id="p-ok">Prijava</button>
      <div class="msg" id="p-msg"></div><div id="p-pomoc"></div>
      <button class="linkbtn" type="button" data-pogled="nov">Še nimam računa — ustvari novega</button>
      <button class="linkbtn" type="button" data-pogled="ucitelj">👨‍🏫 Prijava za učitelje</button>`;
    const z = izbiraZivali(); document.getElementById('p-zivali').appendChild(z.el);
    document.getElementById('p-ok').addEventListener('click', async () => {
      const ime = document.getElementById('p-ime').value.trim().toLowerCase();
      const msg = document.getElementById('p-msg');
      if (!ime) return void (msg.textContent = 'Vpiši uporabniško ime.');
      if (!z.geslo()) return void (msg.textContent = 'Izberi vse 4 živali.');
      const btn = document.getElementById('p-ok'); btn.disabled = true; btn.textContent = 'Preverjam …';
      const r = await rpc('login_student', { p_username: ime, p_pin: z.geslo() });
      btn.disabled = false; btn.textContent = 'Prijava';
      if (r === NEDOSEGLJIVO) return void (msg.textContent = 'Strežnik ni dosegljiv. Preveri povezavo.');
      if (!Array.isArray(r) || !r.length) {
        msg.textContent = 'Napačno uporabniško ime ali geslo.';
        document.getElementById('p-pomoc').innerHTML = '<div class="help">🙋 Si pozabil/-a geslo ali uporabniško ime? <strong>Povej učitelju</strong> — ponastavi ti ga. Ne delaj novega računa.</div>';
        return;
      }
      ucenec = { id: r[0].id, username: r[0].username, emoji: r[0].emoji, display_name: r[0].display_name };
      ucitelj = null;
      poPrijavi();
    });
  }
  $b.querySelectorAll('[data-pogled]').forEach(b => b.addEventListener('click', () => izrisiRacun(b.dataset.pogled)));
  const prvi = $b.querySelector('input'); if (prvi) setTimeout(() => prvi.focus(), 230);
}

/* ─── Predal s predmeti ─── */
function napolniPredal() {
  document.getElementById('tray-list').innerHTML = PREDMETI.map(p => p.otroci
    ? `<li><a href="#/${p.id}">${p.emoji} ${esc(p.ime)}<span class="term">${p.otroci.length} skupine</span></a></li>` +
      p.otroci.map(o => `<li class="sub"><a href="#/p/${o.id}">${esc(o.ime)}</a></li>`).join('')
    : `<li><a href="#/p/${p.id}">${p.emoji} ${esc(p.ime)}<span class="term">${esc(p.koda)}</span></a></li>`).join('');
}
const PREDALI = {
  predmeti: [document.getElementById('tray'), document.getElementById('nav-courses')],
  racun: [document.getElementById('acct'), document.getElementById('nav-acct')],
};
let odprtPredal = null;
function odpriPredal(ime) {
  odprtPredal = ime;
  for (const [k, [predal, gumb]] of Object.entries(PREDALI)) {
    predal.classList.toggle('open', k === ime);
    gumb.classList.toggle('active', k === ime);
    gumb.setAttribute('aria-expanded', k === ime);
  }
  document.body.classList.toggle('tray-open', !!ime);
  if (ime === 'racun') izrisiRacun();
}
for (const [k, [, gumb]] of Object.entries(PREDALI)) gumb.addEventListener('click', () => odpriPredal(odprtPredal === k ? null : k));
document.getElementById('tray-close').addEventListener('click', () => odpriPredal(null));
document.querySelectorAll('[data-zapri]').forEach(b => b.addEventListener('click', () => odpriPredal(null)));
document.getElementById('tray-back').addEventListener('click', () => odpriPredal(null));
document.getElementById('tray-list').addEventListener('click', e => { if (e.target.closest('a')) odpriPredal(null); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') odpriPredal(null); });

/* ─── Usmerjanje ─── */
function usmeri() {
  const deli = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (deli[0] === 'p' && deli[1]) {
    const p = najdi(deli[1]);
    if (!p || p.otroci) return stranNadzorna();
    if (deli[2] === 'datoteke') return stranDatoteke(p);
    if (deli[2]) return stranGradivo(p, decodeURIComponent(deli.slice(2).join('/')));
    return stranPredmet(p);
  }
  const p = deli[0] && najdi(deli[0]);
  if (p && p.otroci) return stranSkupina(p);
  if (p) { location.replace(`#/p/${p.id}`); return; }
  stranNadzorna();
}
window.addEventListener('hashchange', usmeri);

/* Ko se zavihek spet pokaže, preveri nova gradiva (ne med ogledom gradiva). */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  const stanje = () => JSON.stringify([GRADIVA, KVIZI, MOJE]);
  const prej = stanje();
  await Promise.all([naloziGradiva(), naloziKvize(), naloziMoje()]);
  const ogled = /^#\/p\/[^/]+\/(?!datoteke$)./.test(location.hash);
  if (!ogled && stanje() !== prej) usmeri();
});

napolniPredal();
posodobiNav();
Promise.all([naloziGradiva(), naloziKvize(), naloziMoje()]).then(usmeri);
</script>
