<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brihta — Šola</title>
  <link rel="icon" href="brihta.png">
  <meta name="theme-color" content="#fff8ef">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #fff8ef;
      --surface: #ffffff;
      --ink: #1f2340;
      --muted: #6b6f8a;
      --line: #efe6d8;
      --line-2: #e4d9c7;
      --accent: #6c5ce7;
      --accent-2: #a855f7;
      --accent-ink: #4b3fd1;
      --good: #16a34a;
      --bad: #e11d48;
      --sun: #ffb020;
      --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
      --shadow: 0 1px 2px rgba(31,35,64,.05), 0 10px 30px -14px rgba(31,35,64,.28);
      --shadow-up: 0 2px 4px rgba(31,35,64,.06), 0 22px 40px -18px rgba(31,35,64,.38);
      --head: 'Nunito', system-ui, sans-serif;
    }
    html, body { margin: 0; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(rgba(31,35,64,.07) 1.2px, transparent 1.3px);
      background-size: 22px 22px;
      font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: var(--accent-ink); }
    button { font: inherit; color: inherit; }
    h1, h2, h3 { font-family: var(--head); font-weight: 900; margin: 0; line-height: 1.15; letter-spacing: -.02em; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ─── Top bar ─── */
    .top {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,248,239,.82);
      backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
      border-bottom: 1px solid rgba(228,217,199,.7);
    }
    .top-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
    .brand img { width: 46px; height: 46px; display: block; filter: drop-shadow(0 4px 8px rgba(31,35,64,.18)); transition: transform .25s; }
    .brand:hover img { transform: rotate(-8deg) scale(1.05); }
    .brand b { font-family: var(--head); font-size: 1.45rem; font-weight: 900; letter-spacing: -.02em; }
    .brand b span { color: var(--accent); }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px;
      border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface);
      font-weight: 800; cursor: pointer; text-decoration: none; color: var(--ink);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .pill-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: #d5c7b0; }
    .pill-btn svg { width: 20px; height: 20px; }
    .pill-btn.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,.18); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; background: linear-gradient(135deg, #ffe7c2, #ffd1e8); margin-left: -8px; }
    .acct-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trail { max-width: 1180px; margin: 0 auto; padding: 14px 20px 0; font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 20px; }
    .trail a { color: var(--muted); text-decoration: none; font-weight: 700; }
    .trail a:hover { color: var(--ink); }
    .trail .sep { opacity: .5; }
    .trail .cur { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }

    main { max-width: 1180px; margin: 0 auto; padding: 14px 20px 60px; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
      height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 800; font-size: 1rem;
      border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); text-decoration: none; white-space: nowrap;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-go {
      border: 0; color: #fff; background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, var(--accent-2)));
      box-shadow: 0 8px 18px -8px var(--c1, var(--accent));
    }
    .btn-go:hover { box-shadow: 0 12px 24px -10px var(--c1, var(--accent)); }
    .btn-big { height: 54px; padding: 0 26px; font-size: 1.1rem; }
    .btn-block { width: 100%; }

    /* ─── Dashboard ─── */
    .hello {
      position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center;
      background: linear-gradient(120deg, #2a2366 0%, #5b3fd6 55%, #a855f7 100%);
      color: #fff; border-radius: var(--r-xl); padding: 30px 34px; overflow: hidden; margin: 6px 0 28px;
      box-shadow: var(--shadow-up);
    }
    .hello::before, .hello::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
    .hello::before { width: 260px; height: 260px; right: -60px; top: -110px; background: radial-gradient(circle, rgba(255,176,32,.55), transparent 70%); }
    .hello::after { width: 220px; height: 220px; left: 30%; bottom: -150px; background: radial-gradient(circle, rgba(56,189,248,.45), transparent 70%); }
    .hello > * { position: relative; }
    .hello .date { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; opacity: .8; }
    .hello h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); margin: 4px 0 8px; }
    .hello p { margin: 0; font-size: 1.08rem; opacity: .92; max-width: 560px; }
    .hello .resume { margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); color: #fff; padding: 8px 8px 8px 16px; border-radius: 999px; text-decoration: none; font-weight: 800; transition: background .15s; }
    .hello .resume:hover { background: rgba(255,255,255,.26); }
    .hello .resume span { background: #fff; color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-size: .9rem; white-space: nowrap; }
    .owl { display: flex; align-items: flex-end; }
    .owl img { width: 128px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.3)); animation: bob 4s ease-in-out infinite; }
    .bubble { background: #fff; color: var(--ink); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-weight: 700; font-size: .92rem; max-width: 220px; margin-bottom: 92px; margin-right: -14px; box-shadow: 0 8px 20px -10px rgba(0,0,0,.4); }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(2deg); } }

    .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
    .sec-h h2 { font-size: 1.5rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
    .card {
      position: relative; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg);
      text-decoration: none; color: var(--ink); box-shadow: var(--shadow); overflow: hidden;
      transition: transform .2s cubic-bezier(.2,.8,.3,1.4), box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow-up); }
    .card:hover .art .emoji { animation: wiggle .5s ease-in-out; }
    .card.wide { grid-column: span 2; }
    .card > a { color: inherit; text-decoration: none; display: block; }
    .art {
      position: relative; height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: linear-gradient(135deg, var(--c1), var(--c2));
    }
    .art::before { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.16); top: -70px; left: -50px; }
    .art::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 42% 58% 60% 40%; background: rgba(255,255,255,.12); bottom: -50px; right: -20px; }
    .art .emoji { font-size: 74px; line-height: 1; position: relative; z-index: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }
    .art .new { position: absolute; top: 12px; right: 12px; z-index: 1; background: var(--sun); color: #3b2500; font-weight: 800; font-size: .78rem; padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.35); animation: pop .5s ease-out; }
    @keyframes wiggle { 25% { transform: rotate(-10deg) scale(1.08); } 60% { transform: rotate(8deg) scale(1.08); } }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .card-body { padding: 14px 18px 16px; display: flex; align-items: center; gap: 10px; }
    .card-body h3 { font-size: 1.2rem; }
    .card-body p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; font-weight: 600; }
    .card-body .go { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s, color .2s; }
    .card:hover .go { background: var(--c1); color: #fff; }
    .card-body .go svg { width: 18px; height: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 18px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: .92rem;
      text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--c1) 12%, white); border: 1.5px solid color-mix(in srgb, var(--c1) 30%, white);
      transition: transform .15s, background .15s, color .15s;
    }
    .chip:hover { transform: translateY(-2px); background: var(--c1); color: #fff; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }

    /* ─── Subject banner ─── */
    .banner {
      position: relative; border-radius: var(--r-xl); padding: 26px 30px 0; color: #fff; overflow: hidden; margin: 6px 0 26px;
      background: linear-gradient(120deg, var(--c1), var(--c2)); box-shadow: var(--shadow-up);
    }
    .banner::before { content: ''; position: absolute; width: 320px; height: 320px; border-radius: 50%; background: rgba(255,255,255,.12); right: -80px; top: -140px; }
    .banner::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.18) 1.4px, transparent 1.5px); background-size: 20px 20px; mask-image: linear-gradient(90deg, transparent 40%, #000); -webkit-mask-image: linear-gradient(90deg, transparent 40%, #000); pointer-events: none; }
    .banner > * { position: relative; z-index: 1; }
    .banner-top { display: flex; align-items: center; gap: 18px; }
    .banner .emoji { font-size: 64px; line-height: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }
    .banner h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
    .banner p { margin: 4px 0 0; font-weight: 700; opacity: .9; }
    .banner-sw { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .banner-sw a { color: #fff; text-decoration: none; font-weight: 800; font-size: .88rem; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.26); }
    .banner-sw a:hover { background: rgba(255,255,255,.28); }
    .tabs { display: flex; gap: 4px; margin-top: 20px; }
    .tabs a { color: #fff; text-decoration: none; font-weight: 800; padding: 10px 18px 12px; border-radius: 16px 16px 0 0; opacity: .85; }
    .tabs a:hover { opacity: 1; background: rgba(255,255,255,.12); }
    .tabs a.active { background: var(--bg); color: var(--ink); opacity: 1; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
    .layout.solo { grid-template-columns: minmax(0, 1fr); }
    .layout.ozko { max-width: 860px; margin: 0 auto; }
    .side { position: sticky; top: 90px; display: grid; gap: 18px; }
    .box { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); }
    .box h3 { font-size: 1.1rem; margin-bottom: 10px; }
    .box ul { list-style: none; margin: 0; padding: 0; }
    .box li { padding: 6px 0; font-weight: 600; }
    .note { color: var(--muted); font-size: .9rem; margin: 6px 0; }

    /* Today hero */
    .today {
      position: relative; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      background: var(--surface); border-radius: var(--r-xl); padding: 24px; margin: 8px 0 30px; box-shadow: var(--shadow-up);
      border: 2px solid color-mix(in srgb, var(--c1) 35%, white);
    }
    .today .label {
      position: absolute; top: -13px; left: 22px; background: var(--sun); color: #3b2500; font-weight: 800; font-size: .78rem;
      letter-spacing: .06em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.3);
    }
    .tile { width: 64px; height: 64px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--t) 13%, white); color: var(--t); }
    .tile svg { width: 34px; height: 34px; }
    .tile.sm { width: 46px; height: 46px; border-radius: 14px; }
    .tile.sm svg { width: 24px; height: 24px; }
    .tile.xs { width: 34px; height: 34px; border-radius: 10px; }
    .tile.xs svg { width: 18px; height: 18px; }
    .today .txt { flex: 1; min-width: 200px; }
    .today h2 { font-size: 1.6rem; }
    .today p { margin: 4px 0 0; color: var(--muted); font-weight: 700; }

    /* Weeks */
    .week { margin-bottom: 26px; }
    .week-h { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 4px 2px 10px; cursor: pointer; text-align: left; }
    .week-h h3 { font-size: 1.15rem; }
    .week-h .count { background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 999px; font-size: .8rem; font-weight: 800; padding: 1px 9px; color: var(--muted); }
    .week-h .chev { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line-2); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
    .week-h .chev svg { width: 16px; height: 16px; }
    .week.closed .chev { transform: rotate(-90deg); }
    .week.closed .items { display: none; }
    .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .item a {
      display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; background: var(--surface); border-radius: var(--r-md);
      text-decoration: none; color: var(--ink); box-shadow: 0 1px 2px rgba(31,35,64,.05); border: 1.5px solid transparent;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .item a:hover { transform: translateX(4px); border-color: color-mix(in srgb, var(--c1) 40%, white); box-shadow: var(--shadow); }
    .item .nm { flex: 1; min-width: 0; }
    .item .nm b { display: block; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .nm small { color: var(--muted); font-weight: 600; }
    .item .arrow { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .tag { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
    .tag.new { background: var(--sun); color: #3b2500; }
    .tag.done { background: #dcfce7; color: #166534; }

    .empty { background: var(--surface); border-radius: var(--r-xl); padding: 36px 24px; text-align: center; color: var(--muted); font-weight: 600; box-shadow: var(--shadow); }
    .empty img { width: 104px; height: 104px; display: block; margin: 0 auto 12px; animation: bob 4s ease-in-out infinite; }
    .empty strong { display: block; color: var(--ink); font-family: var(--head); font-size: 1.3rem; font-weight: 900; margin-bottom: 4px; }

    /* Files list */
    .ftable { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
    .ftable th { text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; padding: 12px 14px; background: #fffcf7; border-bottom: 1.5px solid var(--line); }
    .ftable td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .ftable tr:last-child td { border-bottom: 0; }
    .ftable td.n a { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 800; text-decoration: none; }
    .ftable td.n a:hover { color: var(--accent-ink); }
    .ftable .m { color: var(--muted); white-space: nowrap; font-weight: 600; font-size: .92rem; }

    /* Povezave na strani skupine */
    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .link { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); transition: transform .15s, box-shadow .15s; }
    .link:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
    .ln-art { width: 88px; height: 60px; flex-shrink: 0; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 32px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
    .ln-art img { width: 100%; height: 100%; object-fit: cover; }
    .link .nm { flex: 1; min-width: 0; }
    .link .nm b { display: block; font-weight: 800; }
    .link .nm small { color: var(--muted); font-weight: 600; }
    .link > svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }

    /* ─── Viewer ─── */
    .vhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 6px 0 16px; }
    .vhead h1 { font-size: clamp(1.4rem, 3vw, 1.9rem); flex: 1; min-width: 200px; }
    .vhead .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .frame {
      background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-up); overflow: hidden; border: 6px solid var(--surface);
      height: calc(100vh - 220px); min-height: 420px; display: flex; align-items: center; justify-content: center;
    }
    .frame iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 14px; }
    .frame img, .frame video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; border-radius: 12px; }
    .frame:fullscreen { height: 100vh; border: 0; border-radius: 0; }
    .frame { position: relative; }
    .fs-izhod { display: none; position: absolute; bottom: 18px; right: 22px; z-index: 5; box-shadow: var(--shadow-up); }
    .frame:fullscreen .fs-izhod { display: inline-flex; }
    .frame:-webkit-full-screen .fs-izhod { display: inline-flex; }
    .open-card { text-align: center; padding: 30px; max-width: 460px; }
    .open-card .tile { margin: 0 auto 12px; }
    .open-card h2 { margin-bottom: 4px; }
    .open-card p { color: var(--muted); word-break: break-all; font-weight: 600; }
    .seq { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

    /* ─── Učna ura ─── */
    .vhead h1 .sub { display: block; font-size: .9rem; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
    .steps { list-style: none; margin: 0 0 22px; padding: 0; display: flex; gap: 8px; counter-reset: s; }
    .step { flex: 1; min-width: 0; position: relative; }
    .step a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 800; transition: transform .15s, border-color .15s; height: 100%; }
    .step a:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c1) 45%, white); }
    .step .n { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--line); font-weight: 900; font-size: .95rem; }
    .step .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95rem; }
    .step.done .n { background: #22c55e; color: #fff; font-size: 0; }
    .step.done .n::after { content: '✓'; font-size: .95rem; }
    .step.now a { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 9%, white); }
    .step.now .n { background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; }
    .steps.mini { flex-basis: 100%; margin: 4px 0 0; }
    .steps.mini .step a { padding: 7px 10px; }
    .steps.mini .n { width: 26px; height: 26px; font-size: .85rem; }
    .step-h { margin-bottom: 12px; }
    .step-h h2 { font-size: 1.5rem; flex: 1; min-width: 160px; }

<script>
/* ─── Predmeti ───
   id = ime mape v gradiva/ (in kvizi/). c1/c2 = barvi preliva. */
const PREDMETI = [
  { id: 'racunalnistvo', ime: 'Računalništvo', koda: 'RAČ', c1: '#6366f1', c2: '#a855f7', emoji: '💻',

    otroci: [
      { id: 'racunalnistvo-4',   ime: 'Računalništvo 4',   kratko: '4. razred',    koda: 'RAČ 4',   c1: '#0ea5e9', c2: '#6366f1', emoji: '🖱️', opis: '4. razred',

          { ime: 'Brihta – matematika', opis: 'Vaje iz poštevanke in računanja', url: 'https://brihta.github.io/matematika/', emoji: '🦉', c1: '#6c5ce7', c2: '#a855f7' },
        ] },
      { id: 'racunalnistvo-5',   ime: 'Računalništvo 5',   kratko: '5. razred',    koda: 'RAČ 5',   c1: '#a855f7', c2: '#ec4899', emoji: '🧩', opis: '5. razred' },
      { id: 'racunalnistvo-6',   ime: 'Računalništvo 6',   kratko: '6. razred',    koda: 'RAČ 6',   c1: '#10b981', c2: '#0ea5e9', emoji: '🤖', opis: '6. razred' },
      { id: 'racunalnistvo-6-9', ime: 'Računalništvo 6–9', kratko: '6.–9. razred', koda: 'RAČ 6–9', c1: '#f97316', c2: '#e11d48', emoji: '🧑‍💻', opis: 'od 6. do 9. razreda' },
    ] },
  { id: 'gasilci',            ime: 'Gasilci',                  koda: 'Interesna dejavnost', c1: '#ef4444', c2: '#f97316', emoji: '🚒' },
  { id: 'rokodelnica',        ime: 'Rokodelnica',              koda: 'Interesna dejavnost', c1: '#f59e0b', c2: '#f43f5e', emoji: '🧶' },
  { id: 'svetovni-popotniki', ime: 'Svetovni popotniki',       koda: 'Interesna dejavnost', c1: '#14b8a6', c2: '#0ea5e9', emoji: '🌍' },
  { id: 'matematika-3',       ime: 'Matematika – 3. skupina',  koda: 'MAT · 3. skupina',    c1: '#f43f5e', c2: '#a855f7', emoji: '🔢' },
  { id: 'slovenscina-3',      ime: 'Slovenščina – 3. skupina', koda: 'SLJ · 3. skupina',    c1: '#8b5cf6', c2: '#6366f1', emoji: '📖' },
  { id: 'anglescina-3',       ime: 'Angleščina – 3. skupina',  koda: 'ANG · 3. skupina',    c1: '#06b6d4', c2: '#22c55e', emoji: '💬' },
];

function kdaj(iso) {

async function rpc(fn, params) {

  seznam.forEach(g => {

    if (!tedni.has(k)) tedni.set(k, []);
    tedni.get(k).push(g);

  const ta = ponedeljek(new Date()).getTime();

    const pon = new Date(k), pet = new Date(k); pet.setDate(pet.getDate() + 4);
    const raz = Math.round((ta - k) / (7 * 864e5));
    const obseg = `${kratek(pon)} – ${kratek(pet)}`;

        ${jeUra ? `<ol class="steps mini">${zadnje.koraki.map((k, i) => korakPika(p, zadnje, k, i, -1)).join('')}</ol>` : ''}
      </section>` +
      poTednih(seznam).map(t => `<section class="week${t.odprt ? '' : ' closed'}">
        <button class="week-h" type="button" aria-expanded="${t.odprt}"><h3>${esc(t.ime)}</h3><small class="note" style="margin:0">${esc(t.pod)}</small><span class="count">${t.gradiva.length}</span><span class="chev">${SVG.chev}</span></button>
        <ul class="items">${t.gradiva.map(g => vrsticaGradiva(p, g)).join('')}</ul>
      </section>`).join('');
  }
  vsebina += povezaveHtml(p);
  okvirPredmeta(p, 'domov', vsebina, null);
  $main.querySelectorAll('.week-h').forEach(b => b.addEventListener('click', () => {
    const m = b.parentElement; m.classList.toggle('closed'); b.setAttribute('aria-expanded', !m.classList.contains('closed'));
  }));
}

function stranDatoteke(p) {
  const seznam = gradivaZa(p.id);
  const vsebina = seznam.length ? `<table class="ftable"><thead><tr><th>Ime</th><th>Objavljeno</th><th class="hide-m">Vrsta</th><th class="hide-m">Velikost</th></tr></thead><tbody>
      ${seznam.map(g => `<tr><td class="n"><a href="${hrefGradiva(p, g)}">${tile(g.vrsta, 'xs')}${esc(g.ime)}</a></td>
        <td class="m">${kdaj(g.datum)}</td><td class="m hide-m">${IMENA_VRST[g.vrsta] || ''}</td><td class="m hide-m">${velikost(g.velikost)}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty"><img src="brihta.png" alt=""><strong>Tukaj je še prazno</strong>Ko učitelj objavi gradivo, se pokaže tukaj.</div>`;
  okvirPredmeta(p, 'datoteke', vsebina, null, 'Vsa gradiva');
}

const OFFICE = ['word', 'powerpoint', 'excel'];
function stranGradivo(p, k, korak) {
  const seznam = [...gradivaZa(p.id), ...KVIZI.filter(x => x.predmet === p.id && uraKviza(p.id, x))];
  const i = seznam.findIndex(g => kljuc(g) === k);
  if (i < 0) { location.replace(`#/p/${p.id}`); return; }
  shrani('sola_zadnji', p.id);
  if (seznam[i].vrsta === 'kviz') return stranKviz(p, seznam[i]);
  if (seznam[i].vrsta === 'ura') return stranUra(p, seznam[i], korak);
  const g = seznam[i], url = naslov(g);
  const { notri, opomba } = prikaz(g);
  const starejse = seznam[i + 1], novejse = seznam[i - 1];
  const vsebina = `<div class="vhead">
      <a class="btn" href="#/p/${p.id}" aria-label="Nazaj">${SVG.prev}</a>
      ${tile(g.vrsta, 'sm')}
      <h1>${esc(g.ime)}</h1>
      ${gumbiOgleda(g)}
    </div>
    <div class="frame" id="frame">${notri}</div>
    ${opomba ? `<p class="note">${opomba}</p>` : ''}
    <div class="seq">
      ${starejse ? `<a class="btn" href="${hrefGradiva(p, starejse)}">${SVG.prev} Prejšnje</a>` : '<span></span>'}
      ${novejse ? `<a class="btn" href="${hrefGradiva(p, novejse)}">Naslednje ${SVG.next}</a>` : '<span></span>'}
    </div>`;
  okvirPredmeta(p, 'gradivo', vsebina, null, g.ime);
  poveziCelZaslon(url);
}

/* Ime prenesene datoteke pri koraku ure: »6. ura Razgradnja in vzorci - Zapis.pdf«. */
function imePrenosa(ura, k) {
  const konc = (k.pot || '').match(/\.[^./]+$/);
  return `${ura.ime} - ${k.ime}${konc ? konc[0] : ''}`.replace(/[\\/:*?"<>|]/g, '');
}
const atrPrenosa = ime => ime ? `download="${esc(ime)}"` : 'download';

function gumbiOgleda(g, ime) {
  if (g.vrsta === 'kviz' || g.besedilo != null) return '';
  const url = naslov(g);
  return `<div class="actions">
        ${g.vrsta !== 'povezava' ? `<button class="btn" id="v-full" type="button" title="Čez cel zaslon">${SVG.full}<span class="lbl">Cel zaslon</span></button>` : ''}
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener" title="Odpri v novem zavihku">${SVG.ext}<span class="lbl">Nov zavihek</span></a>
        ${g.pot ? `<a class="btn" href="${esc(url)}" ${atrPrenosa(ime)} title="Prenesi">${SVG.dl}<span class="lbl">Prenesi</span></a>` : ''}
      </div>`;
}
function poveziCelZaslon(url) {
  const fb = document.getElementById('v-full');
  if (fb) fb.addEventListener('click', () => {
    const f = document.getElementById('frame');
    // Gumb za izhod: na interaktivni tabli ni tipke Esc, PDF pa ujame tudi tipkovnico.
    if (!f.querySelector('.fs-izhod')) {
      f.insertAdjacentHTML('beforeend', '<button class="btn btn-go btn-big fs-izhod" type="button">✕ Zapri cel zaslon</button>');
      f.querySelector('.fs-izhod').addEventListener('click', () => {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      });
    }
    if (f.requestFullscreen) f.requestFullscreen().catch(() => window.open(url, '_blank', 'noopener'));
    else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
    else window.open(url, '_blank', 'noopener');
  });
}

/* Zelo preprost Markdown za navodila ure: ## naslovi, seznami, **krepko**, odstavki. */
function md(besedilo) {
  const vrstica = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  let html = '', seznam = null;
  const zapri = () => { if (seznam) { html += `</${seznam}>`; seznam = null; } };
  for (const v of String(besedilo).split(/\r?\n/)) {
    let m;
    if (!v.trim()) { zapri(); continue; }
    if ((m = v.match(/^(#{1,3})\s+(.*)/))) { zapri(); const n = Math.min(m[1].length + 1, 4); html += `<h${n}>${vrstica(m[2])}</h${n}>`; }
    else if ((m = v.match(/^\s*[-*]\s+(.*)/))) { if (seznam !== 'ul') { zapri(); html += '<ul>'; seznam = 'ul'; } html += `<li>${vrstica(m[1])}</li>`; }
    else if ((m = v.match(/^\s*\d+[.)]\s+(.*)/))) { if (seznam !== 'ol') { zapri(); html += '<ol>'; seznam = 'ol'; } html += `<li>${vrstica(m[1])}</li>`; }
    else { zapri(); html += `<p>${vrstica(v)}</p>`; }
  }
  zapri();
  return html;
}

/* ─── Učna ura: koraki eden za drugim ─── */
const kljucUre = g => 'sola_ura:' + g.pot;
function videniKoraki(g) { try { return JSON.parse(preberi(kljucUre(g)) || '[]'); } catch (e) { return []; } }
function naslednjiKorak(g) {
  const v = videniKoraki(g);
  const i = g.koraki.findIndex((k, j) => !v.includes(j));
  return i < 0 ? 0 : i;
}
const hrefKoraka = (p, g, i) => `${hrefGradiva(p, g)}/${i + 1}`;
function korakOpravljen(p, g, k, i) {
  if (k.vrsta === 'kviz') { const kv = kvizKoraka(p.id, k.kviz); return !!(kv && MOJE[kv.id]); }
  return videniKoraki(g).includes(i);
}
function korakPika(p, g, k, i, zdaj) {
  const stanje = i === zdaj ? ' now' : korakOpravljen(p, g, k, i) ? ' done' : '';
  return `<li class="step${stanje}"><a href="${hrefKoraka(p, g, i)}"${i === zdaj ? ' aria-current="step"' : ''}><span class="n">${i + 1}</span><span class="t">${esc(k.ime)}</span></a></li>`;
}
function vsebinaKoraka(p, g, k) {
  if (k.besedilo != null) return `<article class="md">${md(k.besedilo)}</article>`;
  if (k.vrsta === 'kviz') {
    const kv = kvizKoraka(p.id, k.kviz);
    if (!kv) return `<div class="empty"><img src="brihta.png" alt=""><strong>Kviz še ni objavljen</strong>Ko ga učitelj objavi, se pokaže tukaj.</div>`;
    const o = MOJE[kv.id];
    return `<div class="open-card wide">${tile('kviz')}<h2>${esc(kv.ime)}</h2>
      <p>${o ? `Kviz si že rešil: <b>${o.tocke}/${o.vseh}</b> ${tock(o.vseh)}.` : `${kv.vprasanj ? kv.vprasanj + ' vprašanj · ' : ''}${esc(kv.opis || 'Reši sam. Imaš en poskus.')}`}</p>
      <a class="btn btn-go btn-big" href="${hrefGradiva(p, kv)}">${o ? 'Poglej rezultat' : 'Reši kviz'} ${SVG.next}</a></div>`;
  }
  const { notri, opomba } = prikaz(k, imePrenosa(g, k));
  return `<div class="frame" id="frame">${notri}</div>${opomba ? `<p class="note">${opomba}</p>` : ''}`;
}
function stranUra(p, g, korak) {
  const n = g.koraki.length;
  let i = parseInt(korak, 10) - 1;
  if (!(i >= 0 && i < n)) { location.replace(hrefKoraka(p, g, naslednjiKorak(g))); return; }
  const k = g.koraki[i];
  const v = videniKoraki(g);
  if (!v.includes(i)) { v.push(i); shrani(kljucUre(g), JSON.stringify(v)); }
  const prej = g.koraki[i - 1], potem = g.koraki[i + 1];
  const vsebina = `<div class="vhead">
      <a class="btn" href="#/p/${p.id}" aria-label="Nazaj">${SVG.prev}</a>
      ${tile('ura', 'sm')}
      <h1>${esc(g.ime)}<small class="sub">Učna ura · ${kdaj(g.datum)}</small></h1>
    </div>
    <ol class="steps">${g.koraki.map((x, j) => korakPika(p, g, x, j, i)).join('')}</ol>
    <div class="vhead step-h"><span class="badge">Korak ${i + 1} od ${n}</span><h2>${esc(k.ime)}</h2>${gumbiOgleda(k, imePrenosa(g, k))}</div>
    ${vsebinaKoraka(p, g, k)}
    <div class="seq">
      ${prej ? `<a class="btn" href="${hrefKoraka(p, g, i - 1)}">${SVG.prev} ${esc(prej.ime)}</a>` : '<span></span>'}
      ${potem ? `<a class="btn btn-go btn-big" href="${hrefKoraka(p, g, i + 1)}">Naprej: ${esc(potem.ime)} ${SVG.next}</a>`
        : `<a class="btn" href="#/p/${p.id}">Konec ure ✓</a>`}
    </div>`;
  okvirPredmeta(p, 'gradivo', vsebina, null, g.ime);
  if (k.vrsta !== 'kviz' && k.besedilo == null) poveziCelZaslon(naslov(k));
}

function prikaz(g, ime) {
  const url = naslov(g);
  const lokalno = /^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol === 'file:';
  let notri, opomba = '';
  if (g.vrsta === 'pdf' || g.vrsta === 'html' || g.vrsta === 'besedilo') notri = `<iframe src="${esc(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
  else if (g.vrsta === 'slika') notri = `<img src="${esc(url)}" alt="${esc(g.ime)}">`;
  else if (g.vrsta === 'video') notri = `<video src="${esc(url)}" controls playsinline></video>`;
  else if (g.vrsta === 'zvok') notri = `<audio src="${esc(url)}" controls></audio>`;
  else if (OFFICE.includes(g.vrsta)) {
    notri = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}" title="${esc(g.ime)}" allowfullscreen></iframe>`;
    opomba = lokalno ? 'Predogled Word/PowerPoint datotek deluje šele na objavljeni strani. Uporabi »Prenesi«.' : 'Če se dokument ne prikaže, klikni »Prenesi«.';
  } else if (g.vrsta === 'povezava') {
    notri = `<div class="open-card">${tile('povezava')}<h2>${esc(g.ime)}</h2><p>${esc(g.url)}</p><a class="btn btn-go btn-big" href="${esc(g.url)}" target="_blank" rel="noopener">Odpri povezavo ${SVG.ext}</a></div>`;
  } else {
    notri = `<div class="open-card">${tile(g.vrsta)}<h2>${esc(g.ime)}</h2><p>Te datoteke ni mogoče prikazati tukaj.</p><a class="btn btn-go btn-big" href="${esc(url)}" ${atrPrenosa(ime)}>Prenesi ${SVG.dl}</a></div>`;
  }
  return { notri, opomba };
}

/* ─── Kviz ─── */
const enakaStran = h => location.hash === h;
const osnutekKljuc = id => `sola_osnutek:${ucenec ? ucenec.id : ''}:${id}`;
const tock = n => n === 1 ? 'točka' : n === 2 ? 'točki' : (n === 3 || n === 4) ? 'točke' : 'točk';
const casOddaje = iso => { const d = new Date(iso); return `${kdaj(iso)} ob ${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`; };

function glavaKviza(p, g) {
  const u = uraKviza(p.id, g);
  const nazaj = u ? hrefKoraka(p, u, u.koraki.findIndex(k => k.vrsta === 'kviz' && kvizKoraka(p.id, k.kviz) === g)) : `#/p/${p.id}`;
  return `<div class="vhead"><a class="btn" href="${nazaj}" aria-label="Nazaj">${SVG.prev}</a>${tile('kviz', 'sm')}<h1>${esc(g.ime)}</h1></div>
    ${g.opis ? `<p class="note" style="font-size:1rem;margin:-6px 0 18px">${esc(g.opis)}</p>` : ''}`;
}
const okvirKviza = (p, g, vsebina, stranska) => okvirPredmeta(p, 'kviz', glavaKviza(p, g) + vsebina, stranska, g.ime);

async function stranKviz(p, g) {
  const h = location.hash;
  if (ucitelj) return rezultatiKviza(p, g, h);
  if (!ucenec) {
    okvirKviza(p, g, `<div class="empty"><img src="brihta.png" alt=""><strong>Najprej se prijavi</strong>
      <p style="margin:0 0 16px">Uporabi isti račun kot pri <b>Brihta-MAT</b>.</p>
      <button class="btn btn-go btn-big" type="button" id="k-prijava">Prijava</button></div>`);
    document.getElementById('k-prijava').addEventListener('click', () => odpriPredal('racun'));
    return;
  }
  if (MOJE[g.id]) return izidKviza(p, g, MOJE[g.id]);
  okvirKviza(p, g, '<p class="note">Nalagam kviz …</p>');
  const r = await rpc('sola_kviz', { p_id: g.id });
  if (!enakaStran(h)) return;
  if (!Array.isArray(r) || !r.length) {
    okvirKviza(p, g, `<div class="empty"><img src="brihta.png" alt=""><strong>Ups!</strong>${r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Preveri povezavo in osveži stran.' : 'Tega kviza ni več.'}</div>`);
    return;
  }
  resujKviz(p, g, r[0].vprasanja, h);
}

function konfeti(el) {
  const barvice = ['#6366f1', '#a855f7', '#ec4899', '#ffb020', '#22c55e', '#0ea5e9', '#f43f5e'];
  const c = document.createElement('div'); c.className = 'confetti';
  for (let i = 0; i < 70; i++) {
    const k = document.createElement('i');
    k.style.left = Math.random() * 100 + '%';
    k.style.background = barvice[i % barvice.length];
    k.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
    k.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    k.style.setProperty('--d', (1.6 + Math.random() * 1.6) + 's');
    k.style.setProperty('--w', (Math.random() * .6) + 's');
    if (i % 3 === 0) k.style.borderRadius = '50%';
    c.appendChild(k);
  }
  el.appendChild(c);
}

function izidKviza(p, g, o, svezje) {
  const odst = o.vseh ? Math.round(o.tocke / o.vseh * 100) : 0;
  const [naslovIzida, emoji] = odst === 100 ? ['Popolno!', '🏆'] : odst >= 80 ? ['Odlično!', '🌟'] : odst >= 50 ? ['Dobro ti gre!', '👍'] : ['Ne obupaj!', '💪'];
  okvirKviza(p, g, `<section class="result" id="izid">
      <div class="ring" style="--p:${odst}"><div>${o.tocke}/${o.vseh}<small>${tock(o.vseh)}</small></div></div>
      <h2>${emoji} ${naslovIzida}</h2>
      <p>${svezje ? 'Kviz je oddan.' : 'Ta kviz si že rešil/-a.'} Oddano ${casOddaje(o.oddano)}.</p>
    </section>
    <a class="btn" href="#/p/${p.id}">${SVG.prev} Nazaj na ${esc(p.ime)}</a>`);
  if (svezje && odst >= 50) konfeti(document.getElementById('izid'));
}

function poskusiZnova(p, g, o) {
  const odst = o.vseh ? Math.round(o.tocke / o.vseh * 100) : 0;
  okvirKviza(p, g, `<section class="result" id="izid">
      <div class="ring" style="--p:${odst}"><div>${o.tocke}/${o.vseh}<small>${tock(o.vseh)}</small></div></div>
      <h2>🔁 Poskusi znova!</h2>
      <p>Dosegel/-la si manj kot polovico točk, zato se ta poskus ne šteje.</p>
      <p>Še enkrat preberi vprašanja in reši kviz znova.</p>
      <button class="btn btn-go btn-big" type="button" id="k-znova" style="margin-top:16px">Reši znova ${SVG.next}</button>
    </section>
    <a class="btn" href="#/p/${p.id}">${SVG.prev} Nazaj na ${esc(p.ime)}</a>`);
  document.getElementById('k-znova').addEventListener('click', () => { window.scrollTo(0, 0); stranKviz(p, g); });
}

/* Izriše vprašanja. predogled = samo za ogled (učitelj), brez oddaje. */
function htmlVprasanj(vpr, predogled) {
  const dis = predogled ? ' disabled' : '';
  return vpr.map((q, i) => {
    let telo = '', namig = '';
    if (q.t === 'izbira' || q.t === 'vec') {
      const tip = q.t === 'izbira' ? 'radio' : 'checkbox';
      if (q.t === 'vec') namig = 'Označi vse pravilne odgovore.';
      telo = `<div class="opts">${q.m.map(m => `<label class="opt"><input type="${tip}" name="q${i}" value="${esc(m)}"${dis}><span>${esc(m)}</span></label>`).join('')}</div>`;
    } else if (q.t === 'kratek') {
      telo = `<input class="short" type="text" data-q="${i}" autocomplete="off" spellcheck="false" placeholder="Napiši odgovor …"${dis}>`;
    } else if (q.t === 'povezi') {
      namig = 'Vsakemu na levi izberi pravi par.';
      telo = `<div class="match">${q.l.map((l, j) => `<div class="l">${esc(l)}</div><span class="eq">→</span>
        <select data-q="${i}" data-l="${j}" aria-label="${esc(l)}"${dis}><option value="">Izberi …</option>${q.d.map(d => `<option>${esc(d)}</option>`).join('')}</select>`).join('')}</div>`;
    } else if (q.t === 'vrstni') {
      namig = 'Uredi s puščicama ↑ ↓.';
      telo = `<ol class="order" data-q="${i}">${q.m.map(m => `<li data-v="${esc(m)}"><span>${esc(m)}</span>
        <button type="button" data-gor aria-label="Gor"${dis}>↑</button><button type="button" data-dol aria-label="Dol"${dis}>↓</button></li>`).join('')}</ol>`;
    }
    return `<section class="q" id="q${i}">
      <div class="q-top"><span class="q-num">${i + 1}</span><div><p class="q-text">${esc(q.b)}</p>${namig ? `<p class="q-hint">${namig}</p>` : ''}</div></div>
      ${telo}
    </section>`;
  }).join('');
}

function posodobiPuscice(ol) {
  const li = [...ol.children];
  li.forEach((x, j) => { x.querySelector('[data-gor]').disabled = j === 0; x.querySelector('[data-dol]').disabled = j === li.length - 1; });
}

function resujKviz(p, g, vpr, h) {
  okvirKviza(p, g, `<div class="progress" aria-live="polite"><span id="k-st">0 / ${vpr.length}</span><span class="bar"><i id="k-bar"></i></span><span aria-hidden="true">🎯</span></div>
    <form id="kviz" novalidate>${htmlVprasanj(vpr)}
    <div class="quiz-foot"><span class="saved" id="k-shranjeno"></span><span class="msg" id="k-msg"></span>
      <button class="btn btn-go btn-big" type="submit" id="k-oddaj">Oddaj kviz 🚀</button></div></form>`);
  const f = document.getElementById('kviz');
  const premaknjeno = {};

  const zberi = () => vpr.map((q, i) => {
    if (q.t === 'izbira') { const x = f.querySelector(`input[name=q${i}]:checked`); return x ? x.value : null; }
    if (q.t === 'vec') return [...f.querySelectorAll(`input[name=q${i}]:checked`)].map(x => x.value);
    if (q.t === 'kratek') { const v = f.querySelector(`input[data-q="${i}"]`).value.trim(); return v || null; }
    if (q.t === 'povezi') { const o = {}; f.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { if (s.value) o[q.l[+s.dataset.l]] = s.value; }); return o; }
    if (q.t === 'vrstni') return [...f.querySelector(`ol[data-q="${i}"]`).children].map(li => li.dataset.v);
  });
  const odgovorjeno = (q, a, i) => q.t === 'vec' ? a.length > 0 : q.t === 'povezi' ? Object.keys(a).length === q.l.length
    : q.t === 'vrstni' ? !!premaknjeno[i] : a != null;

  function osvezi(shraniOsnutek) {
    const a = zberi();
    const n = vpr.filter((q, i) => odgovorjeno(q, a[i], i)).length;
    document.getElementById('k-st').textContent = `${n} / ${vpr.length}`;
    document.getElementById('k-bar').style.width = (n / vpr.length * 100) + '%';
    if (shraniOsnutek) {
      shrani(osnutekKljuc(g.id), JSON.stringify({ a, premaknjeno }));
      document.getElementById('k-shranjeno').textContent = '💾 Odgovori so shranjeni na tej napravi.';
    }
  }

  // Obnovi osnutek (npr. po nenamernem osveževanju strani).
  try {
    const o = JSON.parse(preberi(osnutekKljuc(g.id)) || 'null');
    if (o && Array.isArray(o.a)) {
      vpr.forEach((q, i) => {
        const a = o.a[i];
        if (a == null) return;
        if (q.t === 'izbira' || q.t === 'vec') f.querySelectorAll(`input[name=q${i}]`).forEach(x => { x.checked = [].concat(a).includes(x.value); });
        else if (q.t === 'kratek') f.querySelector(`input[data-q="${i}"]`).value = a;
        else if (q.t === 'povezi') f.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { const v = a[q.l[+s.dataset.l]]; if (v && q.d.includes(v)) s.value = v; });
        else if (q.t === 'vrstni' && Array.isArray(a) && a.length === q.m.length && a.every(v => q.m.includes(v))) {
          const ol = f.querySelector(`ol[data-q="${i}"]`);
          a.forEach(v => ol.appendChild([...ol.children].find(li => li.dataset.v === v)));
        }
      });
      Object.assign(premaknjeno, o.premaknjeno || {});
    }
  } catch (e) {}
  f.querySelectorAll('ol.order').forEach(posodobiPuscice);
  osvezi(false);

  f.addEventListener('input', () => osvezi(true));
  f.addEventListener('change', () => osvezi(true));
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-gor],[data-dol]');
    if (!b) return;
    const li = b.closest('li'), ol = li.parentElement;
    if (b.hasAttribute('data-gor') && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);
    if (b.hasAttribute('data-dol') && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);
    premaknjeno[+ol.dataset.q] = true;
    li.classList.add('moved');
    setTimeout(() => li.classList.remove('moved'), 400);
    posodobiPuscice(ol);
    (b.disabled ? li.querySelector('button:not(:disabled)') : b)?.focus();
    osvezi(true);
  });

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const a = zberi();
    const manjka = vpr.filter((q, i) => q.t !== 'vrstni' && !odgovorjeno(q, a[i], i)).length;
    const vprasaj = manjka
      ? `Na ${manjka} ${manjka === 1 ? 'vprašanje' : manjka === 2 ? 'vprašanji' : manjka < 5 ? 'vprašanja' : 'vprašanj'} nisi odgovoril/-a. Vseeno oddam?`
      : 'Oddam kviz? Potem odgovorov ne moreš več spreminjati.';
    if (!confirm(vprasaj)) return;
    const btn = document.getElementById('k-oddaj'), msg = document.getElementById('k-msg');
    btn.disabled = true; btn.textContent = 'Oddajam …'; msg.textContent = '';
    const r = await rpc('sola_kviz_oddaj', { p_student: ucenec.id, p_kviz: g.id, p_odgovori: a });
    if (!Array.isArray(r) || !r.length) {
      btn.disabled = false; btn.textContent = 'Oddaj kviz 🚀';
      msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Odgovori so shranjeni — poskusi znova.' : 'Oddaja ni uspela. Povej učitelju.';
      return;
    }
    const o = { kviz_id: g.id, tocke: r[0].tocke, vseh: r[0].vseh, oddano: new Date().toISOString() };
    if (r[0].ponovi) {  // manj kot 50 %: oddaja se ne shrani, učenec reši znova
      try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
      if (enakaStran(h)) { window.scrollTo(0, 0); poskusiZnova(p, g, o); }
      return;
    }
    if (!r[0].novo) { const m = await rpc('sola_kviz_moje', { p_student: ucenec.id }); const x = Array.isArray(m) && m.find(y => y.kviz_id === g.id); if (x) Object.assign(o, x); }
    MOJE[g.id] = o;
    try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
    if (enakaStran(h)) { window.scrollTo(0, 0); izidKviza(p, g, o, r[0].novo); }
  });
}

        <td><button class="btn" type="button" data-ponastavi="${esc(r.student_id)}" data-ime="${esc(r.ime)}" title="Izbriše oddajo, da lahko učenec kviz reši znova">Ponastavi</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty"><img src="brihta.png" alt=""><strong>Še nobene oddaje</strong>Ko učenci oddajo kviz, se pokažejo tukaj.</div>'}
    <div style="margin:18px 0 30px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="r-osvezi">↻ Osveži</button>

    ${vpr.length ? `<div class="box"><h3>Uspešnost po vprašanjih</h3><ul class="bars">${poVpr.map((x, i) => `<li><span>Vprašanje ${i + 1}</span><span class="b"><i style="width:${n ? x : 0}%"></i></span><b>${n ? x + '%' : '–'}</b></li>`).join('')}</ul></div>` : ''}`;

    b.disabled = true;

  }));
}

/* ─── Nov kviz (učitelj) ───
   Enaka pravila kot scripts/kvizi.py. Brskalnik besedilo razčleni in pošlje
   javni del (premešan, brez odgovorov) in ključ; ocenjuje strežnik. */
const PRIMER_KVIZA = `Naslov: Naprave računalnika
Opis: Reši sam. Imaš en poskus.

? Katera naprava je vhodna?
- zaslon
+ tipkovnica
- zvočnik

? Kateri od teh so vhodne naprave?
+ miška
+ mikrofon
- tiskalnik

? Kako se imenuje naprava, s katero premikamo kazalec?
= miška
= računalniška miška

? Poveži napravo z njeno nalogo.
tipkovnica = pisanje
zaslon = prikaz slike
zvočnik = predvajanje zvoka

? Razvrsti od najmanjšega do največjega.
1. bit
2. bajt
3. kilobajt`;

function slugKviza(t) {
  return t.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'kviz';
}
function premesaj(seznam, seme) {
  let h = 1779033703;
  for (const c of seme) h = Math.imul(h ^ c.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  const rnd = () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const a = seznam.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Vrne { predmet, naslov, opis, vprasanja: [{t, b, ...}], kljuc: [...], napake: ['vrstica 3: …'] } */
function razcleniKviz(besedilo, seme) {
  const napake = [], vpr = [];
  let predmet = null, naslov = null, opis = null, q = null;
  besedilo.replace(/\r/g, '').split('\n').forEach((surovo, i) => {
    const st = i + 1, v = surovo.trim();
    if (!v || v.startsWith('#')) return;
    if (!q && !vpr.length) {
      const m = v.match(/^(predmet|naslov|opis)\s*:\s*(.*)$/i);
      if (m) { const k = m[1].toLowerCase(); if (k === 'predmet') predmet = m[2].trim(); else if (k === 'naslov') naslov = m[2].trim(); else opis = m[2].trim(); return; }
    }
    if (v.startsWith('?')) { q = { st, b: v.slice(1).trim(), odg: [] }; vpr.push(q); return; }
    if (!q) { napake.push(`vrstica ${st}: pred prvim vprašanjem (vprašanje se začne z »?«)`); return; }
    let m;
    if ((m = v.match(/^([+\-=])\s*(.+)$/))) return void q.odg.push({ st, v: m[1], a: m[2].trim() });
    if ((m = v.match(/^(\d+)[.)]\s*(.+)$/))) return void q.odg.push({ st, v: '#', n: +m[1], a: m[2].trim() });
    if ((m = v.match(/^(.+?)\s+=\s+(.+)$/))) return void q.odg.push({ st, v: '<>', a: m[1].trim(), d: m[2].trim() });
    if (q.odg.length) napake.push(`vrstica ${st}: ne razumem »${v}« (odgovor se začne s +, -, =, številko ali ima obliko »levo = desno«)`);
    else q.b += '\n' + v;
  });
  if (!naslov) napake.unshift('manjka vrstica »Naslov: …«');
  if (!vpr.length) napake.push('ni nobenega vprašanja (vprašanje se začne z »?«)');
  const javno = [], kljuc = [];
  vpr.forEach((q, n) => {
    const s = `vprašanje ${n + 1} (vrstica ${q.st})`, vrste = new Set(q.odg.map(o => o.v));
    const enaki = a => new Set(a).size !== a.length;
    if (!q.b) return napake.push(`${s}: vprašanje brez besedila`);
    if (!q.odg.length) return napake.push(`${s}: ni odgovorov`);
    if ([...vrste].every(x => x === '+' || x === '-')) {
      const vsi = q.odg.map(o => o.a), prav = q.odg.filter(o => o.v === '+').map(o => o.a);
      if (!prav.length) return napake.push(`${s}: ni pravilnega odgovora (označi ga s +)`);
      if (vsi.length < 2) return napake.push(`${s}: izbira potrebuje vsaj dva odgovora`);
      if (enaki(vsi)) return napake.push(`${s}: dva enaka odgovora`);
      const t = prav.length === 1 ? 'izbira' : 'vec';
      javno.push({ t, b: q.b, m: premesaj(vsi, seme + n) }); kljuc.push({ t, p: prav });
    } else if (vrste.size === 1 && vrste.has('=')) {
      javno.push({ t: 'kratek', b: q.b }); kljuc.push({ t: 'kratek', p: q.odg.map(o => o.a) });
    } else if (vrste.size === 1 && vrste.has('<>')) {
      const l = q.odg.map(o => o.a), d = q.odg.map(o => o.d);
      if (l.length < 2) return napake.push(`${s}: povezovanje potrebuje vsaj dva para`);
      if (enaki(l)) return napake.push(`${s}: leva stran se ponovi`);
      javno.push({ t: 'povezi', b: q.b, l, d: premesaj([...new Set(d)].sort(), seme + n) }); kljuc.push({ t: 'povezi', p: q.odg.map(o => [o.a, o.d]) });
    } else if (vrste.size === 1 && vrste.has('#')) {
      const ur = q.odg.slice().sort((a, b) => a.n - b.n).map(o => o.a);
      if (ur.length < 2) return napake.push(`${s}: razvrščanje potrebuje vsaj dva elementa`);
      if (enaki(ur)) return napake.push(`${s}: dva enaka elementa`);
      let m = ur;
      for (let k = 0; k < 10 && m.join('\u0000') === ur.join('\u0000'); k++) m = premesaj(ur, seme + n + 'x' + k);
      javno.push({ t: 'vrstni', b: q.b, m }); kljuc.push({ t: 'vrstni', p: ur });
    } else napake.push(`${s}: pri enem vprašanju so pomešane različne vrste odgovorov`);
  });
  return { predmet, naslov, opis, vprasanja: javno, kljuc, napake };
}

/* Predogled: vprašanja, kot jih vidi učenec, z že izpolnjenimi pravilnimi odgovori. */
function predogledKviza(el, k) {
  el.innerHTML = htmlVprasanj(k.vprasanja, true);
  k.kljuc.forEach((x, i) => {
    if (x.t === 'izbira' || x.t === 'vec') el.querySelectorAll(`input[name=q${i}]`).forEach(inp => { inp.checked = x.p.includes(inp.value); });
    else if (x.t === 'kratek') el.querySelector(`input[data-q="${i}"]`).value = x.p.join('  ·  ');
    else if (x.t === 'povezi') el.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { s.value = x.p[+s.dataset.l][1]; });
    else if (x.t === 'vrstni') { const ol = el.querySelector(`ol[data-q="${i}"]`); x.p.forEach(v => ol.appendChild([...ol.children].find(li => li.dataset.v === v))); }
  });
}

async function stranNovKviz(p, urejamId) {
  if (!ucitelj) { location.replace(`#/p/${p.id}`); odpriPredal('racun'); return; }
  const h = location.hash;
  let vir = '', izvorDatoteka = false;
  if (urejamId) {
    okvirPredmeta(p, 'kviz', '<p class="note">Nalagam kviz …</p>', null, 'Uredi kviz');
    const r = await rpc('sola_kviz_vir', { p_seja: ucitelj.seja, p_id: urejamId });
    if (!enakaStran(h)) return;
    const x = Array.isArray(r) && r[0];
    if (!x) { okvirPredmeta(p, 'kviz', `<div class="empty"><img src="brihta.png" alt=""><strong>Ups!</strong>Kviza ni mogoče odpreti. Se moraš morda znova prijaviti?</div>`, null, 'Uredi kviz'); return; }

    vir = x.vir || '';
  }
  const moznosti = VSI.map(o => `<option value="${o.id}"${o.id === p.id ? ' selected' : ''}>${o.emoji} ${esc(o.ime)}</option>`).join('');
  okvirPredmeta(p, 'urejevalnik', `
    <div class="vhead"><a class="btn" href="#/p/${p.id}" aria-label="Nazaj">${SVG.prev}</a>${tile('kviz', 'sm')}<h1>${urejamId ? 'Uredi kviz' : 'Nov kviz'}</h1></div>
    ${izvorDatoteka ? '<div class="help">Ta kviz je bil objavljen iz datoteke na računalniku, zato njegovega besedila tukaj ni. Prilepi ga znova.</div>' : ''}
    <div class="editor">
      <div class="ed-left">
        <div class="field"><label for="nk-predmet">Predmet</label><select id="nk-predmet" class="sel"${urejamId ? ' disabled' : ''}>${moznosti}</select></div>
        <div class="field"><label for="nk-vir">Besedilo kviza <small class="note">— prilepi, kar ti je dal asistent</small></label>
          <textarea id="nk-vir" spellcheck="false" placeholder="Naslov: …&#10;&#10;? Vprašanje&#10;- napačen odgovor&#10;+ pravilen odgovor">${esc(vir)}</textarea></div>
        <div id="nk-napake"></div>
        <div class="ed-actions">
          ${urejamId ? '' : '<button class="btn" type="button" id="nk-primer">Vstavi primer</button>'}
          <span class="msg" id="nk-msg"></span>
          <button class="btn btn-go btn-big" type="button" id="nk-objavi">Objavi 🚀</button>
        </div>
      </div>
      <div class="ed-right">
        <div class="sec-h"><h2>Predogled</h2><small class="note" id="nk-povzetek"></small></div>
        <div id="nk-predogled"></div>
      </div>
    </div>`, null, urejamId ? 'Uredi kviz' : 'Nov kviz');
  const $vir = document.getElementById('nk-vir'), $pred = document.getElementById('nk-predmet');
  let zadnji = null;
  function osvezi() {
    const k = razcleniKviz($vir.value, urejamId || $pred.value + '/');
    if (k.predmet && !urejamId) {
      const x = VSI.find(o => o.id === k.predmet.toLowerCase());
      if (x) $pred.value = x.id; else k.napake.unshift(`neznan predmet »${k.predmet}« (izberi ga zgoraj)`);
    }
    zadnji = { ...k, id: urejamId || `${$pred.value}/${slugKviza(k.naslov || '')}`, predmet: urejamId ? urejamId.split('/')[0] : $pred.value };
    const prazno = !$vir.value.trim();
    document.getElementById('nk-napake').innerHTML = k.napake.length && !prazno
      ? `<div class="help"><b>Popravi:</b><ul style="margin:6px 0 0;padding-left:20px">${k.napake.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : '';
    document.getElementById('nk-objavi').disabled = !!k.napake.length;
    document.getElementById('nk-povzetek').textContent = k.vprasanja.length ? `${k.naslov || 'brez naslova'} · ${k.vprasanja.length} vpr.` : '';
    const $p = document.getElementById('nk-predogled');
    $p.style.cssText = barve(najdi(zadnji.predmet) || p);
    if (k.vprasanja.length) predogledKviza($p, k);
    else $p.innerHTML = '<div class="empty">Tukaj se pokaže kviz, kot ga vidijo učenci, s pravilnimi odgovori.</div>';
  }
  $vir.addEventListener('input', osvezi);
  $pred.addEventListener('change', osvezi);
  const prim = document.getElementById('nk-primer');
  if (prim) prim.addEventListener('click', () => { $vir.value = PRIMER_KVIZA; osvezi(); $vir.focus(); });
  osvezi();
  if (!urejamId) $vir.focus();
  document.getElementById('nk-objavi').addEventListener('click', async () => {
    const k = zadnji, msg = document.getElementById('nk-msg');
    if (!k || k.napake.length) return;
    if (!urejamId && KVIZI.some(x => x.id === k.id) && !confirm(`Kviz »${k.naslov}« pri tem predmetu že obstaja. Ga zamenjam z novim besedilom?`)) return;
    const btn = document.getElementById('nk-objavi'); btn.disabled = true; btn.textContent = 'Objavljam …'; msg.textContent = '';
    const r = await rpc('sola_kviz_shrani', { p_seja: ucitelj.seja, p_vir: $vir.value,
      p_kviz: { id: k.id, predmet: k.predmet, naslov: k.naslov, opis: k.opis || '', vprasanja: k.vprasanja, kljuc: k.kljuc } });
    btn.disabled = false; btn.textContent = 'Objavi 🚀';
    if (r !== 'NOV' && r !== 'POSODOBLJEN') {
      msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : r === 'NAPACEN_KVIZ' ? 'Kviz ni pravilen.' : 'Objava ni uspela. Se moraš znova prijaviti?';
      return;
    }
    await naloziKvize();
    location.hash = `#/p/${k.predmet}/${encodeURIComponent('kviz:' + k.id)}`;
  });
}

/* ─── Račun: prijava, nov račun, učitelj ─── */
function izbiraZivali() {
  const el = document.createElement('div');
  let zap = [];
  el.innerHTML = `<div class="slots"></div><div class="animals">${ZIVALI.map((z, i) => `<button type="button" data-z="${i}" aria-label="${z}">${z}</button>`).join('')}</div>
    <div class="animals-row"><span class="kaj"></span><button type="button" class="linkbtn" data-pocisti>⌫ Počisti</button></div>`;
  const izris = () => {
    el.querySelector('.slots').innerHTML = [0, 1, 2, 3].map(i => `<span class="${zap[i] != null ? 'full' : ''}">${zap[i] != null ? ZIVALI[zap[i]] : ''}</span>`).join('');
    el.querySelector('.kaj').textContent = zap.length < 4 ? `Izberi še ${4 - zap.length}` : '✓ Geslo izbrano';
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-z]');
    if (b && zap.length < 4) { zap.push(+b.dataset.z); izris(); }
    if (e.target.closest('[data-pocisti]')) { zap = []; izris(); }
  });
  izris();
  return { el, geslo: () => zap.length === 4 ? zap.join(',') : null };
}

function posodobiNav() {
  document.getElementById('nav-avatar').textContent = ucitelj ? '👨‍🏫' : ucenec ? (ucenec.emoji || '🦉') : '👤';
  document.getElementById('nav-name').textContent = ucitelj ? ucitelj.username : ucenec ? ucenec.username : 'Prijava';
}

async function poPrijavi() {
  shraniRacun();
  posodobiNav();
  odpriPredal(null);
  await naloziMoje();
  usmeri();
}

function izrisiRacun(pogled) {
  const $t = document.getElementById('acct-title'), $b = document.getElementById('acct-body');
  if (ucitelj || ucenec) {
    $t.textContent = 'Moj račun';
    const oddanih = Object.keys(MOJE).length;
    $b.innerHTML = `<div class="who"><span class="big">${ucitelj ? '👨‍🏫' : esc(ucenec.emoji || '🦉')}</span>
        <div><strong>${esc(ucitelj ? ucitelj.username : (ucenec.display_name || ucenec.username))}</strong>
        <small>${ucitelj ? 'Učitelj' : 'Uporabniško ime: ' + esc(ucenec.username)}</small></div></div>
      ${ucenec ? `<p class="note">Rešenih kvizov: <b>${oddanih}</b></p>` : '<p class="note">Pri vsakem predmetu imaš gumb <b>＋ Nov kviz</b>. Ko odpreš kviz, vidiš rezultate učencev. Prijava velja 12 ur.</p>'}
      <button class="btn btn-block" type="button" id="a-odjava">Odjava</button>
      <p class="note" style="text-align:center">Isti račun velja tudi za Brihta-MAT.</p>`;
    document.getElementById('a-odjava').addEventListener('click', () => { if (ucitelj) rpc('sola_ucitelj_odjava', { p_seja: ucitelj.seja }); ucenec = null; ucitelj = null; MOJE = {}; poPrijavi(); });
    return;
  }
  if (pogled === 'nov') {
    $t.textContent = 'Nov račun';
    $b.innerHTML = `<div class="help">⚠️ Nov račun ustvari <b>samo, če ga še nimaš</b> (tudi pri Brihta-MAT).
        Če si geslo pozabil/-a, ti ga učitelj ponastavi.</div>
      <div class="field"><label for="n-ime">Tvoje ime</label><input id="n-ime" maxlength="20" autocomplete="off" placeholder="npr. Nina"></div>
      <div class="field"><label for="n-st">Tvoja najljubša številka</label><input id="n-st" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="npr. 7"></div>
      <div class="field"><label>Izberi svoj emoji</label><div class="emojis">${EMOJIJI.map((x, i) => `<button type="button" data-e="${x}" class="${i ? '' : 'on'}">${x}</button>`).join('')}</div></div>
      <div class="field"><label>Geslo — izberi 4 živali in si zapomni vrstni red</label><div id="n-zivali"></div></div>
      <button class="btn btn-go btn-block" type="button" id="n-ok">Ustvari račun</button>
      <div class="msg" id="n-msg"></div>
      <button class="linkbtn" type="button" data-pogled="prijava">← Že imam račun</button>`;
    const z = izbiraZivali(); document.getElementById('n-zivali').appendChild(z.el);
    let emoji = EMOJIJI[0];
    $b.querySelector('.emojis').addEventListener('click', e => {
      const b = e.target.closest('[data-e]'); if (!b) return;
      $b.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('on', x === b)); emoji = b.dataset.e;
    });
    document.getElementById('n-ok').addEventListener('click', async () => {
      const ime = document.getElementById('n-ime').value.trim().slice(0, 20);
      const st = document.getElementById('n-st').value.replace(/\D/g, '').slice(0, 3);
      const msg = document.getElementById('n-msg');
      if (!ime) return void (msg.textContent = 'Vpiši svoje ime.');
      if (!st) return void (msg.textContent = 'Vpiši svojo najljubšo številko.');
      if (!z.geslo()) return void (msg.textContent = 'Izberi vse 4 živali.');
      const btn = document.getElementById('n-ok'); btn.disabled = true; btn.textContent = 'Ustvarjam …';
      const r = await rpc('register_student', { p_name: ime, p_number: st, p_emoji: emoji, p_pin: z.geslo() });
      if (!Array.isArray(r) || !r.length) {
        btn.disabled = false; btn.textContent = 'Ustvari račun';
        msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Računa ni bilo mogoče ustvariti. Poskusi znova.';
        return;
      }
      ucenec = { id: r[0].id, username: r[0].username, emoji: r[0].emoji, display_name: r[0].display_name };
      ucitelj = null; shraniRacun(); posodobiNav();
      $t.textContent = 'Račun je ustvarjen 🎉';
      $b.innerHTML = `<p>Tvoje uporabniško ime je</p><div class="reg-user">${esc(ucenec.username)}</div>
        <div class="help">📌 Dobro si ga zapomni (in svoje 4 živali) — rabil/-a ga boš za prijavo.</div>
        <button class="btn btn-go btn-block" type="button" id="n-naprej">Naprej</button>`;
      document.getElementById('n-naprej').addEventListener('click', poPrijavi);
    });
  } else if (pogled === 'ucitelj') {
    $t.textContent = 'Prijava za učitelje';
    $b.innerHTML = `<form id="u-form">
      <div class="field"><label for="u-mail">E-naslov</label><input id="u-mail" type="email" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="u-pass">Geslo</label><input id="u-pass" type="password" autocomplete="current-password"></div>
      <button class="btn btn-go btn-block" type="submit" id="u-ok">Prijava</button>
      <div class="msg" id="u-msg"></div></form>
      <p class="note">Isti račun kot v Brihta-MAT. Novega učiteljskega računa ustvariš tam.</p>
      <button class="linkbtn" type="button" data-pogled="prijava">← Prijava za učence</button>`;
    document.getElementById('u-form').addEventListener('submit', async e => {
      e.preventDefault();
      const mail = document.getElementById('u-mail').value.trim().toLowerCase(), pass = document.getElementById('u-pass').value;
      const msg = document.getElementById('u-msg');
      if (!mail || !pass) return void (msg.textContent = 'Vpiši e-naslov in geslo.');
      const btn = document.getElementById('u-ok'); btn.disabled = true; btn.textContent = 'Preverjam …';
      const r = await rpc('sola_ucitelj_prijava', { p_email: mail, p_password: pass });
      btn.disabled = false; btn.textContent = 'Prijava';
      if (r === NEDOSEGLJIVO) return void (msg.textContent = 'Strežnik ni dosegljiv.');
      const x = Array.isArray(r) && r[0];
      if (!x || x.napaka === 'NAPACNO' || !x.seja) {
        return void (msg.textContent = x && x.napaka === 'NEPOTRJEN' ? 'Račun še ni potrjen.'
          : x && x.napaka === 'ZAMENJAJ_GESLO' ? 'Najprej se prijavi v Brihta-MAT in zamenjaj začetno geslo.'
          : 'Napačen e-naslov ali geslo.');
      }
      ucitelj = { seja: x.seja, username: x.username, potece: x.potece };
      ucenec = null; MOJE = {};
      poPrijavi();
    });
  } else {
    $t.textContent = 'Prijava';
    $b.innerHTML = `<p class="note" style="margin-top:0">Prijavi se z računom, ki ga imaš pri <b>Brihta-MAT</b>.</p>
      <div class="field"><label for="p-ime">Uporabniško ime</label><input id="p-ime" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="npr. nina7"></div>
      <div class="field"><label>Geslo — poklikaj svoje 4 živali</label><div id="p-zivali"></div></div>
      <button class="btn btn-go btn-block" type="button" id="p-ok">Prijava</button>
      <div class="msg" id="p-msg"></div><div id="p-pomoc"></div>
      <button class="linkbtn" type="button" data-pogled="nov">✨ Še nimam računa — ustvari novega</button>
      <button class="linkbtn" type="button" data-pogled="ucitelj">👨‍🏫 Prijava za učitelje</button>`;
    const z = izbiraZivali(); document.getElementById('p-zivali').appendChild(z.el);
    document.getElementById('p-ok').addEventListener('click', async () => {
      const ime = document.getElementById('p-ime').value.trim().toLowerCase();
      const msg = document.getElementById('p-msg');
      if (!ime) return void (msg.textContent = 'Vpiši uporabniško ime.');
      if (!z.geslo()) return void (msg.textContent = 'Izberi vse 4 živali.');
      const btn = document.getElementById('p-ok'); btn.disabled = true; btn.textContent = 'Preverjam …';
      const r = await rpc('login_student', { p_username: ime, p_pin: z.geslo() });
      btn.disabled = false; btn.textContent = 'Prijava';
      if (r === NEDOSEGLJIVO) return void (msg.textContent = 'Strežnik ni dosegljiv. Preveri povezavo.');
      if (!Array.isArray(r) || !r.length) {
        msg.textContent = 'Napačno uporabniško ime ali geslo.';
        document.getElementById('p-pomoc').innerHTML = '<div class="help">🙋 Si pozabil/-a geslo ali uporabniško ime? <b>Povej učitelju</b> — ponastavi ti ga. Ne delaj novega računa.</div>';
        return;
      }
      ucenec = { id: r[0].id, username: r[0].username, emoji: r[0].emoji, display_name: r[0].display_name };
      ucitelj = null;
      poPrijavi();
    });
  }
  $b.querySelectorAll('[data-pogled]').forEach(b => b.addEventListener('click', () => izrisiRacun(b.dataset.pogled)));
  const prvi = $b.querySelector('input'); if (prvi) setTimeout(() => prvi.focus(), 230);
}

/* ─── Okna: predmeti, račun ─── */
function napolniPredal() {
  document.getElementById('tray-list').innerHTML = PREDMETI.map(p => p.otroci
    ? `<li><a href="#/${p.id}" style="${barve(p)}"><span class="ic">${p.emoji}</span><span>${esc(p.ime)}<small>${p.otroci.length} razredi</small></span></a></li>` +
      p.otroci.map(o => `<li class="sub"><a href="#/p/${o.id}" style="${barve(o)}"><span class="ic">${o.emoji}</span><span>${o.emoji} ${esc(o.kratko)}</span></a></li>`).join('')
    : `<li><a href="#/p/${p.id}" style="${barve(p)}"><span class="ic">${p.emoji}</span><span>${esc(p.ime)}<small>${esc(p.koda)}</small></span></a></li>`).join('');
}
const PREDALI = {
  predmeti: [document.getElementById('tray'), document.getElementById('nav-courses')],
  racun: [document.getElementById('acct'), document.getElementById('nav-acct')],
};
let odprtPredal = null;
function odpriPredal(ime) {
  odprtPredal = ime;
  for (const [k, [predal, gumb]] of Object.entries(PREDALI)) {
    predal.classList.toggle('open', k === ime);
    gumb.classList.toggle('active', k === ime);
    gumb.setAttribute('aria-expanded', k === ime);
  }
  document.body.classList.toggle('tray-open', !!ime);
  if (ime === 'racun') izrisiRacun();
}
for (const [k, [, gumb]] of Object.entries(PREDALI)) gumb.addEventListener('click', () => odpriPredal(odprtPredal === k ? null : k));
document.querySelectorAll('[data-zapri]').forEach(b => b.addEventListener('click', () => odpriPredal(null)));
document.getElementById('tray-back').addEventListener('click', () => odpriPredal(null));
document.getElementById('tray-list').addEventListener('click', e => { if (e.target.closest('a')) odpriPredal(null); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') odpriPredal(null); });

/* ─── Usmerjanje ─── */
function usmeri() {
  const deli = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (deli[0] === 'p' && deli[1]) {
    const p = najdi(deli[1]);
    if (!p || p.otroci) return stranNadzorna();
    if (deli[2] === 'datoteke') return stranDatoteke(p);
    if (deli[2] === 'nov-kviz') return stranNovKviz(p);
    if (deli[2] === 'uredi' && deli[3]) return stranNovKviz(p, decodeURIComponent(deli.slice(3).join('/')));
    if (deli[2]) return stranGradivo(p, decodeURIComponent(deli[2]), deli[3]);
    return stranPredmet(p);
  }
  const p = deli[0] && najdi(deli[0]);
  if (p && p.otroci) return stranSkupina(p);
  if (p) { location.replace(`#/p/${p.id}`); return; }
  stranNadzorna();
}
window.addEventListener('hashchange', usmeri);

/* Ko se zavihek spet pokaže, preveri nova gradiva (ne med ogledom gradiva). */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  const stanje = () => JSON.stringify([GRADIVA, KVIZI, MOJE]);
  const prej = stanje();
  await Promise.all([naloziGradiva(), naloziKvize(), naloziMoje()]);
  const ogled = /^#\/p\/[^/]+\/(?!datoteke$)./.test(location.hash);
  if (!ogled && stanje() !== prej) usmeri();
});

napolniPredal();
posodobiNav();
const preveriUcitelja = async () => {
  if (!ucitelj) return;
  const r = await rpc('sola_ucitelj_preveri', { p_seja: ucitelj.seja });
  if (r === false || r === null) { ucitelj = null; shraniRacun(); posodobiNav(); }
};
Promise.all([naloziGradiva(), naloziKvize(), naloziMoje(), preveriUcitelja()]).then(usmeri);
</script>
