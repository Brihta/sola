function resujKviz(p, g, vpr, h) {
  const vaja = jeTP(p.id), prej = MOJE[g.id];
  okvirKviza(p, g, `${vaja ? `<p class="note" style="margin:-8px 0 14px">🔁 Vadba: rešuješ lahko, kolikokrat želiš.${prej ? ` Tvoj najboljši rezultat: <b>${prej.tocke}/${prej.vseh}</b>.` : ''}</p>` : ''}<div class="progress" aria-live="polite"><span id="k-st">0 / ${vpr.length}</span><span class="bar"><i id="k-bar"></i></span><span aria-hidden="true">🎯</span></div>
    <form id="kviz" novalidate>${htmlVprasanj(vpr)}
    <div class="quiz-foot"><span class="saved" id="k-shranjeno"></span><span class="msg" id="k-msg"></span>
      <button class="btn btn-go btn-big" type="submit" id="k-oddaj">Oddaj kviz 🚀</button></div></form>`);
  const f = document.getElementById('kviz');

    if (q.t === 'vrstni') return [...f.querySelector(`ol[data-q="${i}"]`).children].map(li => li.dataset.v);

    : q.t === 'vrstni' ? !!premaknjeno[i] : a != null;

  function osvezi(shraniOsnutek) {
    const a = zberi();
    const n = vpr.filter((q, i) => odgovorjeno(q, a[i], i)).length;
    document.getElementById('k-st').textContent = `${n} / ${vpr.length}`;
    document.getElementById('k-bar').style.width = (n / vpr.length * 100) + '%';
    if (shraniOsnutek) {
      shrani(osnutekKljuc(g.id), JSON.stringify({ a, premaknjeno }));
      document.getElementById('k-shranjeno').textContent = '💾 Odgovori so shranjeni na tej napravi.';
    }
  }

  // Obnovi osnutek (npr. po nenamernem osveževanju strani).
  try {
    const o = JSON.parse(preberi(osnutekKljuc(g.id)) || 'null');
    if (o && Array.isArray(o.a)) {
      vpr.forEach((q, i) => {
        const a = o.a[i];
        if (a == null) return;
        if (q.t === 'izbira' || q.t === 'vec') f.querySelectorAll(`input[name=q${i}]`).forEach(x => { x.checked = [].concat(a).includes(x.value); });
        else if (q.t === 'kratek') f.querySelector(`input[data-q="${i}"]`).value = a;
        else if (q.t === 'povezi') f.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { const v = a[q.l[+s.dataset.l]]; if (v && q.d.includes(v)) s.value = v; });
        else if (q.t === 'vrstni' && Array.isArray(a) && a.length === q.m.length && a.every(v => q.m.includes(v))) {
          const ol = f.querySelector(`ol[data-q="${i}"]`);
          a.forEach(v => ol.appendChild([...ol.children].find(li => li.dataset.v === v)));
        }

    }
  } catch (e) {}

  f.addEventListener('change', () => osvezi(true));
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-gor],[data-dol]');
    if (!b) return;
    const li = b.closest('li'), ol = li.parentElement;

    if (b.hasAttribute('data-dol') && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);

    const vprasaj = manjka
      ? `Na ${manjka} ${manjka === 1 ? 'vprašanje' : manjka === 2 ? 'vprašanji' : manjka < 5 ? 'vprašanja' : 'vprašanj'} nisi odgovoril/-a. Vseeno oddam?`
      : vaja ? '' : 'Oddam kviz? Potem odgovorov ne moreš več spreminjati.';

    if (vaja) {

      if (!Array.isArray(v) || !v.length) {
        btn.disabled = false; btn.textContent = 'Oddaj kviz 🚀';
        msg.textContent = v === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Odgovori so shranjeni — poskusi znova.' : 'Oddaja ni uspela. Povej učitelju.';
        return;
      }
      MOJE[g.id] = { kviz_id: g.id, tocke: v[0].najboljse, vseh: v[0].vseh, oddano: new Date().toISOString() };
      try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
      if (enakaStran(h)) { window.scrollTo(0, 0); izidVaje(p, g, v[0], vpr); }
      return;
    }
    const r = await rpc('sola_kviz_oddaj', { p_student: ucenec.id, p_kviz: g.id, p_odgovori: a });
    if (!Array.isArray(r) || !r.length) {
      btn.disabled = false; btn.textContent = 'Oddaj kviz 🚀';
      msg.textContent = r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv. Odgovori so shranjeni — poskusi znova.' : 'Oddaja ni uspela. Povej učitelju.';
      return;
    }
    const o = { kviz_id: g.id, tocke: r[0].tocke, vseh: r[0].vseh, oddano: new Date().toISOString() };
    if (r[0].ponovi) {  // manj kot 50 %: oddaja se ne shrani, učenec reši znova
      try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
      if (enakaStran(h)) { window.scrollTo(0, 0); poskusiZnova(p, g, o); }
      return;
    }
    if (!r[0].novo) { const m = await rpc('sola_kviz_moje', { p_student: ucenec.id }); const x = Array.isArray(m) && m.find(y => y.kviz_id === g.id); if (x) Object.assign(o, x); }
    MOJE[g.id] = o;
    try { localStorage.removeItem(osnutekKljuc(g.id)); } catch (e2) {}
    if (enakaStran(h)) { window.scrollTo(0, 0); izidKviza(p, g, o, r[0].novo); }
  });
}

  $main.querySelectorAll('[data-brez-slike]').forEach(b => b.addEventListener('click', async () => {
    const i = +b.dataset.brezSlike;

    if (typeof pot !== 'string') { b.disabled = false; sporocilo(i, 'Odstranjevanje ni uspelo. Se moraš znova prijaviti?'); return; }
    await izbrisiIzShrambe(pot);

  }));
  $main.querySelectorAll('[data-ponastavi]').forEach(b => b.addEventListener('click', async () => {

    b.disabled = true;
    await rpc('sola_kviz_ponastavi', { p_seja: ucitelj.seja, p_kviz: g.id, p_student: b.dataset.ponastavi });

  }));
}

/* ─── Nov kviz (učitelj) ───
   Enaka pravila kot scripts/kvizi.py. Brskalnik besedilo razčleni in pošlje
   javni del (premešan, brez odgovorov) in ključ; ocenjuje strežnik. */
const PRIMER_KVIZA = `Naslov: Naprave računalnika
Opis: Reši sam. Imaš en poskus.

? Katera naprava je vhodna?
- zaslon
+ tipkovnica
- zvočnik

? Kateri od teh so vhodne naprave?
+ miška
+ mikrofon
- tiskalnik

? Kako se imenuje naprava, s katero premikamo kazalec?
= miška
= računalniška miška

? Poveži napravo z njeno nalogo.
tipkovnica = pisanje
zaslon = prikaz slike
zvočnik = predvajanje zvoka

? Razvrsti od najmanjšega do največjega.
1. bit
2. bajt
3. kilobajt`;

function slugKviza(t) {
  return t.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'kviz';
}
function premesaj(seznam, seme) {
  let h = 1779033703;
  for (const c of seme) h = Math.imul(h ^ c.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  const rnd = () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
  const a = seznam.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Vrne { predmet, naslov, opis, vprasanja: [{t, b, ...}], kljuc: [...], napake: ['vrstica 3: …'] } */
function razcleniKviz(besedilo, seme) {
  const napake = [], vpr = [];
  let predmet = null, naslov = null, opis = null, q = null;
  besedilo.replace(/\r/g, '').split('\n').forEach((surovo, i) => {
    const st = i + 1, v = surovo.trim();
    if (!v || v.startsWith('#')) return;
    if (!q && !vpr.length) {
      const m = v.match(/^(predmet|naslov|opis)\s*:\s*(.*)$/i);
      if (m) { const k = m[1].toLowerCase(); if (k === 'predmet') predmet = m[2].trim(); else if (k === 'naslov') naslov = m[2].trim(); else opis = m[2].trim(); return; }
    }
    if (v.startsWith('?')) { q = { st, b: v.slice(1).trim(), odg: [] }; vpr.push(q); return; }
    if (!q) { napake.push(`vrstica ${st}: pred prvim vprašanjem (vprašanje se začne z »?«)`); return; }
    let m;
    if ((m = v.match(/^([+\-=])\s*(.+)$/))) return void q.odg.push({ st, v: m[1], a: m[2].trim() });
    if ((m = v.match(/^(\d+)[.)]\s*(.+)$/))) return void q.odg.push({ st, v: '#', n: +m[1], a: m[2].trim() });
    if ((m = v.match(/^(.+?)\s+=\s+(.+)$/))) return void q.odg.push({ st, v: '<>', a: m[1].trim(), d: m[2].trim() });
    if (q.odg.length) napake.push(`vrstica ${st}: ne razumem »${v}« (odgovor se začne s +, -, =, številko ali ima obliko »levo = desno«)`);
    else q.b += '\n' + v;
  });
  if (!naslov) napake.unshift('manjka vrstica »Naslov: …«');
  if (!vpr.length) napake.push('ni nobenega vprašanja (vprašanje se začne z »?«)');
  const javno = [], kljuc = [];
  vpr.forEach((q, n) => {
    const s = `vprašanje ${n + 1} (vrstica ${q.st})`, vrste = new Set(q.odg.map(o => o.v));
    const enaki = a => new Set(a).size !== a.length;
    if (!q.b) return napake.push(`${s}: vprašanje brez besedila`);
    if (!q.odg.length) return napake.push(`${s}: ni odgovorov`);
    if ([...vrste].every(x => x === '+' || x === '-')) {
      const vsi = q.odg.map(o => o.a), prav = q.odg.filter(o => o.v === '+').map(o => o.a);
      if (!prav.length) return napake.push(`${s}: ni pravilnega odgovora (označi ga s +)`);
      if (vsi.length < 2) return napake.push(`${s}: izbira potrebuje vsaj dva odgovora`);
      if (enaki(vsi)) return napake.push(`${s}: dva enaka odgovora`);
      const t = prav.length === 1 ? 'izbira' : 'vec';
      javno.push({ t, b: q.b, m: premesaj(vsi, seme + n) }); kljuc.push({ t, p: prav });
    } else if (vrste.size === 1 && vrste.has('=')) {
      javno.push({ t: 'kratek', b: q.b }); kljuc.push({ t: 'kratek', p: q.odg.map(o => o.a) });
    } else if (vrste.size === 1 && vrste.has('<>')) {
      const l = q.odg.map(o => o.a), d = q.odg.map(o => o.d);
      if (l.length < 2) return napake.push(`${s}: povezovanje potrebuje vsaj dva para`);
      if (enaki(l)) return napake.push(`${s}: leva stran se ponovi`);
      javno.push({ t: 'povezi', b: q.b, l, d: premesaj([...new Set(d)].sort(), seme + n) }); kljuc.push({ t: 'povezi', p: q.odg.map(o => [o.a, o.d]) });
    } else if (vrste.size === 1 && vrste.has('#')) {
      const ur = q.odg.slice().sort((a, b) => a.n - b.n).map(o => o.a);
      if (ur.length < 2) return napake.push(`${s}: razvrščanje potrebuje vsaj dva elementa`);
      if (enaki(ur)) return napake.push(`${s}: dva enaka elementa`);
      let m = ur;
      for (let k = 0; k < 10 && m.join('\u0000') === ur.join('\u0000'); k++) m = premesaj(ur, seme + n + 'x' + k);
      javno.push({ t: 'vrstni', b: q.b, m }); kljuc.push({ t: 'vrstni', p: ur });
    } else napake.push(`${s}: pri enem vprašanju so pomešane različne vrste odgovorov`);
  });
  return { predmet, naslov, opis, vprasanja: javno, kljuc, napake };
}

/* Predogled: vprašanja, kot jih vidi učenec, z že izpolnjenimi pravilnimi odgovori. */
function predogledKviza(el, k) {
  el.innerHTML = htmlVprasanj(k.vprasanja, true);
  k.kljuc.forEach((x, i) => {
    if (x.t === 'izbira' || x.t === 'vec') el.querySelectorAll(`input[name=q${i}]`).forEach(inp => { inp.checked = x.p.includes(inp.value); });
    else if (x.t === 'kratek') el.querySelector(`input[data-q="${i}"]`).value = x.p.join('  ·  ');
    else if (x.t === 'povezi') el.querySelectorAll(`select[data-q="${i}"]`).forEach(s => { s.value = x.p[+s.dataset.l][1]; });
    else if (x.t === 'vrstni') { const ol = el.querySelector(`ol[data-q="${i}"]`); x.p.forEach(v => ol.appendChild([...ol.children].find(li => li.dataset.v === v))); }
  });
}

async function stranNovKviz(p, urejamId) {

    <div class="editor">
      <div class="ed-left">
        <div class="field"><label for="nk-predmet">Predmet</label><select id="nk-predmet" class="sel"${urejamId ? ' disabled' : ''}>${moznosti}</select></div>

          <textarea id="nk-vir" spellcheck="false" placeholder="Naslov: …&#10;&#10;? Vprašanje&#10;- napačen odgovor&#10;+ pravilen odgovor">${esc(vir)}</textarea></div>
        <div id="nk-napake"></div>
        <div class="ed-actions">
          ${urejamId ? '' : '<button class="btn" type="button" id="nk-primer">Vstavi primer</button>'}
          <span class="msg" id="nk-msg"></span>
          <button class="btn btn-go btn-big" type="button" id="nk-objavi">Objavi 🚀</button>
        </div>
      </div>
      <div class="ed-right">
        <div class="sec-h"><h2>Predogled</h2><small class="note" id="nk-povzetek"></small></div>
        <div id="nk-predogled"></div>

    }
    zadnji = { ...k, id: urejamId || `${$pred.value}/${slugKviza(k.naslov || '')}`, predmet: urejamId ? urejamId.split('/')[0] : $pred.value };

/* ─── Kviz iz Excela (oblika: orodja/kviz-predloga/README.md) ────────────────
   Brez knjižnic: .xlsx je zip z XML-ji, razširi ga brskalnik (DecompressionStream).
   Bere se samo list »Kviz«: C1 naslov, C2 opis, od vrstice 6: B vrsta, C vprašanje, D–I odgovori. */
async function razsiriZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('ni zip');
  const datoteke = {};
  for (let k = 0, n = dv.getUint16(e + 10, true), o = dv.getUint32(e + 16, true); k < n; k++) {
    if (dv.getUint32(o, true) !== 0x02014b50) throw new Error('pokvarjen zip');
    const ln = dv.getUint16(o + 28, true);
    datoteke[dec.decode(u8.subarray(o + 46, o + 46 + ln))] = { metoda: dv.getUint16(o + 10, true), vel: dv.getUint32(o + 20, true), lo: dv.getUint32(o + 42, true) };
    o += 46 + ln + dv.getUint16(o + 30, true) + dv.getUint16(o + 32, true);
  }
  return async ime => {
    const d = datoteke[ime];
    if (!d) return null;
    const zac = d.lo + 30 + dv.getUint16(d.lo + 26, true) + dv.getUint16(d.lo + 28, true), surovo = u8.subarray(zac, zac + d.vel);
    if (d.metoda === 0) return dec.decode(surovo);
    return new Response(new Blob([surovo]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
}
/* Vrne { 'C1': 'Naslov', 'B6': 'Izbira', 'D10': 4, … } ali { brezLista: true }. */
async function beriExcel(buf) {
  const beri = await razsiriZip(buf);
  const xml = async ime => { const t = await beri(ime); return t == null ? null : new DOMParser().parseFromString(t, 'application/xml'); };
  const vsi = (d, tag) => d ? [...d.getElementsByTagNameNS('*', tag)] : [];
  const wb = await xml('xl/workbook.xml');
  if (!wb) throw new Error('ni Excel');
  const list = vsi(wb, 'sheet').find(s => (s.getAttribute('name') || '').trim().toLowerCase() === 'kviz');
  if (!list) return { brezLista: true };
  const rid = list.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || list.getAttribute('r:id');
  const rel = vsi(await xml('xl/_rels/workbook.xml.rels'), 'Relationship').find(r => r.getAttribute('Id') === rid);
  if (!rel) throw new Error('ni lista');
  const cilj = rel.getAttribute('Target');
  const pot = cilj.startsWith('/') ? cilj.slice(1) : 'xl/' + cilj.replace(/^\.\//, '');
  const nizi = vsi(await xml('xl/sharedStrings.xml'), 'si').map(si => vsi(si, 't').map(t => t.textContent).join(''));
  const celice = {};
  vsi(await xml(pot), 'c').forEach(c => {
    const r = c.getAttribute('r'), t = c.getAttribute('t'), v = vsi(c, 'v')[0];
    if (!r || !/^[A-I]\d+$/.test(r)) return;   // J in K sta formuli za pomoč
    let x = null;
    if (t === 's') x = v ? nizi[+v.textContent] : null;
    else if (t === 'inlineStr') x = vsi(c, 't').map(e => e.textContent).join('');
    else if (t === 'str' || t === 'e') x = v ? v.textContent : null;
    else if (t === 'b') x = v && v.textContent === '1' ? 'TRUE' : 'FALSE';
    else if (v) x = +v.textContent;
    if (x != null && x !== '') celice[r] = x;
  });
  return celice;
}
const brezStresic = s => String(s ?? '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const stevilka = n => String(+(+n).toPrecision(12)).replace('.', ',');
const celica = x => x == null ? '' : typeof x === 'number' ? stevilka(x) : String(x).replace(/\s+/g, ' ').trim();
const VRSTE_XL = { izbira: 'izbira', vecpravilnih: 'vec', drzinedrzi: 'drzi', povezi: 'povezi', razvrsti: 'razvrsti', stevilo: 'stevilo' };
/* Iz celic naredi kviz v isti obliki kot razcleniKviz (javni del, ključ) in še besedilo (vir). */
function kvizIzExcela(cel, seme) {
  const napake = [], javno = [], kljuc = [], vir = [];
  const naslov = celica(cel.C1).slice(0, 200), opis = celica(cel.C2).slice(0, 500);
  if (!naslov) napake.push('Manjka naslov kviza (list Kviz, celica C1).');
  const zadnja = Math.max(0, ...Object.keys(cel).map(k => +k.replace(/^[A-Z]+/, '')));
  const enaki = a => new Set(a.map(x => x.toLowerCase())).size !== a.length;
  for (let r = 6; r <= zadnja; r++) {
    const vrsta = celica(cel['B' + r]), b = celica(cel['C' + r]);
    const surovi = ['D', 'E', 'F', 'G', 'H', 'I'].map(s => cel[s + r]), odg = surovi.map(celica), polni = odg.filter(Boolean);
    if (!vrsta && !b && !polni.length) continue;
    const nap = t => napake.push(`Vprašanje ${r - 5}: ${t}`);
    const v = VRSTE_XL[brezStresic(vrsta).replace(/[^a-z]/g, '')];
    if (!vrsta) { nap('izberi vrsto vprašanja (stolpec Vrsta).'); continue; }
    if (!v) { nap(`neznana vrsta »${vrsta}«. Izberi jo s spustnega seznama.`); continue; }
    if (!b) { nap('manjka besedilo vprašanja.'); continue; }
    const n = javno.length;
    if (v === 'izbira') {
      const prav = odg[0], napacni = odg.slice(1, 5).filter(Boolean);
      if (!prav) { nap('manjka pravilni odgovor (Odgovor 1).'); continue; }
      if (!napacni.length) { nap('dodaj vsaj en napačen odgovor (Odgovor 2 do 5).'); continue; }
      if (odg[5]) { nap('pri izbiri so največ 4 napačni odgovori (Odgovor 6 pusti prazen).'); continue; }
      if (enaki([prav, ...napacni])) { nap('dva odgovora sta enaka.'); continue; }
      javno.push({ t: 'izbira', b, m: premesaj([prav, ...napacni], seme + n) }); kljuc.push({ t: 'izbira', p: [prav] });
      vir.push(`? ${b}`, `+ ${prav}`, ...napacni.map(x => `- ${x}`), '');
    } else if (v === 'vec') {
      const vsi = polni.map(x => x.replace(/^\*\s*/, '').trim()), prav = vsi.filter((x, i) => polni[i].startsWith('*'));
      if (vsi.some(x => !x)) { nap('zvezdica brez odgovora.'); continue; }
      if (!prav.length) { nap('označi pravilne odgovore z zvezdico spredaj, npr. *krava.'); continue; }
      if (prav.length === vsi.length) { nap('dodaj vsaj en napačen odgovor (brez zvezdice).'); continue; }
      if (enaki(vsi)) { nap('dva odgovora sta enaka.'); continue; }
      javno.push({ t: 'vec', b, m: premesaj(vsi, seme + n) }); kljuc.push({ t: 'vec', p: prav });
      vir.push(`? ${b}`, ...vsi.map(x => (prav.includes(x) ? '+ ' : '- ') + x), '');
    } else if (v === 'drzi') {
      const x = brezStresic(odg[0]).replace(/[^a-z]/g, '');
      if (x !== 'drzi' && x !== 'nedrzi') { nap('v Odgovor 1 napiši Drži ali Ne drži.'); continue; }
      const prav = x === 'drzi' ? 'Drži' : 'Ne drži';
      javno.push({ t: 'izbira', b, m: ['Drži', 'Ne drži'] }); kljuc.push({ t: 'izbira', p: [prav] });
      vir.push(`? ${b}`, ...['Drži', 'Ne drži'].map(o => (o === prav ? '+ ' : '- ') + o), '');
    } else if (v === 'povezi') {
      const pari = polni.map(x => {
        const i = x.indexOf(' = ') >= 0 ? x.indexOf(' = ') : x.indexOf('='), d = x.indexOf(' = ') >= 0 ? 3 : 1;
        return i < 0 ? null : [x.slice(0, i).trim(), x.slice(i + d).trim()];
      });
      const slab = polni.find((x, i) => !pari[i] || !pari[i][0] || !pari[i][1]);
      if (slab) { nap(`»${slab}« ni par v obliki pojem = razlaga.`); continue; }
      if (pari.length < 2) { nap('povezovanje potrebuje vsaj 2 para.'); continue; }
      if (enaki(pari.map(x => x[0]))) { nap('leva stran (pojem) se ponovi.'); continue; }
      javno.push({ t: 'povezi', b, l: pari.map(x => x[0]), d: premesaj([...new Set(pari.map(x => x[1]))].sort(), seme + n) });
      kljuc.push({ t: 'povezi', p: pari });
      vir.push(`? ${b}`, ...pari.map(x => `${x[0]} = ${x[1]}`), '');
    } else if (v === 'razvrsti') {
      if (polni.length < 2) { nap('razvrščanje potrebuje vsaj 2 odgovora.'); continue; }
      if (enaki(polni)) { nap('dva odgovora sta enaka.'); continue; }
      let m = polni;
      for (let k = 0; k < 10 && m.join('\u0000') === polni.join('\u0000'); k++) m = premesaj(polni, seme + n + 'x' + k);
      javno.push({ t: 'vrstni', b, m }); kljuc.push({ t: 'vrstni', p: polni });
      vir.push(`? ${b}`, ...polni.map((x, i) => `${i + 1}. ${x}`), '');
    } else {
      const s = odg[0].replace(/\s/g, '');
      const num = typeof surovi[0] === 'number' ? surovi[0] : /^-?\d+([.,]\d+)?$/.test(s) ? +s.replace(',', '.') : NaN;
      if (!isFinite(num)) { nap('Odgovor 1 mora biti število.'); continue; }
      const z = stevilka(num);
      javno.push({ t: 'kratek', b, n: 1 }); kljuc.push({ t: 'kratek', p: [...new Set([z, z.replace(',', '.')])] });
      vir.push(`? ${b}`, `= ${z}`, '');
    }
  }
  if (!javno.length && !napake.length) napake.push('Na listu Kviz ni nobenega vprašanja (vprašanja so od vrstice 6 naprej).');
  if (javno.length > 100) napake.push('Kviz ima lahko največ 100 vprašanj.');
  return { naslov, opis, vprasanja: javno, kljuc, napake, vir: `Naslov: ${naslov}\n${opis ? `Opis: ${opis}\n` : ''}\n${vir.join('\n')}` };
}

    if (r !== true) { alert('Brisanje ni uspelo. Se moraš znova prijaviti?'); return; }
    await Promise.all([naloziTP(), naloziKvize(), naloziObjave()]);
    location.hash = '#/';
  });
}

      btn.disabled = false; btn.textContent = 'Ponastavi geslo ✓';
      msg.textContent = res === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : res === 'NI_UCENCA' ? 'Tega računa ni več.'
        : res === 'SLABO_GESLO' ? 'Izberi 4 živali.' : 'Ni uspelo. Prijavi se znova.';
    });
  });
  izris();
  $isci.focus();
}

function izbiraZivali() {
  const el = document.createElement('div');
  let zap = [];
  el.innerHTML = `<div class="slots"></div><div class="animals">${ZIVALI.map((z, i) => `<button type="button" data-z="${i}" aria-label="${z}">${z}</button>`).join('')}</div>
    <div class="animals-row"><span class="kaj"></span><button type="button" class="linkbtn" data-pocisti>⌫ Počisti</button></div>`;
  const izris = () => {
    el.querySelector('.slots').innerHTML = [0, 1, 2, 3].map(i => `<span class="${zap[i] != null ? 'full' : ''}">${zap[i] != null ? ZIVALI[zap[i]] : ''}</span>`).join('');
    el.querySelector('.kaj').textContent = zap.length < 4 ? `Izberi še ${4 - zap.length}` : '✓ Geslo izbrano';
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-z]');
    if (b && zap.length < 4) { zap.push(+b.dataset.z); izris(); }
    if (e.target.closest('[data-pocisti]')) { zap = []; izris(); }
  });
  izris();
  return { el, geslo: () => zap.length === 4 ? zap.join(',') : null };
}

    : `<li class="sub"${globina > 1 ? ` style="padding-left:${(globina - 1) * 22}px"` : ''}><a href="${hrefPredmeta(p)}" style="${barve(p)}"><span class="ic">${p.emoji}</span><span>${p.emoji} ${esc(p.kratko || p.ime)}</span></a></li>`;
  const drevo = (p, globina) => vrstica(p, globina) + (p.otroci ? vidniOtroci(p).map(o => drevo(o, globina + 1)).join('') : '');

}

/* ─── Usmerjanje ─── */
/* ─── Igra v živo (supabase_igra_v_zivo.sql) ───────────────────────────────
   Učitelj: velik zaslon (#/igra/<id>) z vprašanjem, časom in lestvico; vodi igro z »Naprej«.
   Učenec: vabilo na Brihti (pasica spodaj), nato odgovarja na svoji napravi.
   Obe strani vsako sekundo ali dve vprašata strežnik za stanje (brez Realtime). */
const BARVE_IGRE = ['#e74c3c', '#2f80ed', '#f2a516', '#1fa36b', '#9b51e0', '#e0408a'];
const CRKE = 'ABCDEF';
let igraGen = 0, igraUra = null;
/* Glasba za igro v živo: izvirni kratki napevi, zgenerirani v brskalniku (Web Audio), brez datotek
   in tujih strežnikov. Igra samo na velikem zaslonu (učitelj); vklop/izklop si stran zapomni. */
const GLASBA = (() => {
  let ac = null, glavna = null, ura = null, vzorec = null, korak = 0, naslednji = 0;
  const KLJUC_TIHO = 'sola_igra_tiho';
  let tiho = preberi(KLJUC_TIHO) === '1';
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const zagotovi = () => {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC(); glavna = ac.createGain(); glavna.gain.value = tiho ? 0 : 0.22; glavna.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  };
  const ton = (t, m, dol, oblika, jak) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = oblika; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(jak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dol);
    o.connect(g).connect(glavna); o.start(t); o.stop(t + dol + 0.05);
  };
  let sum = null;
  const cinela = (t, jak, fr = 7000, dol = 0.06) => {
    if (!sum) { sum = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate); const d = sum.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = sum; f.type = 'highpass'; f.frequency.value = fr;
    g.gain.setValueAtTime(jak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dol);
    s.connect(f).connect(g).connect(glavna); s.start(t); s.stop(t + 0.1);
  };
  const boben = (t, jak) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(jak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g).connect(glavna); o.start(t); o.stop(t + 0.25);
  };
  /* Teme z vzorci: [bpm, dolžina v šestnajstinkah, funkcija(korak, čas, šestnajstinka)] */
  const VESELA = {
    cakanje: [112, 64, (i, t, s) => {          // vesel C–Am–F–G
      const akordi = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], a = akordi[Math.floor(i / 16)], k = i % 16;
      if (k === 0 || k === 8) { ton(t, a[0] - 24, s * 6, 'triangle', 0.5); boben(t, 0.35); }
      if (k === 6 || k === 14) ton(t, a[0] - 12, s * 2, 'triangle', 0.3);
      if (k % 2 === 0) ton(t, a[(k / 2) % 3] + 12 + (k >= 8 ? 12 : 0) * ((k / 2) % 2), s * 1.6, 'square', 0.06);
      if (k % 4 === 2) cinela(t, 0.12);
      if (i % 32 === 12) ton(t, 79, s * 3, 'sine', 0.12);
    }],
    vprasanje: [132, 32, (i, t, s) => {        // napet Am–F z ostinatom
      const kor = i < 16 ? 45 : 41, k = i % 16;
      ton(t, kor + (k % 2 ? 12 : 0), s * 0.9, 'triangle', 0.4);
      if (k % 4 === 0) boben(t, 0.5);
      cinela(t, k % 2 ? 0.05 : 0.1);
      if (k === 0 || k === 6 || k === 12) [0, 3, 7].forEach(d => ton(t, kor + 24 + d + (i < 16 ? 0 : 1), s * 1.2, 'sawtooth', 0.025));
    }],
  };
  const RETRO = {                              // 8-bitna igralna (C–G–Am–F)
    cakanje: [140, 64, (i, t, s) => {
      const b = Math.floor(i / 16), k = i % 16, kor = [48, 43, 45, 41][b];
      const mel = [[72, 76, 79, 76, 84, 79, 76, 79], [71, 74, 79, 74, 83, 79, 74, 79], [72, 76, 81, 76, 84, 81, 76, 81], [72, 77, 81, 77, 84, 81, 77, 81]][b];
      if (k % 2 === 0) { ton(t, mel[k / 2], s * 1.7, 'square', 0.06); ton(t, kor + (k % 4 ? 12 : 0), s * 1.6, 'square', 0.07); }
      if (k % 4 === 2) cinela(t, 0.1);
      if (k === 0 || k === 8) boben(t, 0.3);
    }],
    vprasanje: [150, 32, (i, t, s) => {
      const k = i % 16, a = i < 16 ? [69, 72, 76] : [68, 71, 76];
      ton(t, (i < 16 ? 45 : 40) + (k % 2 ? 12 : 0), s * 0.9, 'square', 0.06);
      ton(t, a[k % 3] + 12, s * 0.8, 'square', 0.035);
      if (k % 4 === 0) boben(t, 0.4);
      if (k % 2) cinela(t, 0.07);
    }],
  };
  const VESOLJE = {                            // sanjave plošče in zvezdice
    cakanje: [90, 64, (i, t, s) => {
      const b = Math.floor(i / 16), k = i % 16, akordi = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 59]];
      if (k === 0) { akordi[b].forEach(m => ton(t, m + 12, s * 15, 'sine', 0.09)); ton(t, akordi[b][0] - 12, s * 15, 'triangle', 0.25); boben(t, 0.2); }
      const zvezde = [84, 88, 91, 93, 96, 91, 88, 86];
      if ([3, 7, 10, 13].includes(k)) ton(t, zvezde[(i * 3 + k) % 8], s * 6, 'sine', 0.07);
    }],
    vprasanje: [120, 32, (i, t, s) => {
      const k = i % 16, osn = i < 16 ? 38 : 36, pent = [74, 77, 79, 81, 84];
      if (k % 2 === 0) ton(t, osn, s * 1.8, 'sawtooth', 0.05);
      ton(t, osn + 12, s * 0.5, 'sine', 0.12);
      if (k % 3 === 0) ton(t, pent[(i * 2) % 5] + (i < 16 ? 0 : -2), s * 3, 'sine', 0.08);
      if (k % 4 === 0) boben(t, 0.35);
      if (k % 2) cinela(t, 0.05);
    }],
  };
  const MIRNA = {                              // lo-fi klavir (Dm7–G7–Cmaj7–A7)
    cakanje: [80, 64, (i, t, s) => {
      const b = Math.floor(i / 16), k = i % 16, akordi = [[50, 57, 60, 65], [43, 53, 59, 62], [48, 55, 59, 64], [45, 55, 61, 64]];
      if (k === 0 || k === 6) akordi[b].forEach((m, j) => { ton(t + j * 0.012, m + 12, s * 9, 'triangle', 0.07); ton(t + j * 0.012, m + 24, s * 4, 'sine', 0.025); });
      if (k === 0) ton(t, akordi[b][0] - 12, s * 8, 'sine', 0.3);
      if (k === 0 || k === 10) boben(t, 0.25);
      if (k === 4 || k === 12) cinela(t, 0.06);
      if (k === 11 || k === 14) ton(t, [74, 72, 71, 69][b] + 12, s * 3, 'sine', 0.05);
    }],
    vprasanje: [100, 32, (i, t, s) => {
      const k = i % 16, lest = i < 16 ? [62, 65, 69, 72, 69, 65] : [60, 64, 67, 71, 67, 64];
      ton(t, lest[k % 6] + 12, s * 1.5, 'sine', 0.09);
      if (k % 4 === 0) ton(t, (i < 16 ? 38 : 36), s * 3.5, 'triangle', 0.3);
      if (k % 8 === 0) boben(t, 0.25);

  /* Temo se izbere posebej za čakalnico in za vprašanja (privzeto Retro in Mirna). */
  const PRIVZETO = { cakanje: 'retro', vprasanje: 'mirna' }, tema = {};
  Object.keys(PRIVZETO).forEach(d => { const x = preberi('sola_igra_tema_' + d); tema[d] = TEME[x] ? x : PRIVZETO[d]; });

  const tic = () => {
    if (!vzorec) return;
    const [bpm, dol, fn] = TEME[tema[vzorec]][1][vzorec], s = 60 / bpm / 4;

    razkrij: t => [72, 76, 79, 84].forEach((m, j) => ton(t + j * 0.07, m, 0.5, 'triangle', 0.35)),

    konec: t => {

    },

    ustavi() { clearTimeout(poslusam); poslusam = null; this.igraj(null); },
    preklopi() {

/* Odštevanje: strežnik pove, koliko ms je še ostalo; zaslon odšteva sam do naslednjega odgovora. */
function odstevalnik(el, cas) {

  return {
    nastavi(ms) { konecOb = performance.now() + ms; },
    ostalo() { return Math.max(0, konecOb - performance.now()); },

  };
}

    }));
    $ig.querySelector('#ig-samodejno').addEventListener('change', e => { samodejno = e.target.checked; shrani(KLJUC_SAMODEJNO, samodejno ? '1' : '0'); });
    $ig.querySelector('#ig-cel').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
    $ig.querySelector('#ig-konec').addEventListener('click', async () => {
      if (s.stanje !== 'konec') {
        if (!confirm('Končam igro? Učenci bodo videli končne rezultate.')) return;
        await rpc('sola_igra_koncaj', { p_seja: ucitelj.seja, p_igra: id });
      }
      if (document.fullscreenElement) document.exitFullscreen();
      history.length > 1 ? history.back() : (location.hash = '#/');
    });
  };
  /* Po prikazu lestvice si zapomni mesta in točke za primerjavo pri naslednjem vprašanju. */
  const zapomniLestvico = () => { prejMesta = {}; prejTocke = {}; (s.igralci || []).forEach(x => { prejMesta[x.id] = x.mesto; prejTocke[x.id] = x.tocke; }); };
  const osvezi = async () => {
    const r = await rpc('sola_igra_stanje_ucitelj', { p_seja: ucitelj.seja, p_igra: id });
    if (gen !== igraGen) return;
    if (!r || r === NEDOSEGLJIVO) {
      if (!s) $ig.innerHTML = `<div class="empty"><img src="brihta.png" alt=""><strong>Ups!</strong>${r === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Te igre ni (ali ni tvoja).'}</div>`;
      return;
    }
    if (!s) slike = await slikeIgre(r.kviz_id);
    const prej = s;
    s = r;
    if (prej && prej.stanje !== 'rezultat' && s.stanje === 'rezultat') pogled = 'odgovor';
    if (!prej && s.stanje !== 'cakanje') zapomniLestvico();   // odprto sredi igre
    const k = kljuc();
    if (k !== kljucIzrisa) { kljucIzrisa = k; izrisi(); }
    else { const o = $ig.querySelector('#ig-odg'); if (o) o.textContent = s.odgovorov; }
    if (s.stanje === 'vprasanje') {
      ura.nastavi(s.preostalo_ms);
      if (s.preostalo_ms <= 0 || (samodejno && s.igralci.length && s.odgovorov >= s.igralci.length)) naprej();
    }
    if (s.stanje === 'konec') { clearInterval(igraUra); igraUra = null; }
  };
  await osvezi();
  if (gen !== igraGen) return;
  igraUra = setInterval(() => { if (gen === igraGen) { osvezi(); } }, 1000);
  (function tik() {
    if (gen !== igraGen) { casovniki.forEach(clearTimeout); clearTimeout(avtoUra); return; }
    if (s && s.stanje === 'vprasanje' && ura) {
      ura.risi();
      const sek = Math.ceil(ura.ostalo() / 1000);   // zadnjih 5 sekund: tik-tak
      if (sek !== zadnjaSek) { zadnjaSek = sek; if (sek >= 1 && sek <= 5) GLASBA.zvok('tik', sek === 1); }
    }
    requestAnimationFrame(tik);
  })();
}

/* ── Učenčeva naprava ── */
/* Mini igra v čakalnici: sovica skače čez knjige in svinčnike (tap ali preslednica).
   Teče, dokler je platno na strani; najboljši rezultat si zapomni naprava. */
function sovicaTece($platno) {
  const ozko = $platno.clientWidth < 500, W = ozko ? 400 : 600, H = 200, TLA = 172, KLJUC = 'sola_sovica_rekord';
  $platno.style.aspectRatio = `${W} / ${H}`;
  const c = $platno.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  $platno.width = W * dpr; $platno.height = H * dpr; c.scale(dpr, dpr);
  let rekord = +preberi(KLJUC) || 0;
  let stanje = 'zacetek', y = 0, vy = 0, hitrost, pot, ovire, oblaki, prej = 0, noga = 0, cakaj = 0;
  const nova = () => {
    hitrost = 300; pot = 0; y = 0; vy = 0; ovire = [{ x: W + 40, ...ovira() }];
    oblaki = [0, 1, 2].map(i => ({ x: 80 + i * 220, y: 30 + (i % 2) * 30 }));
  };
  const ovira = () => {
    const v = Math.random();
    if (v < 0.45) { const n = 1 + Math.floor(Math.random() * 3); return { vrsta: 'knjige', s: 34, v: n * 13, n, barve: [0, 1, 2].map(() => Math.floor(Math.random() * 5)) }; }
    if (v < 0.8) return { vrsta: 'svincnik', s: 14, v: 38 + Math.floor(Math.random() * 16) };
    return { vrsta: 'svincnik2', s: 34, v: 40 };
  };
  const skoci = () => {
    if (stanje === 'konec') { if (performance.now() < cakaj) return; nova(); stanje = 'tece'; return; }
    if (stanje === 'zacetek') { nova(); stanje = 'tece'; }
    if (y === 0) vy = 690;
  };
  const tipka = e => {
    if (!$platno.isConnected) { document.removeEventListener('keydown', tipka); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); skoci(); }
  };
  document.addEventListener('keydown', tipka);
  $platno.addEventListener('pointerdown', e => { e.preventDefault(); skoci(); });

  const KNJIGE = ['#e17055', '#00b894', '#0984e3', '#fdcb6e', '#a29bfe'];
  const zaobljen = (x, yy, w, h, r) => { c.beginPath(); c.roundRect ? c.roundRect(x, yy, w, h, r) : c.rect(x, yy, w, h); c.fill(); };
  const risiSovo = (x, dno, tla) => {
    const t = dno - 46;
    c.fillStyle = '#f39c12';                                   // nogi
    if (tla) { c.fillRect(x + 10 + (noga ? 4 : 0), dno - 6, 6, 6); c.fillRect(x + 24 - (noga ? 4 : 0), dno - 6, 6, 6); }
    else { c.fillRect(x + 12, dno - 6, 6, 5); c.fillRect(x + 22, dno - 6, 6, 5); }
    c.fillStyle = '#d63031';                                   // telo in ušesa
    c.beginPath(); c.ellipse(x + 20, t + 24, 19, 21, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(x + 4, t + 10); c.lineTo(x + 6, t - 4); c.lineTo(x + 14, t + 6); c.fill();
    c.beginPath(); c.moveTo(x + 36, t + 10); c.lineTo(x + 34, t - 4); c.lineTo(x + 26, t + 6); c.fill();
    c.fillStyle = '#ffb3a7';                                   // trebušček
    c.beginPath(); c.ellipse(x + 20, t + 31, 11, 11, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#b71c1c';                                   // krilo
    c.beginPath(); c.ellipse(x + 6, t + 26 + (tla ? 0 : -4), 5, 11, tla ? 0.2 : -0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff';                                      // oči
    c.beginPath(); c.arc(x + 13, t + 15, 7, 0, Math.PI * 2); c.arc(x + 28, t + 15, 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2d3436';
    const zm = stanje === 'konec';
    if (zm) { c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText('×', x + 13, t + 19); c.fillText('×', x + 28, t + 19); }
    else { c.beginPath(); c.arc(x + 15, t + 15, 3.2, 0, Math.PI * 2); c.arc(x + 30, t + 15, 3.2, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#f39c12';                                   // kljun
    c.beginPath(); c.moveTo(x + 18, t + 20); c.lineTo(x + 23, t + 20); c.lineTo(x + 20.5, t + 26); c.fill();
  };
  const risiOviro = o => {
    const dno = TLA;
    if (o.vrsta === 'knjige') {
      for (let i = 0; i < o.n; i++) {
        c.fillStyle = KNJIGE[o.barve[i]]; zaobljen(o.x + (i % 2 ? 3 : 0), dno - (i + 1) * 13, o.s - 3, 12, 2);
        c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(o.x + (i % 2 ? 3 : 0) + o.s - 9, dno - (i + 1) * 13 + 2, 3, 8);
      }
    } else {
      const svincnik = (x, v) => {
        c.fillStyle = '#fdcb6e'; c.fillRect(x, dno - v + 8, 14, v - 14);
        c.fillStyle = '#e84393'; zaobljen(x, dno - 6, 14, 6, 2);           // radirka spodaj
        c.fillStyle = '#b2bec3'; c.fillRect(x, dno - 9, 14, 3);
        c.fillStyle = '#ffeaa7'; c.beginPath(); c.moveTo(x, dno - v + 8); c.lineTo(x + 14, dno - v + 8); c.lineTo(x + 7, dno - v); c.fill();
        c.fillStyle = '#2d3436'; c.beginPath(); c.moveTo(x + 4.5, dno - v + 3); c.lineTo(x + 9.5, dno - v + 3); c.lineTo(x + 7, dno - v); c.fill();
      };
      if (o.vrsta === 'svincnik') svincnik(o.x, o.v); else { svincnik(o.x, o.v); svincnik(o.x + 20, o.v - 10); }
    }
  };
  const besedilo = (t, yy, vel) => { c.font = `800 ${vel}px Nunito, sans-serif`; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText(t, W / 2, yy); };
  nova();
  const zanka = cas => {
    if (!$platno.isConnected) { document.removeEventListener('keydown', tipka); return; }
    const dt = Math.min(0.05, prej ? (cas - prej) / 1000 : 0); prej = cas;
    if (stanje === 'tece') {
      hitrost = Math.min(720, hitrost + dt * 9);
      pot += hitrost * dt;
      if (y > 0 || vy > 0) { y += vy * dt; vy -= 2100 * dt; if (y <= 0) { y = 0; vy = 0; } }
      ovire.forEach(o => { o.x -= hitrost * dt; });
      oblaki.forEach(o => { o.x -= hitrost * dt * 0.2; if (o.x < -60) o.x = W + Math.random() * 80; });
      while (ovire.length > 1 && ovire[0].x < -60) ovire.shift();
      /* Naslednja ovira je vedno že v vrsti (desno zunaj zaslona), da seznam nikoli ni prazen. */
      for (let z = ovire[ovire.length - 1]; z.x < W + 40; z = ovire[ovire.length - 1])
        ovire.push({ x: Math.max(z.x, 0) + hitrost * 0.75 + 70 + Math.random() * Math.min(260, W * 0.5), ...ovira() });
      if (Math.floor(cas / 110) % 2 !== noga) noga = 1 - noga;
      const sx = 64, sd = TLA - y;                                   // trk (z nekaj prizanesljivosti)
      if (ovire.some(o => o.x < sx + 32 && o.x + o.s > sx + 8 && sd > TLA - o.v + 6)) {
        stanje = 'konec'; cakaj = performance.now() + 600;
        const tocke = Math.floor(pot / 10);
        if (tocke > rekord) { rekord = tocke; shrani(KLJUC, String(rekord)); }
      }
    }
    c.clearRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,.18)';
    oblaki.forEach(o => { c.beginPath(); c.arc(o.x, o.y, 14, 0, Math.PI * 2); c.arc(o.x + 16, o.y - 6, 17, 0, Math.PI * 2); c.arc(o.x + 34, o.y, 13, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(0, TLA, W, 2);
    c.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 14; i++) { const x = ((i * 53 - pot * 1) % W + W) % W; c.fillRect(x, TLA + 8 + (i % 3) * 6, 10 + (i % 4) * 4, 2); }
    ovire.forEach(risiOviro);
    risiSovo(64, TLA - y, y === 0 && stanje === 'tece');
    c.font = '800 16px Nunito, sans-serif'; c.textAlign = 'right'; c.fillStyle = '#fff';
    c.fillText(`${Math.floor(pot / 10)}   🏆 ${rekord}`, W - 12, 24);
    if (stanje === 'zacetek') besedilo(ozko ? 'Tapni za skok!' : 'Tapni (ali preslednica) za skok!', 90, 22);
    if (stanje === 'konec') { besedilo('Ups! 🙈', 76, 30); besedilo('Tapni za nov poskus', 108, 18); }
    requestAnimationFrame(zanka);
  };
  requestAnimationFrame(zanka);
}

async function igraUcenec(id) {
  const gen = ++igraGen;
  document.body.classList.add('igra-full');
  $main.innerHTML = '<div class="ig ig-ucenec"><p class="ig-nal">Pridružujem se igri …</p></div>';
  const $ig = $main.querySelector('.ig');
  let s = null, kljucIzrisa = '', slike = null, oddano = false, ura, razkrito = false;
  const pridruzen = await rpc('sola_igra_pridruzi', { p_student: ucenec.id, p_igra: id });
  if (gen !== igraGen) return;
  if (pridruzen !== true) {
    $ig.innerHTML = `<div class="empty"><img src="brihta.png" alt=""><strong>Te igre ni več</strong>${pridruzen === NEDOSEGLJIVO ? 'Strežnik ni dosegljiv.' : 'Igra je končana ali ni za tvoj razred.'}
      <p style="margin:16px 0 0"><a class="btn" href="#/">Nazaj na Brihto</a></p></div>`;
    return;
  }
  const jaz = `<span class="ig-jaz">${esc(ucenec.emoji || '🦉')} ${esc(ucenec.display_name || ucenec.username)}</span>`;
  const poslji = async odgovor => {
    if (oddano) return;
    oddano = true;
    $ig.querySelectorAll('button, input, select').forEach(x => { x.disabled = true; });
    const ok = await rpc('sola_igra_odgovori', { p_student: ucenec.id, p_igra: id, p_vprasanje: s.vprasanje, p_odgovor: odgovor });
    if (gen !== igraGen) return;
    if (ok !== true) { $ig.querySelector('.ig-msg').textContent = 'Odgovor ni bil sprejet (čas je potekel?).'; }
    kljucIzrisa = ''; osvezi();
  };
  const izrisi = () => {
    const q = s.q ? { ...s.q, slika: (slike || {})[s.q.b] } : null;
    const vrh = `<div class="ig-glava">${jaz}${s.vprasanje >= 0 && s.stanje !== 'konec' ? `<span class="ig-st">${s.vprasanje + 1} / ${s.vseh}</span>` : ''}<span class="ig-tocke">⭐ ${s.tocke}</span></div>`;
    let telo = '';
    if (s.stanje === 'cakanje') {
      telo = `<div class="ig-sredisce"><div class="ig-velik">🎉</div><h1>Si v igri!</h1><p>${esc(s.naslov)}</p>
        <p class="ig-siv">Počakaj, da učitelj začne. Igralcev: <b data-igralcev>${s.igralcev}</b></p>
        <div class="ig-sovica"><canvas aria-label="Mini igra: sovica skače čez ovire"></canvas><small>Medtem ko čakaš: pomagaj sovici preskočiti knjige in svinčnike.</small></div></div>`;
    } else if (s.stanje === 'vprasanje' && s.odgovoril) {
      telo = `<div class="ig-sredisce"><div class="ig-velik">✅</div><h1>Odgovor oddan</h1><p class="ig-siv">Poglej na tablo in počakaj na rezultat.</p></div>`;
    } else if (s.stanje === 'vprasanje') {
      oddano = false;
      let vnos;
      if (q.t === 'izbira') vnos = htmlPloscic(q);
      else if (q.t === 'vec') vnos = htmlPloscic(q, []) + '<button class="btn btn-go btn-big ig-oddaj" type="button" id="ig-oddaj">Oddaj ✓</button>';
      else vnos = `<form id="ig-f" class="ig-obr" novalidate>${htmlVprasanj([q]).replace(/<p class="q-text">[\s\S]*?<\/p>/, '').replace(/<img class="q-img"[^>]*>/, '')}
        <button class="btn btn-go btn-big ig-oddaj" type="submit">Oddaj ✓</button></form>`;
      telo = `<div class="ig-casbar"><i data-casbar></i></div><div class="ig-vpr-u">
        <h1 class="ig-b">${esc(q.b)}</h1>${q.slika ? `<img class="ig-slika" src="${esc(q.slika)}" alt="">` : ''}
        ${q.t === 'vec' ? '<p class="ig-siv">Označi VSE pravilne, nato Oddaj.</p>' : ''}${vnos}<p class="msg ig-msg"></p></div>`;
    } else if (s.stanje === 'rezultat') {
      telo = s.odgovoril || s.dobil ? `<div class="ig-sredisce ${s.pravilno ? 'ig-dobro' : 'ig-slabo'}"><div class="ig-velik">${s.pravilno ? '🎯' : '😬'}</div>
        <h1>${s.pravilno ? 'Pravilno!' : 'Napačno'}</h1>${s.pravilno ? `<p class="ig-plus">+${s.dobil}</p>` : '<p>Naslednjič bo bolje!</p>'}
        <p class="ig-siv">Imaš ${s.tocke} točk · ${mesto(s.mesto)}</p></div>`
        : `<div class="ig-sredisce ig-slabo"><div class="ig-velik">⏰</div><h1>Čas je potekel</h1><p class="ig-siv">Imaš ${s.tocke} točk · ${mesto(s.mesto)}</p></div>`;
    } else if (!razkrito) {
      /* Počakaj, da tabla razkrije stopničke, da naprava ne izda zmagovalca. */
      telo = `<div class="ig-sredisce"><div class="ig-velik">🥁</div><h1>Konec igre!</h1><p class="ig-siv">Poglej na tablo …</p></div>`;
      setTimeout(() => { if (gen === igraGen) { razkrito = true; izrisi(); } }, 7200);
    } else {
      telo = `<div class="ig-sredisce"><div class="ig-velik">${s.mesto === 1 ? '🥇' : s.mesto === 2 ? '🥈' : s.mesto === 3 ? '🥉' : '🏁'}</div>
        <h1>Konec igre!</h1><p class="ig-plus">${mesto(s.mesto)}</p><p class="ig-siv">${s.tocke} točk · igralcev: ${s.igralcev}</p>
        <p style="margin-top:20px"><a class="btn" href="#/">Nazaj na Brihto</a></p></div>`;
    }
    $ig.innerHTML = vrh + telo;
    const $pl = $ig.querySelector('.ig-sovica canvas'); if ($pl) sovicaTece($pl);
    if (s.stanje === 'konec' && razkrito && s.mesto && s.mesto <= 3) konfeti($ig);
    ura = odstevalnik($ig, s.cas);
    if (s.stanje !== 'vprasanje' || s.odgovoril) return;
    if (q.t === 'izbira') $ig.querySelectorAll('.ig-plo').forEach(b => b.addEventListener('click', () => { b.classList.add('on'); poslji(b.dataset.v); }));
    else if (q.t === 'vec') {
      $ig.querySelectorAll('.ig-plo').forEach(b => b.addEventListener('click', () => b.classList.toggle('on')));
      $ig.querySelector('#ig-oddaj').addEventListener('click', () => {
        const a = [...$ig.querySelectorAll('.ig-plo.on')].map(b => b.dataset.v);
        if (!a.length) { $ig.querySelector('.ig-msg').textContent = 'Označi vsaj en odgovor.'; return; }
        poslji(a);
      });
    } else {
      const f = $ig.querySelector('#ig-f');
      f.querySelectorAll('ol.order').forEach(posodobiPuscice);
      f.addEventListener('click', e => {
        const b = e.target.closest('[data-gor],[data-dol]');
        if (!b) return;
        const li = b.closest('li'), ol = li.parentElement;
        if (b.hasAttribute('data-gor') && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);
        if (b.hasAttribute('data-dol') && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);
        posodobiPuscice(ol);
      });
      f.addEventListener('submit', e => {
        e.preventDefault();
        let a;
        if (q.t === 'kratek') { a = f.querySelector('input[data-q="0"]').value.trim(); if (!a) { $ig.querySelector('.ig-msg').textContent = 'Vpiši odgovor.'; return; } }
        else if (q.t === 'povezi') { a = {}; f.querySelectorAll('select[data-q="0"]').forEach(x => { if (x.value) a[q.l[+x.dataset.l]] = x.value; }); }
        else a = [...f.querySelector('ol[data-q="0"]').children].map(li => li.dataset.v);
        poslji(a);
      });
      f.querySelector('input.short')?.focus();
    }
  };
  const osvezi = async () => {
    const r = await rpc('sola_igra_stanje_ucenec', { p_student: ucenec.id, p_igra: id });
    if (gen !== igraGen || !r || r === NEDOSEGLJIVO) return;
    if (slike === null && r.kviz_id) slike = await slikeIgre(r.kviz_id);
    s = r;
    const k = [s.stanje, s.vprasanje, s.odgovoril].join('|');
    const $st = $ig.querySelector('[data-igralcev]'); if ($st) $st.textContent = s.igralcev;
    if (k !== kljucIzrisa) { kljucIzrisa = k; izrisi(); }
    if (s.stanje === 'vprasanje' && ura) ura.nastavi(s.preostalo_ms);
    if (s.stanje === 'konec') { clearInterval(igraUra); igraUra = null; }
  };
  await osvezi();
  if (gen !== igraGen) return;
  igraUra = setInterval(() => { if (gen === igraGen) osvezi(); }, 1500);
  (function tik() { if (gen !== igraGen) return; if (s && s.stanje === 'vprasanje' && ura) ura.risi(); requestAnimationFrame(tik); })();
}

/* Pasica »Igra v živo« za prijavljenega učenca (preverja vsakih 8 s, ko je zavihek odprt). */
let pasicaIgre = null;
async function preveriIgro() {
  if (!ucenec || ucitelj || document.hidden || location.hash.startsWith('#/igra/')) { pasicaIgre?.remove(); pasicaIgre = null; return; }
  const r = await rpc('sola_igra_zame', { p_student: ucenec.id });
  const g = Array.isArray(r) && r[0];
  if (!g || location.hash.startsWith('#/igra/')) { pasicaIgre?.remove(); pasicaIgre = null; return; }
  if (!pasicaIgre) { pasicaIgre = document.createElement('a'); pasicaIgre.className = 'ig-pasica'; document.body.appendChild(pasicaIgre); }
  pasicaIgre.href = `#/igra/${g.id}`;
  pasicaIgre.innerHTML = `<span class="ig-pas-e">🎮</span><span><b>Igra v živo:</b> ${esc(g.naslov)}</span><span class="btn btn-go">${g.pridruzen ? 'Nazaj v igro' : 'Pridruži se!'} ▶</span>`;
}
setInterval(preveriIgro, 8000);
window.addEventListener('hashchange', preveriIgro);

function usmeri() {
  const deli = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  ustaviIgro();
  if (deli[0] === 'igra' && deli[1]) return stranIgra(deli[1]);
  if (deli[0] === 'p' && deli[1]) {
    const p = najdi(deli[1]);
    if (!p || p.otroci || !vidi(p)) return stranNadzorna();
    if (deli[2] === 'datoteke') return stranDatoteke(p);
    if (deli[2] === 'nov-kviz') return stranNovKviz(p);
    if (deli[2] === 'nalozi') return stranNalozi(p);
    if (deli[2] === 'excel' && p.tp) return stranExcel(p);
    if (deli[2] === 'predmet' && p.tp) return stranPredmetTP(p);
    if (deli[2] === 'uredi' && deli[3]) return stranNovKviz(p, decodeURIComponent(deli.slice(3).join('/')));
    if (deli[2]) return stranGradivo(p, decodeURIComponent(deli[2]), deli[3]);
    return stranPredmet(p);
  }
  if (deli[0] === 'racuni') return stranRacuni();
  if (deli[0] === 'nov-predmet') return stranPredmetTP(null);
  const p = deli[0] && najdi(deli[0]);
  if (p && p.otroci) return stranSkupina(p);
  if (p) { location.replace(`#/p/${p.id}`); return; }
  stranNadzorna();
}
window.addEventListener('hashchange', usmeri);

/* Ko se zavihek spet pokaže, preveri nova gradiva (ne med ogledom gradiva). */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  const stanje = () => JSON.stringify([GRADIVA, KVIZI, MOJE, STANJE, DODANA, RAZPORED, NASLOVI, TP]);
  const prej = stanje();
  await Promise.all([naloziGradiva(), naloziKvize(), naloziMoje(), naloziObjave(), naloziTP()]);
  const ogled = /^#\/p\/[^/]+\/(?!datoteke$)./.test(location.hash);
  if (!ogled && stanje() !== prej) usmeri();
});

napolniPredal();
posodobiNav();
const preveriUcitelja = async () => {
  if (!ucitelj) return;
  const r = await rpc('sola_ucitelj_preveri', { p_seja: ucitelj.seja });
  if (r === false || r === null) { ucitelj = null; shraniRacun(); posodobiNav(); }
};
Promise.all([naloziGradiva(), naloziKvize(), naloziMoje(), naloziObjave(), naloziTP(), preveriUcitelja()]).then(usmeri).then(preveriIgro);
if (new URLSearchParams(location.search).has('prijava')) odpriPredal('racun');
</script>
