name: Posodobi seznam gradiv

on:
  push:
    branches: [main]
    paths: ["gradiva/**", "scripts/gradiva.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradiva
  cancel-in-progress: false

jobs:
  gradiva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zgradi gradiva.json
        run: python3 scripts/gradiva.py
      - name: Shrani, če se je kaj spremenilo
        run: |
          if git diff --quiet -- gradiva.json && ! git ls-files --others --exclude-standard | grep -q '^gradiva.json$'; then
            echo "Ni sprememb."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gradiva.json
          git commit -m "Posodobljen seznam gradiv"
          git pull --rebase origin main
          git push
