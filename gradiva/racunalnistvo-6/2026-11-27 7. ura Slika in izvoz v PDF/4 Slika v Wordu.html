<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slika v Wordu</title><style>:root{--ink:#1d2b3a;--mut:#5b6b7c;--blue:#2E5C8A;--sky:#EAF1F8;--sky2:#D6E4F0;--sun:#FFF4D6;--sunb:#C08A00;--ok:#1f8a4c;--okbg:#e5f6ec;--bad:#c0392b;--badbg:#fdecea;--cs:46px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:18px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:12px 18px 18px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--sky2);padding-bottom:8px}
header h1{font-size:22px;margin:0;color:var(--blue);flex:1}
.dots{display:flex;gap:6px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;background:#dfe6ee}.dot.ok{background:var(--ok)}.dot.now{outline:3px solid var(--blue);outline-offset:1px}.cnt{font-size:14px;color:var(--mut);margin-left:6px}
main{flex:1;padding:14px 4px}
h2{margin:0 0 8px;font-size:26px}.intro{font-size:20px;margin:0 0 12px}.small{color:var(--mut);font-size:15px;margin:4px 0 10px}
.stars{display:inline-block;background:var(--sun);color:#7a5600;border:2px solid var(--sunb);border-radius:20px;padding:2px 12px;font-weight:700;font-size:14px;margin-bottom:8px}
.body p{margin:0 0 12px}.body .box{background:var(--sky);border-radius:14px;padding:14px 18px;margin:10px 0}.body .warn{background:var(--sun);border-left:6px solid var(--sunb);border-radius:8px;padding:10px 14px}
.big{font-size:22px}
footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:3px solid var(--sky2);padding:10px 0 6px;position:sticky;bottom:0;background:#fff;z-index:5}.sp{flex:1}
.btn{font:inherit;font-size:17px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){background:var(--sky)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;font-size:19px;padding:10px 22px}.btn.go:hover:not(:disabled){background:#176d3c}
.btn.go2{background:var(--blue);color:#fff}.btn.ghost{border-color:#b9c6d3;color:var(--mut)}.btn.hint{border-color:var(--sunb);color:#7a5600;background:var(--sun)}
.pulse{animation:pulse 1.2s ease-in-out 3}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(31,138,76,.2)}}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--sky);font-size:18px}.fb.ok{background:var(--okbg);color:#145c33;border:2px solid var(--ok)}.fb.bad{background:var(--badbg);color:#8e2a20;border:2px solid var(--bad)}.fb.hint{background:var(--sun);border:2px solid var(--sunb)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:flex;flex-direction:column;gap:10px;max-width:720px}
.opt{font:inherit;text-align:left;padding:12px 16px;border:2px solid #b9c6d3;border-radius:12px;background:#fff;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--blue);background:var(--sky)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.sel{border-color:var(--blue);background:var(--sky2)}.opt:disabled{cursor:default}
.olist{background:var(--okbg);border-radius:12px;padding:10px 10px 10px 40px;min-height:44px;margin:0 0 12px}.olist li{padding:3px 0}
.pool{display:flex;flex-wrap:wrap;gap:10px}.chip{font:inherit;padding:10px 14px;border:2px solid var(--blue);border-radius:12px;background:#fff;cursor:pointer}.chip:hover{background:var(--sky)}
.wob{animation:sh .35s;border-color:var(--bad)!important}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;max-width:820px}.match .col{display:flex;flex-direction:column;gap:10px}
.gridtask{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.g{display:grid;gap:0;border:3px solid var(--blue);width:max-content}
.cell{width:var(--cs);height:var(--cs);border:1px solid #b9c6d3;position:relative;background:#fff}
.cell.t{background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--sky2) 6px,var(--sky2) 12px)}
.cell.p{background:var(--blue)}.cell.wrong{background:var(--bad)}.cell.miss{animation:miss .8s ease-in-out infinite alternate}@keyframes miss{to{background:#ffb347}}
.cell[data-s]::before{content:attr(data-s);position:absolute;top:1px;left:4px;font-size:12px;font-weight:700;color:var(--blue)}
.cell.bot::after{content:"🤖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.side{flex:1;min-width:300px;display:flex;flex-direction:column;gap:10px}
.legend{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px}.legend span{display:inline-block;width:18px;height:18px;border:1px solid #b9c6d3}.legend .lt{background:repeating-linear-gradient(45deg,#fff,#fff 3px,var(--sky2) 3px,var(--sky2) 6px)}.legend .lp{background:var(--blue)}
.prog{min-height:54px;border:2px dashed #b9c6d3;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fafcfe}
.tk{background:var(--blue);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;font-size:20px}.tk.loop{background:var(--sun);color:#7a5600;border:2px solid var(--sunb);font-size:16px}.ph{color:var(--mut);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px}.tool{font-size:24px;min-width:54px;padding:6px 10px}.tool.loop{font-size:16px;background:var(--sun);border-color:var(--sunb);color:#7a5600}
.tiphelp{width:100%;font-size:14px;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.count{font-size:15px;color:var(--mut)}
.trace{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.fl{flex:0 0 470px}.flow{width:470px;height:auto}.tside{flex:1;min-width:240px}
.flow text{font-size:15px;font-family:system-ui,Arial,sans-serif;pointer-events:none}.flow .lab{font-weight:700;fill:#555}
.so{fill:var(--sky2);stroke:var(--blue);stroke-width:2.5}.sr{fill:var(--sky);stroke:var(--blue);stroke-width:2.5}.sd{fill:var(--sun);stroke:var(--sunb);stroke-width:2.5}
.node{cursor:pointer}.node:hover>*:first-child{stroke-width:4}.node.was>*:first-child{fill:#cfe9d8}.node.cur>*:first-child{fill:#7fd6a0;stroke:var(--ok);stroke-width:4}.node.no>*:first-child{fill:#f5b7b1}
.qa p{font-size:19px}.ans{min-width:80px}
.guess input{font:inherit;font-size:24px;width:130px;padding:6px 10px;border:2px solid var(--blue);border-radius:10px}.hist{font-size:19px;max-height:220px;overflow:auto}
.deck{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.card{width:64px;height:88px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.card.up{background:#fff;color:var(--ink);border:3px solid var(--blue)}.card.kept{border-color:var(--ok);background:var(--okbg)}.card.gone{opacity:.35}
.memo{font-size:19px;margin-bottom:10px}.mem{display:inline-block;min-width:44px;text-align:center;background:var(--sun);border:2px solid var(--sunb);border-radius:8px;padding:0 8px;font-weight:800}
.ctrl p{margin:0 0 8px}.ctrl .btn{margin:0 6px 6px 0}
.chk{display:flex;gap:10px;align-items:center;font-size:20px;background:var(--sky);padding:12px 16px;border-radius:12px;cursor:pointer;margin-top:12px;width:max-content}.chk input{width:26px;height:26px}
.end{text-align:center;padding:20px}.end .big{font-size:64px}.end .arrow{font-size:21px;background:var(--okbg);display:inline-block;padding:10px 18px;border-radius:12px}
.sym{display:inline-flex;align-items:center;justify-content:center;width:120px;height:44px;border:3px solid var(--blue);font-weight:700;font-size:15px;margin-right:8px;vertical-align:middle}
.sym.o{border-radius:24px;background:var(--sky2)}.sym.r{background:var(--sky)}.sym.d{background:var(--sun);border-color:var(--sunb);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:none}
.zapis{background:#fffef6;border:2px solid #e8dfb8;border-radius:14px;padding:16px 22px;font-size:19px}.zapis h3{margin:0 0 8px;color:var(--blue)}.zapis b{color:var(--blue)}
@media (max-width:720px){:root{--cs:38px}.fl{flex-basis:100%}.flow{width:100%}.match{grid-template-columns:1fr}}

.kb{display:inline-block;background:#f3f6f9;border-radius:14px;padding:10px;margin-top:8px;user-select:none}.kbr{display:flex;gap:5px;margin:5px 0}.kbr.r1{padding-left:18px}.kbr.r2{padding-left:40px}
.kk{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;border:2px solid rgba(0,0,0,.12);position:relative}.kk.space{width:300px;margin-left:150px;font-weight:500;font-size:14px}

.f-lm,.f-dm{background:#f9d5e5}.f-lp,.f-dp{background:#d5e8f9}.f-ls,.f-ds{background:#d9f2d9}.f-lk,.f-dk{background:#fff0c2}.f-pa{background:#e8e0f5}

.keys .target{display:flex;align-items:center;gap:18px}.tkey{display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;font-size:56px;font-weight:800;border:4px solid var(--blue);border-radius:16px;background:#fff}.tkey.miss{animation:sh .35s;border-color:var(--bad)}.tfing{font-size:22px;color:var(--mut)}.kstat{font-size:19px;margin:10px 0 4px}
.typ .ttext{font:24px/1.6 ui-monospace,Consolas,monospace;background:var(--sky);border-radius:12px;padding:12px 16px;margin-bottom:10px;word-break:break-word}.typ .ttext span{display:inline;border:0;padding:0;margin:0;width:auto;height:auto;background:none}.typ .ttext .tg{color:var(--ok)}.typ .ttext .tb{color:#fff;background:var(--bad);border-radius:3px}.typ .ttext .tc{border-bottom:3px solid var(--blue)}
.typ textarea{width:100%;font:24px/1.5 ui-monospace,Consolas,monospace;padding:10px 14px;border:2px solid var(--blue);border-radius:12px;resize:none}
.legend span{display:inline-block;padding:2px 10px;border-radius:8px;margin:0 6px 6px 0;font-size:16px}
.kbr.rn{padding-left:0}.times .tq{font-size:52px;font-weight:800;margin:6px 0 10px}.times .qm{color:var(--blue)}.times input{font:inherit;font-size:34px;width:150px;padding:4px 12px;border:3px solid var(--blue);border-radius:12px}

.slogi .ribbon{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f3f6f9;border:2px solid var(--sky2);border-radius:12px;padding:8px 10px;margin-bottom:10px}.slogi .rl{font-size:15px;color:var(--mut);font-weight:600}
.sbtn{font:inherit;background:#fff;border:2px solid #b9c6d3;border-radius:8px;padding:4px 12px;cursor:pointer;min-height:44px}.sbtn:hover{border-color:var(--blue)}.sbtn.on{border-color:var(--blue);background:var(--sky2)}
.sdoc{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.page{flex:1 1 380px;background:#fff;border:1px solid #d5dde5;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:18px 26px;min-height:200px}
.para{margin:0 0 6px;padding:3px 6px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-family:Calibri,Arial,sans-serif}.para:hover{background:#f6f9fc}.para.sel{border-color:var(--blue);background:var(--sky)}.para.wrong{border-color:var(--bad);background:var(--badbg)}
.st0{font-size:30px;font-weight:300;color:#1d2b3a}.st1{font-size:23px;color:#2E5C8A;font-weight:600}.st2{font-size:19px;color:#4a7fb3;font-weight:600}.st3{font-size:16px;color:#1d2b3a}
.sbtn.st0{font-size:20px}.sbtn.st1{font-size:18px}.sbtn.st2{font-size:16px}.sbtn.st3{font-size:15px}
.nav{flex:0 1 230px;min-width:200px;border:2px solid var(--sky2);border-radius:10px;padding:8px 10px;background:#fafcfe}.navh{font-size:14px;font-weight:700;color:var(--mut);margin-bottom:6px}
.nv{font-size:15px;padding:2px 0;color:var(--blue);font-weight:400}.nv.st0{font-weight:700}.nv.st1{padding-left:10px}.nv.st2{padding-left:26px;font-size:14px}
.btn.go2:hover:not(:disabled){background:#244a70}
/* zrcali: simetrija na mreži */
.zr{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.zgw{position:relative;width:max-content;border:3px solid var(--blue);border-radius:6px;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.zg{display:grid}
.zcell{width:var(--zc);height:var(--zc);border:1px solid #c9d4df;position:relative;cursor:pointer;transition:background .12s}
.zcell.tuja{background:#f6f8fa;cursor:default}.zcell.dano{cursor:default}
.zcell:not(.tuja):not(.dano):hover{box-shadow:inset 0 0 0 3px var(--sky2)}

.zcell.par{outline:4px solid #ffb347;outline-offset:-4px;z-index:2}
.zcell.zok{animation:zok .6s ease-out}@keyframes zok{50%{transform:scale(1.12)}}
.zaxis{position:absolute;pointer-events:none;z-index:3}

.zrun{font-size:20px;padding:10px 20px}

.sb.var{background:#FF8C1A;border-color:#DB6E00}.sb.pen{background:#0FBD8C;border-color:#0B8E69}.tool.sb.var:hover{background:#f07c00}.tool.sb.pen:hover{background:#0aa57a}
.vpill{display:inline-block;background:#FF8C1A;color:#fff;border:1px solid #DB6E00;border-radius:10px;padding:0 7px;margin:0 2px}.sb.var .vpill{background:#fff;color:#c45f00}

</style></head><body><div id="app"></div><script>window.PAGE={"title": "Slika v Wordu", "screens": [{"type": "info", "title": "Odpri svoj dokument", "html": "\n<p class=\"big\">Odpri dokument <b>Savinjska dolina</b>, ki si ga naredil/a pri prejšnji uri.</p>\n<div class=\"box\">1. Odpri <b>Word</b>.<br>2. Klikni <b>Odpri</b> in v mapi <b>Dokumenti</b> poišči <b>Savinjska dolina</b>.</div>\n<p class=\"small\"><b>Dokumenta ne najdeš?</b> Odpri prazen dokument, prilepi besedilo (Ctrl + V) in izberi sloge: prva vrstica Naslov, Narava, Kmetijstvo, Zgodovina Naslov 1, ostali kratki naslovi Naslov 2.</p>\n<textarea id=\"besedilo\" rows=\"6\" readonly style=\"width:100%;font:15px/1.4 Calibri,Arial,sans-serif;padding:8px;border:2px solid #b9c6d3;border-radius:10px\">Savinjska dolina\nSavinjska dolina leži ob reki Savinji, med Celjem in Logarsko dolino.\nNarava\nReka Savinja\nSavinja izvira nad Logarsko dolino in se pri Zidanem Mostu izlije v Savo.\nKmetijstvo\nHmelj\nHmelju pravijo zeleno zlato. Raste ob visokih žicah.\nZgodovina\nRimska nekropola\nV Šempetru so ohranjeni rimski nagrobniki, stari skoraj 2000 let.</textarea>\n<p><button class=\"btn go2\" onclick=\"var t=document.getElementById('besedilo');t.focus();t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}this.textContent=ok?'✅ Kopirano':'Besedilo je označeno: pritisni Ctrl + C'\">📋 Kopiraj besedilo</button></p>"}, {"type": "order", "title": "Kako prideš do slike?", "intro": "<div>Sliko boš kopiral/a s te strani. Uredi korake v pravi vrstni red.</div>", "items": ["Na tej strani z desnim klikom klikni sliko in izberi <b>Kopiraj sliko</b>.", "V Wordu klikni na konec odstavka o hmelju (za »visokih žicah.«).", "Pritisni <b>Enter</b>, da dobiš novo vrstico.", "Pritisni <b>Ctrl + V</b>, da prilepiš sliko."], "hints": ["Najprej moraš sliko imeti v odložišču, šele nato jo lahko prilepiš.", "Preden prilepiš, mora biti kazalka v Wordu na pravem mestu."]}, {"type": "check", "title": "Vstavi sliko", "label": " jo sami. */
(function () {
  const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // Napredek je vezan na prijavljenega učenca in celo pot strani: računalniki so skupni, imena korakov se ponavljajo med urami.
  const PROFIL = (() => { try { return JSON.parse(localStorage.getItem('brihta_profile_v1') || 'null') || {}; } catch (e) { return {}; } })();
  const UID = PROFIL.id || '';
  const KEY = 'brihta_ura8:' + UID + ':' + decodeURIComponent(location.pathname);
  const load = () => { try { return parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) { return 0; } };
  const save = (v) => { try { localStorage.setItem(KEY, String(v)); } catch (e) {} };

  const tell = (stanje) => { try { if (window.parent !== window) window.parent.postMessage({ tip: 'brihta-korak', stanje }, '*'); } catch (e) {} };
  const P = window.PAGE;
  const screens = P.screens.concat([{ type: 'end' }]);
  let cur = Math.min(load(), screens.length - 1);
  let best = cur;

  const app = document.getElementById('app');
  app.innerHTML = `
    <header><h1>${esc(P.title)}</h1><div class="dots" id="dots"></div></header>
    <main id="card"></main>
    <footer>
      <button class="btn ghost" id="back">◀ Nazaj</button>
      <span class="sp"></span>
      <button class="btn hint" id="hint">💡 Namig</button>
      <button class="btn ghost" id="solve" hidden>Pokaži rešitev</button>
      <button class="btn ghost" id="skip" hidden>Preskoči</button>
      <button class="btn go" id="next" disabled>Naslednja naloga ▶</button>
    </footer>`;
  const card = document.getElementById('card');
  const bNext = document.getElementById('next'), bBack = document.getElementById('back');
  const bHint = document.getElementById('hint'), bSolve = document.getElementById('solve'), bSkip = document.getElementById('skip');

  function dots() {
    const d = document.getElementById('dots');
    d.innerHTML = screens.slice(0, -1).map((s, i) => `<span class="dot${i < best || i < cur ? ' ok' : ''}${i === cur ? ' now' : ''}"></span>`).join('') +
      `<span class="cnt">${Math.min(cur + 1, screens.length - 1)} / ${screens.length - 1}</span>`;
  }

  let solver = null, hintN = 0, poskusi = 0, resitev = false, podatki = null, napake = 0;
  /* Namigi in rešitev se odklepajo s poskusi (Nino, 26. 11. 2026: učenci so klikali Namig, dokler niso dobili rešitve).

     Velja za naloge, kjer učenec rešuje sam; pri igrah (ugibanje, karte, tipkanje) so namigi strategija in so prosti.
     preveri.py (navigator.webdriver) zaklepa ne upošteva. */
  const ZAKLEP = { choose: 1, order: 1, match: 1, grid: 1, risar: 1, trace: 1, zrcali: 1, slogi: 1 };
  const TEST = navigator.webdriver === true;
  const zaklenjeno = () => !TEST && ZAKLEP[screens[cur].type];

  const IZD = P.izdelki;   // {ura: 'racunalnistvo-3/2026-11-06-simetrija'}

  TYPES.grid = (s, c) => {

  /* ---- diagram poteka (SVG) ---- */
  const FN = [

  function flowSVG() {

    let h = `<svg viewBox="0 0 590 500" class="flow" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>`;

    const lab = (x, y, t) => `<text x="${X(x)}" y="${Y(y)}" class="lab">${t}</text>`;
    h += ln([[3.5, 8.6], [3.5, 8.3]], 1) + ln([[3.5, 7.5], [3.5, 7.2]], 1) + ln([[3.5, 6.4], [3.5, 6.0]], 1);

    h += ln([[3.5, 4.7], [3.5, 4.1]], 1) + lab(3.65, 4.3, 'ne');

    h += ln([[1.7, 1.35], [1.7, 0.8], [5.3, 0.8], [5.3, 1.35]], 0) + ln([[1.7, 0.8], [0.3, 0.8], [0.3, 6.8], [1.55, 6.8]], 1);

  TYPES.trace = (s, c) => {

    let i = 0, waitAns = false;
    const mark = () => { Object.values(nodes).forEach((g) => g.classList.remove('cur')); nodes[s.path[i].n].classList.add('cur'); s.path.slice(0, i).forEach((p) => nodes[p.n].classList.add('was')); };
    function ask() {
      const p = s.path[i];
      if (p.a) {
        waitAns = true;
        qa.innerHTML = `<p><b>${p.q}</b></p><button class="btn ans">da</button> <button class="btn ans">ne</button>`;
        qa.querySelectorAll('.ans').forEach((b) => (b.onclick = () => {
          if (b.textContent === p.a) { waitAns = false; feedback('✅ ' + (p.why || 'Prav.') + ' Zdaj klikni lik, kamor kaže puščica »' + p.a + '«.', ''); qa.innerHTML = `<p>Odgovor: <b>${p.a}</b></p>`; }

    }
    Object.values(nodes).forEach((g) => (g.onclick = () => {
      if (i >= s.path.length - 1) return;
      if (waitAns) { feedback('Najprej odgovori na vprašanje: da ali ne?', 'hint'); return; }
      if (g.dataset.id === s.path[i + 1].n) { i++; mark(); if (i === s.path.length - 1) { qa.innerHTML = ''; done('✅ ' + s.win); } else ask(); }
      else { g.classList.add('no'); setTimeout(() => g.classList.remove('no'), 450); feedback('❌ Ne še. Sledi puščici iz obarvanega lika.', 'bad'); }
    }));
    mark(); ask();
    return { solve: () => { i = s.path.length - 1; mark(); qa.innerHTML = ''; } };
  };

  TYPES.guess = (s, c) => {
    const secret = 1 + Math.floor(Math.random() * 100); let tries = 0;
    const w = $(`<div class="guess"><p>Računalnik si je izmislil število od <b>1</b> do <b>100</b>.</p>
      <div class="row"><input type="number" min="1" max="100" inputmode="numeric" placeholder="ugib"><button class="btn go2">Ugibaj</button></div>
      <ul class="hist"></ul></div>`);
    c.appendChild(w);
    const inp = w.querySelector('input'), hist = w.querySelector('.hist');
    const go = () => {
      const v = parseInt(inp.value, 10);
      if (!(v >= 1 && v <= 100)) { feedback('Vpiši celo število od 1 do 100.', 'hint'); return; }
      tries++;
      const r = v === secret ? 'Bravo!' : v < secret ? 'Več!' : 'Manj!';
      hist.insertAdjacentHTML('afterbegin', `<li><b>${v}</b> → ${r}</li>`); inp.value = ''; inp.focus();
      if (v === secret) { w.querySelector('.go2').disabled = true; done(`✅ Uganil/a si v <b>${tries}</b> poskusih. ${tries <= 7 ? 'Odlično, to je pametna strategija!' : 'Namig za naslednjič: vedno ugibaj <b>sredino</b> (50, nato 25 ali 75 …). Tako nikoli ne rabiš več kot 7 poskusov.'}`); }
      else feedback(r === 'Več!' ? '⬆ Število je <b>večje</b>.' : '⬇ Število je <b>manjše</b>.', '');
    };
    w.querySelector('.go2').onclick = go; inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    return { solve: () => { hist.insertAdjacentHTML('afterbegin', `<li>Skrito število je bilo <b>${secret}</b>.</li>`); } };
  };

  TYPES.cards = (s, c) => {
    const nums = shuffle(Array.from({ length: 90 }, (_, i) => i + 10)).slice(0, s.n || 8);
    const w = $(`<div class="cards"><div class="deck"></div>
      <div class="memo">V glavi si zapomnim: <span class="mem">nič</span> &nbsp; · &nbsp; Primerjav: <b class="cmp">0</b></div>
      <div class="ctrl"></div></div>`);
    c.appendChild(w);
    const deck = w.querySelector('.deck'), ctrl = w.querySelector('.ctrl'), memEl = w.querySelector('.mem'), cmpEl = w.querySelector('.cmp');
    const cs = nums.map((v) => { const d = $(`<div class="card">?</div>`); deck.appendChild(d); return d; });
    let i = 0, mem = null, cmp = 0;
    function turn() {
      cs[i].textContent = nums[i]; cs[i].classList.add('up');
      if (mem === null) { ctrl.innerHTML = `<button class="btn" data-a="keep">Zapomni si ${nums[i]}</button>`; }
      else ctrl.innerHTML = `<p>Primerjaj: karta <b>${nums[i]}</b> ali v glavi <b>${mem}</b>?</p><button class="btn" data-a="keep">${nums[i]} je večje: zapomni si ${nums[i]}</button> <button class="btn" data-a="drop">${nums[i]} je manjše: zavrzi karto</button>`;
      ctrl.querySelectorAll('button').forEach((b) => (b.onclick = () => act(b.dataset.a)));
    }
    function act(a) {
      const v = nums[i];
      if (mem !== null) {
        const right = v > mem ? 'keep' : 'drop';
        if (a !== right) { feedback(`❌ Pozor: ${v} je ${v > mem ? 'VEČJE' : 'MANJŠE'} od ${mem}. Poskusi znova.`, 'bad'); return; }
        cmp++; cmpEl.textContent = cmp;
      }
      if (a === 'keep') mem = v;
      memEl.textContent = mem; cs[i].classList.add(a === 'keep' ? 'kept' : 'gone');
      feedback(a === 'keep' ? 'Zapomnil/a si novo največje število.' : 'Karto zavržeš, v glavi ostane ' + mem + '.', '');
      i++;
      if (i < nums.length) { ctrl.innerHTML = `<button class="btn go2">Obrni naslednjo karto</button>`; ctrl.querySelector('button').onclick = turn; }
      else { ctrl.innerHTML = ''; done(`✅ Največje število je <b>${mem}</b>. Pri ${nums.length} kartah si naredil/a <b>${cmp}</b> primerjav. Prvo karto si si samo zapomnil/a, vsako naslednjo pa enkrat primerjal/a.`); }
    }
    ctrl.innerHTML = `<button class="btn go2">Obrni prvo karto</button>`; ctrl.querySelector('button').onclick = turn;
    return { solve: () => { cs.forEach((d, k) => { d.textContent = nums[k]; d.classList.add('up'); }); mem = Math.max(...nums); memEl.textContent = mem; ctrl.innerHTML = ''; } };
  };

  /* ---------- tipkovnica (slovenska QWERTZ) ---------- */
  const KB = [['q','w','e','r','t','z','u','i','o','p','š','đ'], ['a','s','d','f','g','h','j','k','l','č','ć','ž'], ['y','x','c','v','b','n','m',',','.','-']];
  const FING = { '1':'lm','2':'lp','3':'ls','4':'lk','5':'lk','6':'dk','7':'dk','8':'ds','9':'dp','0':'dm', q:'lm',a:'lm',y:'lm', w:'lp',s:'lp',x:'lp', e:'ls',d:'ls',c:'ls', r:'lk',f:'lk',v:'lk',t:'lk',g:'lk',b:'lk',
    z:'dk',h:'dk',n:'dk',u:'dk',j:'dk',m:'dk', i:'ds',k:'ds',',':'ds', o:'dp',l:'dp','.':'dp', p:'dm','č':'dm','š':'dm','đ':'dm','ć':'dm','ž':'dm','-':'dm', ' ':'pa' };
  const FNAME = { lm:'levi mezinec', lp:'levi prstanec', ls:'levi sredinec', lk:'levi kazalec', dk:'desni kazalec', ds:'desni sredinec', dp:'desni prstanec', dm:'desni mezinec', pa:'palec' };
  // Če je na računalniku nastavljena angleška razporeditev, tipka Č pošlje »;«.
  const norm = (k) => { k = (k || '').toLowerCase(); return k === ';' ? 'č' : k; };
  function keyboard(digits) {
    const w = $(`<div class="kb"></div>`);
    if (digits) { const d = $(`<div class="kbr rn"></div>`); '1234567890'.split('').forEach((k) => d.appendChild($(`<span class="kk f-${FING[k]}" data-k="${k}">${k}</span>`))); w.appendChild(d); }
    KB.forEach((row, r) => {
      const d = $(`<div class="kbr r${r}"></div>`);
      row.forEach((k) => d.appendChild($(`<span class="kk f-${FING[k]}${k === 'f' || k === 'j' ? ' bump' : ''}" data-k="${esc(k)}">${esc(k.toUpperCase())}</span>`)));
      w.appendChild(d);
    });
    w.appendChild($(`<div class="kbr"><span class="kk f-pa space" data-k=" ">presledek</span></div>`));
    w.mark = (k) => { w.querySelectorAll('.kk').forEach((e) => e.classList.toggle('hot', e.dataset.k === k)); };
    return w;
  }

  // Pritisni označeno tipko. s.keys: niz dovoljenih tipk, s.n: koliko pravilnih, s.min: najmanjša natančnost v %.
  TYPES.keys = (s, c) => {
    const pool = (s.keys || 'asdfjklč').split('');
    const need = s.n || 20, min = s.min || 85;
    const w = $(`<div class="keys"><div class="target"><span class="tkey"></span><span class="tfing"></span></div>
      <div class="kstat">Pravilno: <b class="ok">0</b> / ${need} &nbsp;·&nbsp; Narobe: <b class="no">0</b></div></div>`);
    c.appendChild(w); const kb = keyboard(s.digits || /[0-9]/.test(pool.join(''))); c.appendChild(kb);
    const tk = w.querySelector('.tkey'), tf = w.querySelector('.tfing'), okE = w.querySelector('.ok'), noE = w.querySelector('.no');
    let ok = 0, no = 0, want = '', fin = false;
    const pick = () => { let k; do { k = pool[Math.floor(Math.random() * pool.length)]; } while (k === want && pool.length > 1); want = k;
      tk.textContent = k === ' ' ? '␣' : k.toUpperCase(); tf.textContent = FNAME[FING[k]]; if (s.showKb !== false) kb.mark(k); };
    const onkey = (e) => {
      if (fin || !document.body.contains(w)) { document.removeEventListener('keydown', onkey); return; }
      if (e.key.length !== 1 && e.key !== ';') return;
      e.preventDefault();
      if (norm(e.key) === want) { ok++; okE.textContent = ok; tk.classList.remove('miss'); }
      else { no++; noE.textContent = no; tk.classList.remove('miss'); void tk.offsetWidth; tk.classList.add('miss'); return; }
      if (ok >= need) {
        const acc = Math.round(100 * ok / (ok + no));
        if (acc >= min) { fin = true; kb.mark(''); tk.textContent = '✓'; tf.textContent = ''; done(`✅ Natančnost: <b>${acc} %</b>. ${s.win || 'Odlično!'}`); }
        else { feedback(`Natančnost je ${acc} %, potrebuješ vsaj ${min} %. Začni znova in počasneje. Natančnost je pomembnejša od hitrosti.`, 'bad'); ok = 0; no = 0; okE.textContent = 0; noE.textContent = 0; pick(); }
        return;
      }
      pick();
    };
    document.addEventListener('keydown', onkey); pick();
    feedback('Postavi prste na osnovno vrsto in pritisni označeno tipko. Ne glej na tipkovnico, glej sem.', '');
    return { solve: () => { fin = true; document.removeEventListener('keydown', onkey); kb.mark(''); } };
  };

  // Natipkaj besedilo. s.text, s.min (%), s.save: shrani kot izhodišče, s.compare: primerjaj z izhodiščem.
  const BKEY = 'brihta_tipkanje_izhodisce:' + UID;
  function lev(a, b) {
    const m = a.length, n = b.length; let p = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) { const q = [i]; for (let j = 1; j <= n; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = q; }
    return p[n];
  }
  TYPES.type = (s, c) => {
    const min = s.min === undefined ? 90 : s.min;
    const w = $(`<div class="typ"><div class="ttext"></div>
      <textarea rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Tipkaj tukaj …"></textarea>
      <div class="row"><button class="btn go2">Preveri</button> <span class="small">ali pritisni Enter</span></div></div>`);
    c.appendChild(w);
    const tt = w.querySelector('.ttext'), ta = w.querySelector('textarea'), btn = w.querySelector('.go2');
    tt.innerHTML = [...s.text].map((ch) => `<span>${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
    const spans = tt.querySelectorAll('span');
    let t0 = 0, fin = false;
    ta.onpaste = (e) => { e.preventDefault(); feedback('Lepljenje ne šteje. Natipkaj sam/a. 🙂', 'hint'); };
    ta.oninput = () => {
      if (!t0 && ta.value) t0 = Date.now();
      const v = ta.value.replace(/;/g, 'č').replace(/:/g, 'Č');
      spans.forEach((sp, i) => { sp.className = i < v.length ? (v[i] === s.text[i] ? 'tg' : 'tb') : i === v.length ? 'tc' : ''; });
    };
    const check = () => {
      if (fin) return;
      const v = ta.value.replace(/\n/g, '').replace(/;/g, 'č').replace(/:/g, 'Č').trimEnd();
      if (v.length < s.text.length * 0.8) { feedback('Natipkaj celo vrstico do konca, nato klikni Preveri.', 'hint'); return; }
      const acc = Math.max(0, Math.round(100 * (1 - lev(v, s.text) / s.text.length)));
      const sec = Math.max(1, (Date.now() - (t0 || Date.now())) / 1000);
      const wpm = Math.round((v.length / 5) / (sec / 60));
      let msg = `Natančnost: <b>${acc} %</b> &nbsp;·&nbsp; hitrost: <b>${wpm}</b> besed na minuto`;
      if (s.save) { try { if (!localStorage.getItem(BKEY)) localStorage.setItem(BKEY, JSON.stringify({ acc, wpm })); } catch (e) {} }
      if (s.compare) { let b = null; try { b = JSON.parse(localStorage.getItem(BKEY) || 'null'); } catch (e) {}
        if (b) msg += `<br>Na začetku ure: <b>${b.acc} %</b> in <b>${b.wpm}</b> besed na minuto. ${acc >= b.acc ? 'Natančnost se je izboljšala ali ostala enaka. 💪' : 'Natančnost je nižja kot na začetku: upočasni in ne glej tipk.'}`; }
      if (acc >= min) { fin = true; ta.disabled = true; btn.disabled = true; done('✅ ' + msg + (s.win ? '<br>' + s.win : '')); }
      else { feedback(`${msg}<br>❌ Potrebuješ vsaj <b>${min} %</b>. Pobriši in poskusi znova, počasneje.`, 'bad'); ta.value = ''; t0 = 0; ta.oninput(); ta.focus(); }
    };
    btn.onclick = check; ta.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
    ta.oninput(); setTimeout(() => ta.focus(), 50);
    return { solve: () => { fin = true; ta.value = s.text; ta.oninput(); ta.disabled = true; btn.disabled = true; } };
  };

  // Poštevanka s tipkanjem. s.tables: [2,3,...], s.n: koliko pravilnih, s.save/compare: čas
  const TKEY = 'brihta_postevanka_cas:' + UID;
  TYPES.times = (s, c) => {
    const tabs = s.tables || [2, 3, 4, 5], need = s.n || 10;
    const w = $(`<div class="times"><div class="tq"></div>
      <div class="row"><input type="text" inputmode="numeric" autocomplete="off" placeholder="?"><button class="btn go2">OK</button></div>
      <div class="kstat">Pravilno: <b class="ok">0</b> / ${need} &nbsp;·&nbsp; Napak: <b class="no">0</b></div></div>`);
    c.appendChild(w); const kb = keyboard(true); c.appendChild(kb);
    const q = w.querySelector('.tq'), inp = w.querySelector('input'), okE = w.querySelector('.ok'), noE = w.querySelector('.no'), btn = w.querySelector('.go2');
    let a = 0, b = 0, ok = 0, no = 0, t0 = 0, fin = false, last = '';
    const next = () => { let k; do { a = tabs[Math.floor(Math.random() * tabs.length)]; b = 1 + Math.floor(Math.random() * 10); k = a + 'x' + b; } while (k === last); last = k;
      q.innerHTML = `${a} · ${b} = <span class="qm">?</span>`; inp.value = ''; inp.focus(); };
    const go = () => {
      if (fin) return; const v = inp.value.trim(); if (!v) return;
      if (!t0) t0 = Date.now();
      if (parseInt(v, 10) === a * b) { ok++; okE.textContent = ok; feedback('✅ ' + a + ' · ' + b + ' = ' + (a * b), 'ok'); }
      else { no++; noE.textContent = no; feedback(`❌ ${a} · ${b} = <b>${a * b}</b>, ne ${esc(v)}. Pogledaj zaslon, ne tipk.`, 'bad'); }
      if (ok >= need) {
        fin = true; inp.disabled = true; btn.disabled = true;
        const sec = Math.round((Date.now() - t0) / 1000);
        let msg = `Čas: <b>${sec} s</b> &nbsp;·&nbsp; napak: <b>${no}</b>.`;
        if (s.save) { try { localStorage.setItem(TKEY, String(sec)); } catch (e) {} }
        if (s.compare) { let p = null; try { p = parseInt(localStorage.getItem(TKEY), 10); } catch (e) {}
          if (p) msg += ` Prej: <b>${p} s</b>. ${sec < p ? 'Hitrejši/a si! 🚀' : 'Tokrat počasneje, nič hudega: natančnost je pomembnejša.'}`; }
        done('✅ ' + msg + (s.win ? '<br>' + s.win : ''));
        return;
      }
      next();
    };
    btn.onclick = go; inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    next(); feedback('Natipkaj rezultat s številkami v zgornji vrsti tipkovnice in pritisni Enter.', '');
    return { solve: () => { fin = true; inp.disabled = true; btn.disabled = true; q.innerHTML = `${a} · ${b} = ${a * b}`; } };
  };

  // Slogi v urejevalniku besedila. s.paras: [[besedilo, slog, zakaj?], ...]; slogi: 'Naslov', 'Naslov 1', 'Naslov 2', 'Navadno'.
  const SLOGI = ['Naslov', 'Naslov 1', 'Naslov 2', 'Navadno'];
  const scls = (st) => 'st' + SLOGI.indexOf(st);
  TYPES.slogi = (s, c) => {
    const styles = s.styles || SLOGI;
    const w = $(`<div class="slogi"><div class="ribbon"><span class="rl">Slogi:</span></div>
      <div class="sdoc"><div class="page"></div><div class="nav"><div class="navh">Podokno za krmarjenje</div><div class="navl"></div></div></div>
      <div class="row"><button class="btn go2">Preveri</button> <span class="small">Klikni odstavek, nato slog zgoraj.</span></div></div>`);
    c.appendChild(w);
    const page = w.querySelector('.page'), navl = w.querySelector('.navl'), rib = w.querySelector('.ribbon'), btn = w.querySelector('.go2');
    const cur = s.paras.map((p) => p[3] || 'Navadno');
    let sel = 0, fin = false;
    const P = s.paras.map((p, i) => { const d = $(`<p class="para" tabindex="0"></p>`); d.textContent = p[0];
      d.onclick = () => { sel = i; draw(); }; page.appendChild(d); return d; });
    const B = styles.map((st) => { const b = $(`<button class="sbtn ${scls(st)}">${st}</button>`);
      b.onclick = () => { if (fin) return; cur[sel] = st; P[sel].classList.remove('wrong'); if (sel < P.length - 1) sel++; draw(); }; rib.appendChild(b); return b; });
    function draw() {
      P.forEach((d, i) => { d.className = 'para ' + scls(cur[i]) + (i === sel && !fin ? ' sel' : '') + (d.classList.contains('wrong') ? ' wrong' : ''); });
      B.forEach((b, k) => b.classList.toggle('on', cur[sel] === styles[k]));
      const h = s.paras.map((p, i) => [p[0], cur[i]]).filter((x) => x[1] !== 'Navadno');
      navl.innerHTML = h.length ? h.map((x) => `<div class="nv ${scls(x[1])}">${esc(x[0])}</div>`).join('') : '<div class="small">Tu se pokažejo naslovi.</div>';
    }
    function why(i) {
      const [t, st, z] = s.paras[i]; if (z) return z;
      if (st === 'Naslov') return `»${esc(t)}« je ime celega besedila na vrhu. Zanj je slog <b>Naslov</b>.`;
      if (st === 'Naslov 1') return `»${esc(t)}« je kratek naslov poglavja. Zanj je slog <b>Naslov 1</b>.`;
      if (st === 'Naslov 2') { let k = i; while (k >= 0 && s.paras[k][1] !== 'Naslov 1') k--;
        return `»${esc(t)}« je manjši del znotraj poglavja »${esc(k >= 0 ? s.paras[k][0] : '')}«. Zanj je slog <b>Naslov 2</b>.`; }
      return `»${esc(t.length > 40 ? t.slice(0, 40) + ' …' : t)}« je cel stavek z razlago, torej navaden odstavek. Zanj je slog <b>Navadno</b>.`;
    }
    btn.onclick = () => {
      if (fin) return;
      const bad = s.paras.map((p, i) => (cur[i] === p[1] ? -1 : i)).filter((i) => i >= 0);
      P.forEach((d, i) => d.classList.toggle('wrong', bad.includes(i)));
      if (!bad.length) { fin = true; draw(); done('✅ ' + (s.win || 'Vsi slogi so pravi. Poglej podokno za krmarjenje: to je zemljevid tvojega besedila.')); return; }
      sel = bad[0]; draw();
      feedback(`❌ Narobe ${bad.length === 1 ? 'je 1 odstavek' : bad.length === 2 ? 'sta 2 odstavka' : bad.length < 5 ? 'so ' + bad.length + ' odstavki' : 'je ' + bad.length + ' odstavkov'} (rdeče). ${why(bad[0])}`, 'bad');
    };
    draw();
    return { solve: () => { s.paras.forEach((p, i) => (cur[i] = p[1])); P.forEach((d) => d.classList.remove('wrong')); fin = true; draw(); } };
  };

  /* ---------- zrcali: simetrija na mreži z barvami ----------
     {type:'zrcali', title, intro, os:'v'|'h', pol:['..R', ...], obrni:False, demo:False, hints}
       pol = dana polovica (pri 'v' levi stolpci, pri 'h' zgornje vrstice); '.' je prazno polje.
       obrni = dana polovica je desno / spodaj. demo = učenec samo pogleda, kako se zrcali.
     {type:'zrcali', prosto:True, w:12, h:10, os:'v'|'h', barve:'RYGB'}  prosto ustvarjanje, zrcalo riše samo. */
  const BARVE = { R: ['#ef4444', 'rdeča'], Y: ['#facc15', 'rumena'], G: ['#22c55e', 'zelena'], B: ['#3b82f6', 'modra'],
    O: ['#fb923c', 'oranžna'], P: ['#a855f7', 'vijolična'], K: ['#92400e', 'rjava'], C: ['#1f2937', 'črna'] };
  const stevilo = (n, a, b, c) => n === 1 ? a : n === 2 ? b : c;
  /* ---- risar: pisalo kot v Scratchu (pojdi, obrni se, ponovi, spremenljivka dolžina, če, barva pisala) ---- */
  const RBARVA = { g: '#0FBD8C', r: '#E6443C', v: '#9966FF' }, RIME = { g: 'zelena', r: 'rdeča', v: 'vijolična' };
  const VAR = '<span class="vpill">dolžina</span>';
  function rLab(t, zapri) {
    const k = t[0], v = t.slice(1);
    if (t === 'FV') return `pojdi ${VAR} korakov`;
    if (k === 'F') return `pojdi <b>${v}</b> korakov`;
    if (k === 'T') return `obrni se ↻ <b>${v}</b>°`;
    if (k === 'Q') return `obrni se ↺ <b>${v}</b>°`;
    if (k === 'N') return `ponovi <b>${v}</b>-krat`;
    if (k === 'S') return `nastavi ${VAR} na <b>${v}</b>`;
    if (k === 'A') return `spremeni ${VAR} za <b>${v}</b>`;
    if (k === 'I') return `če <span class="opill">${VAR} ${v[0] === '<' ? '&lt;' : '&gt;'} <b>${v.slice(1)}</b></span> potem`;
    if (k === 'E') return 'sicer';
    if (k === 'C') return `nastavi barvo pisala na <span class="cpill" style="background:${RBARVA[v]}"></span> ${RIME[v]}`;
    return zapri === 'I' ? 'konec če' : 'konec ponovi';

        else if (m === '.' && t !== '.') manjka++;
        // je lik samo prerisal (premaknil), ne zrcalil?
        const pr = V ? (s.obrni ? D(r, q + W / 2) : D(r, q - W / 2)) : (s.obrni ? D(r + H / 2, q) : D(r - H / 2, q));
        if (pr !== m) prerisal = false;
      }
      if (!napMesto && !napBarva && !manjka) {
        fin = true; celice.forEach((d) => d.classList.add('zok'));
        done('✅ ' + (s.win || 'Odlično! Slika je simetrična.')); return;
      }
      if (prerisal && napMesto) nap.prerisal++;
      else { if (napMesto) nap.mesto++; if (napBarva) nap.barva++; if (!napMesto && !napBarva && manjka) nap.manjka++; }
      const sim = (V ? 'v isti vrsti' : 'v istem stolpcu');
      let t;
      if (!imaKaj) t = 'Mreža na tvoji strani je še prazna. Začni pri kvadratkih, ki se dotikajo črte.';
      else if (prerisal && napMesto) t = '🪞 Lik si samo <b>prerisal/a</b>. Zrcalo ga obrne: kar je pri črti, ostane pri črti. Kar je daleč od črte, je daleč tudi na drugi strani.';
      else if (napMesto) t = `✖ ${stevilo(napMesto, 'En kvadratek je', 'Dva kvadratka sta', napMesto + ' kvadratkov je')} na napačnem mestu (označeno s ✖). Par mora biti <b>enako daleč od črte</b> in ${sim}. Preštej kvadratke do črte.`;
      else if (napBarva) t = `🎨 Mesto je pravo, <b>barva pa ne</b> (${stevilo(napBarva, 'en obkrožen kvadratek', 'dva obkrožena kvadratka', napBarva + ' obkroženih kvadratkov')}). V zrcalu ima par enako barvo.`;
      else t = `Skoraj! Manjka še ${stevilo(manjka, 'en kvadratek', 'dva kvadratka', manjka + ' kvadratkov')}. Poišči kvadratek na liku, ki še nima para.`;
      if (napMesto && napBarva) t += ` Tudi barva ni prava pri ${napBarva} (obkroženo).`;
      if ((napMesto || napBarva) && manjka) t += ` Manjka še ${manjka}.`;
      feedback('❌ ' + t, 'bad');
    };
    if (!s.hints && !s.demo && !s.prosto) s.hints = [
      `Izberi en kvadratek lika. Preštej, koliko kvadratkov je oddaljen od črte.`,
      `Njegov par je na drugi strani črte, <b>enako daleč</b> od nje, ${V ? 'v isti vrsti' : 'v istem stolpcu'}.`,
      'Začni s kvadratki, ki se dotikajo črte: njihov par se črte tudi dotika.'];
    bHint.hidden = !(s.hints || []).length || cur < best;
    return {
      solve: s.demo || s.prosto ? null : () => { resitevNarisi(); fin = true; celice.forEach((d) => d.classList.remove('zx', 'zo')); },
      podatki: () => ({ os: V ? 'v' : 'h', w: W, h: H, dano: dano, moje: M.map((v) => v.join('')), prosto: !!s.prosto, napake: nap }),
    };
  };

  /* Lupa: klik na sliko v razlagi ali navodilu (ne v odgovoru) jo poveča čez cel zaslon. */
  card.addEventListener('click', (e) => {
    const m = e.target.closest('.mini'); if (!m || m.closest('button, .opt')) return;
    const st = getComputedStyle(m).gridTemplateColumns.split(' ').length;
    const vr = Math.ceil(m.querySelectorAll('span:not(.os)').length / st);
    const v = Math.max(24, Math.floor(Math.min((window.innerWidth * 0.9) / st, (window.innerHeight - 120) / vr)));
    const k = m.cloneNode(true); k.style.setProperty('--m', v + 'px');
    const o = $('<div class="lupa" role="dialog" aria-label="Povečana slika"></div>');
    o.appendChild(k); o.appendChild($('<button class="zapri">✕ Zapri</button>'));
    const zapri = () => { o.remove(); document.removeEventListener('keydown', esc_); };
    const esc_ = (ev) => { if (ev.key === 'Escape') zapri(); };
    o.onclick = zapri; document.addEventListener('keydown', esc_);
    document.body.appendChild(o);
  });

  tell('zacetek');
  function zacni() {
    if (IZD && UID) {
      const ime = PROFIL.display_name || PROFIL.username || '';
      document.querySelector('header').appendChild($(`<div class="kdo" title="Tvoje delo se shranjuje za učitelja.">💾 ${esc(PROFIL.emoji || '👤')} ${esc(ime)}</div>`));
      zabelezi('_zacetek', -1, { naslov: 'Odprl/a stran', vrsta: 'zacetek', stanje: 'odprto' });
    }
    show(cur);
  }
  if (IZD && !UID) {
    document.querySelector('footer').hidden = true;
    card.innerHTML = `<div class="gate"><div class="big-ic">🔐</div><h2>Najprej se prijavi</h2>
      <p class="big">Tvoje risbe se shranijo za učitelja. Zato se moraš prijaviti.</p>
      <p>Na Brihti zgoraj desno klikni <b>Prijava</b> in vpiši svoje ime in geslo.<br>Nato klikni zeleni gumb.</p>
      <button class="btn go" id="gate-ok">Prijavil/a sem se ✔</button>
      <p class="small"><button class="linkbtn" id="gate-go">Nadaljuj brez shranjevanja (samo za učitelja)</button></p></div>`;
    card.querySelector('#gate-ok').onclick = () => location.reload();
    card.querySelector('#gate-go').onclick = () => { document.querySelector('footer').hidden = false; zacni(); };
  } else { zacni(); izprazni(); }
})();
</script></body></html>
