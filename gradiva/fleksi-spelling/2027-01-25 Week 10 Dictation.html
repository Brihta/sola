<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 10 Dictation</title>
<style>
  :root { --bg: #fffdf7; --ink: #1f2937; --muted: #6b7280; --accent: #16a34a; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --ink: #f3f4f6; --muted: #9ca3af; --accent: #4ade80; --card: #1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { max-width: 900px; width: 100%; text-align: center; }
  .tag { color: var(--accent); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 1rem; }
  h1 { font-size: 1.4rem; margin: 6px 0 24px; color: var(--muted); font-weight: 600; }
  .sentence { background: var(--card); border-radius: 20px; padding: 36px 28px;
              box-shadow: 0 6px 24px rgba(0,0,0,.08);
              font-size: clamp(1.8rem, 5vw, 3.2rem); line-height: 1.35; font-weight: 700; }
  .sentence b { color: var(--accent); }
  .words { margin-top: 20px; color: var(--muted); font-size: 1.05rem; }
</style>
</head>
<body>
<main>
  <div class="tag">Stage 2 · Week 10 · -ies</div>
  <h1>Dictation</h1>
  <p class="sentence">The <b>puppies</b> chase <b>flies</b> while the <b>children</b> play.</p>
  <p class="words">Spelling words: puppies, flies · Star word: children</p>
</main>
</body>
</html>
